name: 'Test Reusable Workflow'
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          scope: '@lodado'

      - name: Install pnpm
        run: npm install -g pnpm@9.0.6

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict architecture contract
        run: pnpm check:architecture

      - name: Lint
        run: pnpm lint

      - name: Static quality checks
        run: pnpm quality

      # 고정 버전·체크섬으로 Bend를 설치한다. ORACLE_REQUIRE_BEND=1이면 설치본이 없을 때 실제 Bend 통합 테스트가
      # skip되지 않고 실패한다 — 커널이 조용히 빠진 초록을 막는다.
      - name: Install pinned Bend
        run: node packages/frontend-oracle-design/skills/frontend-oracle-design/scripts/ensure-bend.mjs

      # `bend --verdict` runs a proof kernel that Bend builds once with Lean into ~/.bend/bendtt. Cache the built
      # kernel per Bend version; only a cache miss downloads the pinned Lean release (sha256 from its GitHub
      # release asset) and builds it by proving the fixture laws.
      - name: Cache the Bend proof kernel
        id: bend-kernel
        uses: actions/cache@v4
        with:
          path: ~/.bend/bendtt
          key: ${{ runner.os }}-bendtt-bend-2.0.34-lean-4.34.0

      - name: Build the Bend proof kernel
        if: steps.bend-kernel.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lean-4.34.0-linux.tar.zst"
          curl -fsSL -o "$archive" https://github.com/leanprover/lean4/releases/download/v4.34.0/lean-4.34.0-linux.tar.zst
          echo "caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b  $archive" | sha256sum -c -
          toolchain="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0"
          mkdir -p "$toolchain"
          tar --zstd -xf "$archive" -C "$toolchain" --strip-components=1
          rm "$archive"
          cd packages/frontend-oracle-design/test-fixtures/stale-search
          node ../../skills/scripts/oracle-model.mjs prove --dir . > "$RUNNER_TEMP/prove.json"
          grep -q '"status":"proven"' "$RUNNER_TEMP/prove.json"
          ls "$HOME"/.bend/bendtt/*/bendtt

      - name: Run tests
        run: pnpm test
        env:
          TSESTREE_SINGLE_RUN: 'false'
          ORACLE_REQUIRE_BEND: '1'
