name: 'Test Reusable Workflow'
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          scope: '@lodado'

      - name: Install pnpm
        run: npm install -g pnpm@9.0.6

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict architecture contract
        run: pnpm check:architecture

      - name: Lint
        run: pnpm lint

      - name: Static quality checks
        run: pnpm quality

      # 고정 버전·체크섬으로 Bend를 설치한다. ORACLE_REQUIRE_BEND=1이면 설치본이 없을 때 실제 Bend 통합 테스트가
      # skip되지 않고 실패한다 — 커널이 조용히 빠진 초록을 막는다.
      - name: Install pinned Bend
        run: node packages/frontend-oracle-design/skills/scripts/ensure-bend.mjs

      - name: Run tests
        run: pnpm test
        env:
          TSESTREE_SINGLE_RUN: 'false'
          ORACLE_REQUIRE_BEND: '1'
