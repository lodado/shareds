name: Integrated Workflow

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    uses: ./.github/workflows/test-reusable.yml
    secrets: inherit

  release:
    # Requires NPM_TOKEN with permission to CREATE new @lodado/* packages (not only update existing).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_NPM_RELEASE == 'true'
    needs:
      - test
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-reusable.yml
    secrets: inherit
