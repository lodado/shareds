<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Object in Orbit — image orbit rail</title>
    <style>
      :root {
        --ink: #17181c;
        --paper: #f7f7f5;
        --stage: #e8e9ec;
        --blue: #0066cc;
        --line: #c8cbd1;
        --sans: Inter, ui-sans-serif, system-ui, sans-serif;
        --focus: #005fcc;
        --white: #fff;
        --muted: #5d616a;
        --lineup-muted: #ddd;
        --object-shadow: #1b202633;
        --frame: #25272b;
        --screen: #c6d5e8;
        --screen-ink: #33495e;
        --screen-top: #d9e7f4;
        --screen-bottom: #90abc5;
        --device-button: #131518;
        --orbit: #8c96a6;
        --hover: #eef2f7;
        --item-ink: #34373d;
        --item-studio: #d7c8bd;
        --item-case: #bacfe1;
        --item-stand: #c9b9de;
        --item-kit: #d6cfaa;
        --radius-stage: 2rem;
        --radius-device: 42px;
        --radius-pill: 99px;
        --radius-circle: 50%;
        --radius-rail: 1rem;
        --radius-mobile: 1.25rem;
        color-scheme: light;
        background: var(--paper);
        color: var(--ink);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--sans);
        line-height: 1.45;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 4px;
      }
      .nav {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 max(1.25rem, 6vw);
        border-bottom: 1px solid var(--lineup-muted);
        font-size: 0.85rem;
      }
      .wordmark {
        font-weight: 750;
        letter-spacing: -0.05em;
      }
      .nav a {
        color: inherit;
        text-decoration: none;
      }
      .wrap {
        max-width: 1280px;
        margin: 0 auto;
        padding: clamp(2.5rem, 7vw, 7rem) max(1.25rem, 6vw);
      }
      .eyebrow {
        font-size: 0.8rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .title {
        font-size: clamp(3.4rem, 9vw, 8.5rem);
        letter-spacing: -0.045em;
        line-height: 0.88;
        margin: 1.4rem 0 2.5rem;
        max-width: 8ch;
      }
      .stage {
        position: relative;
        min-height: clamp(420px, 52vw, 650px);
        border-radius: var(--radius-stage);
        background: var(--stage);
        overflow: hidden;
        display: grid;
        place-items: center;
      }
      .stage-note {
        position: absolute;
        left: 1.4rem;
        top: 1.2rem;
        font-size: 0.8rem;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .object {
        width: min(55vw, 420px);
        height: min(55vw, 420px);
        position: relative;
        filter: drop-shadow(18px 22px 15px var(--object-shadow));
        transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease;
      }
      .device {
        position: absolute;
        inset: 4% 18%;
        border: 14px solid var(--frame);
        border-radius: var(--radius-device);
        background: var(--screen);
        overflow: hidden;
      }
      .device:before {
        content: 'FIELD\A RECORDER';
        white-space: pre;
        position: absolute;
        inset: 17% 12%;
        display: grid;
        place-items: center;
        text-align: center;
        font-size: clamp(0.9rem, 2vw, 1.4rem);
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--screen-ink);
        background: linear-gradient(150deg, var(--screen-top), var(--screen-bottom));
      }
      .device:after {
        content: '';
        position: absolute;
        left: 30%;
        right: 30%;
        bottom: 3%;
        height: 5%;
        border-radius: var(--radius-pill);
        background: var(--device-button);
      }
      .orbit {
        position: absolute;
        inset: 10%;
        border: 1px solid var(--orbit);
        border-radius: var(--radius-circle);
        transform: rotate(-18deg);
      }
      .orbit:after {
        content: '';
        position: absolute;
        right: 7%;
        top: 8%;
        width: 12px;
        height: 12px;
        border-radius: var(--radius-circle);
        background: var(--blue);
      }
      .stage figcaption {
        position: absolute;
        left: 1.4rem;
        bottom: 1.2rem;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem 0;
      }
      .control {
        width: 48px;
        height: 48px;
        border: 1px solid var(--line);
        border-radius: var(--radius-circle);
        background: var(--white);
        color: var(--ink);
      }
      .control:hover {
        background: var(--hover);
      }
      .status {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.2rem;
        min-width: 130px;
      }
      .status strong {
        font-size: 0.9rem;
      }
      .status span {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .rail-heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin: clamp(4rem, 9vw, 9rem) 0 1.5rem;
      }
      .rail-heading h2 {
        font-size: clamp(2rem, 4vw, 4rem);
        letter-spacing: -0.07em;
        line-height: 0.9;
        margin: 0;
      }
      .rail-heading a {
        color: var(--blue);
        font-size: 0.85rem;
        display: inline-block;
        min-height: 44px;
        padding-top: 0.7rem;
      }
      .rail {
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 1rem;
      }
      .rail button {
        border: 0;
        background: transparent;
        text-align: left;
        padding: 0;
      }
      .rail-item {
        height: 140px;
        border-radius: var(--radius-rail);
        background: var(--lineup-muted);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--item-ink);
      }
      .rail button[aria-pressed='true'] .rail-item {
        outline: 3px solid var(--ink);
        outline-offset: 4px;
      }
      .rail button:nth-child(2) .rail-item {
        background: var(--item-studio);
      }
      .rail button:nth-child(3) .rail-item {
        background: var(--item-case);
      }
      .rail button:nth-child(4) .rail-item {
        background: var(--item-stand);
      }
      .rail button:nth-child(5) .rail-item {
        background: var(--item-kit);
      }
      .rail small {
        display: block;
        margin-top: 0.55rem;
        color: var(--muted);
      }
      @media (max-width: 650px) {
        .nav {
          height: 54px;
        }
        .nav span:not(.wordmark) {
          display: none;
        }
        .wrap {
          padding-top: 2.5rem;
        }
        .title {
          font-size: clamp(3.5rem, 17vw, 5.5rem);
        }
        .stage {
          min-height: 430px;
          border-radius: var(--radius-mobile);
        }
        .object {
          width: 310px;
          height: 310px;
        }
        .rail {
          display: flex;
          overflow-x: auto;
          scroll-snap-type: x mandatory;
          padding: 0.5rem 0.25rem 1rem;
        }
        .rail button {
          min-width: 140px;
          scroll-snap-align: start;
        }
        .rail-item {
          height: 120px;
        }
        .rail-heading {
          align-items: start;
          gap: 1rem;
          flex-direction: column;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .object {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <span class="wordmark">OBJECT / ORBIT</span>
      <nav aria-label="site"><a href="#lineup">Lineup</a><a href="#about" style="margin-left: 1rem">About</a></nav>
    </header>
    <main class="wrap">
      <p class="eyebrow">Field Recorder / Mk II</p>
      <h1 class="title">Capture<br />the room.</h1>
      <figure class="stage" aria-labelledby="stage-title">
        <span class="stage-note">self-authored geometric product study</span>
        <div class="object" id="object" aria-hidden="true">
          <div class="orbit"></div>
          <div class="device"></div>
        </div>
        <figcaption id="stage-title">
          Field Recorder / Mk II — authored SVG/CSS geometry, no source product asset
        </figcaption>
      </figure>
      <div class="controls" aria-label="product selection">
        <button class="control" id="prev" type="button" aria-label="Previous object">←</button>
        <div class="status" aria-live="polite">
          <strong id="label">Field Recorder</strong><span id="count">1 of 5</span>
        </div>
        <button class="control" id="next" type="button" aria-label="Next object">→</button>
      </div>
      <section id="lineup">
        <div class="rail-heading">
          <h2>Explore the lineup.</h2>
          <a href="#lineup">Compare all objects →</a>
        </div>
        <div class="rail">
          <button type="button" aria-pressed="true" data-name="Field Recorder / Mk II">
            <span class="rail-item">REC</span><small>Field Recorder</small></button
          ><button type="button" aria-pressed="false" data-name="Studio Microphone / L">
            <span class="rail-item">MIC</span><small>Studio Mic</small></button
          ><button type="button" aria-pressed="false" data-name="Weatherproof Carry Case">
            <span class="rail-item">CASE</span><small>Soft Case</small></button
          ><button type="button" aria-pressed="false" data-name="Adjustable Desk Stand">
            <span class="rail-item">STAND</span><small>Desk Stand</small></button
          ><button type="button" aria-pressed="false" data-name="Field Recording Kit">
            <span class="rail-item">KIT</span><small>Field Kit</small>
          </button>
        </div>
      </section>
    </main>
    <script>
      const items = [...document.querySelectorAll('.rail button')],
        object = document.querySelector('#object'),
        label = document.querySelector('#label'),
        count = document.querySelector('#count')
      let index = 0
      function select(next) {
        index = (next + items.length) % items.length
        items.forEach((item, i) => item.setAttribute('aria-pressed', String(i === index)))
        label.textContent = items[index].dataset.name
        count.textContent = `${index + 1} of ${items.length}`
        object.style.transform = `rotate(${(index - 2) * 3}deg) scale(${1 + index * 0.025})`
        object.setAttribute('aria-label', `${items[index].dataset.name} geometric illustration`)
      }
      document.querySelector('#prev').addEventListener('click', () => select(index - 1))
      document.querySelector('#next').addEventListener('click', () => select(index + 1))
      items.forEach((item, i) => item.addEventListener('click', () => select(i)))
    </script>
  </body>
</html>
