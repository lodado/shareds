<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>exemplar · input</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      /* ── Field: label 위 · 형식 요구는 에러 전에 · 상태 변화에 layout shift 없음 ── */
      .field {
        display: grid;
        gap: var(--space-2);
        max-width: 420px;
      }
      .field label {
        font-size: var(--text-sm);
        font-weight: 600;
      }
      .field .required {
        color: var(--destructive);
        margin-left: 2px;
      }
      .field .hint,
      .field .error {
        font-size: var(--text-xs);
        line-height: 1.5;
        margin: 0;
      }
      .field .hint {
        color: var(--muted-foreground);
      }
      .field .error {
        color: var(--destructive);
        display: none;
      }
      .field[data-invalid='true'] .error {
        display: block;
      }
      .field[data-invalid='true'] .hint {
        display: none;
      }
      .control {
        display: flex;
        align-items: center;
        height: 40px;
        padding: 0 var(--space-3);
        border: 1px solid var(--input);
        border-radius: var(--radius);
        background: var(--card);
        color: var(--foreground);
        font: inherit;
        font-size: 16px; /* iOS 확대 방지: 모바일 input은 16px 이상 */
        transition:
          border-color var(--duration-fast) var(--ease-out),
          box-shadow var(--duration-fast) var(--ease-out);
      }
      .control::placeholder {
        color: var(--muted-foreground);
      }
      .control:hover {
        border-color: color-mix(in oklch, var(--foreground) 30%, var(--input));
      }
      .control:focus-visible {
        outline: none;
        border-color: var(--ring);
        box-shadow: 0 0 0 3px oklch(from var(--ring) l c h / 0.25); /* border-width는 고정, 강조는 shadow로 */
      }
      .control[aria-invalid='true'] {
        border-color: var(--destructive);
      }
      .control[aria-invalid='true']:focus-visible {
        box-shadow: 0 0 0 3px oklch(from var(--destructive) l c h / 0.25);
      }
      .control:disabled {
        background: var(--muted);
        color: var(--muted-foreground);
        cursor: not-allowed;
      }
      .control--amount {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .with-affix {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: var(--space-2);
      }
      .with-affix .affix {
        color: var(--muted-foreground);
        font-size: var(--text-sm);
      }
      /* 데모 레이아웃 */
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: var(--space-12) var(--space-6);
        display: grid;
        gap: var(--space-8);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="field">
        <label for="email">이메일<span class="required" aria-hidden="true">*</span></label>
        <input
          class="control"
          id="email"
          name="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          spellcheck="false"
          placeholder="name@example.com"
          aria-describedby="email-hint"
        />
        <p class="hint" id="email-hint">로그인 링크를 이 주소로 보내요.</p>
      </div>

      <div class="field" data-invalid="true">
        <label for="phone">휴대폰 번호<span class="required" aria-hidden="true">*</span></label>
        <input
          class="control"
          id="phone"
          name="phone"
          type="tel"
          inputmode="numeric"
          autocomplete="tel"
          value="010-1234"
          aria-invalid="true"
          aria-describedby="phone-error"
        />
        <p class="hint">하이픈 없이 숫자만 입력해도 돼요.</p>
        <p class="error" id="phone-error" role="alert">
          번호가 짧아요 — 010으로 시작하는 11자리를 입력해 주세요.
        </p>
      </div>

      <div class="field">
        <label for="amount">보낼 금액</label>
        <div class="with-affix">
          <input
            class="control control--amount"
            id="amount"
            name="amount"
            type="text"
            inputmode="decimal"
            value="1,250,000"
            aria-describedby="amount-hint"
          />
          <span class="affix">원</span>
        </div>
        <p class="hint" id="amount-hint">출금 가능 <span class="num">3,480,000</span>원</p>
      </div>

      <div class="field">
        <label for="disabled">비활성</label>
        <input class="control" id="disabled" type="text" value="수정할 수 없는 값" disabled />
      </div>
    </main>
  </body>
</html>
