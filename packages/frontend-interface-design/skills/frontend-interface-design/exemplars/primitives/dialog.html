<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>exemplar · dialog</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      /* ── Dialog: 네이티브 <dialog> · 그림자는 modal 단 · 확인 버튼에 동작 이름 ─── */
      dialog {
        width: min(480px, calc(100vw - 2 * var(--space-4)));
        padding: 0;
        border: 0;
        border-radius: calc(var(--radius) + 4px);
        background: var(--popover);
        color: var(--popover-foreground);
        box-shadow: var(--shadow-modal);
        overscroll-behavior: contain;
      }
      dialog::backdrop {
        background: var(--backdrop);
      }
      dialog[open] {
        animation: enter var(--duration-base) var(--ease-out);
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(4px) scale(0.98); /* 0.9 이상에서 시작, 광원 방향으로 */
        }
      }
      .dialog__body {
        padding: var(--space-6);
        display: grid;
        gap: var(--space-3);
      }
      .dialog__title {
        font-size: var(--text-xl);
        font-weight: 600;
      }
      .dialog__desc {
        margin: 0;
        font-size: var(--text-sm);
        color: var(--muted-foreground);
      }
      .dialog__summary {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: var(--space-2) var(--space-4);
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius);
        background: var(--muted);
        font-size: var(--text-sm);
      }
      .dialog__summary dt {
        color: var(--muted-foreground);
      }
      .dialog__summary dd {
        margin: 0;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .dialog__actions {
        display: flex;
        justify-content: flex-end;
        gap: var(--space-2);
        padding: var(--space-4) var(--space-6);
        border-top: 1px solid color-mix(in oklch, var(--foreground) 8%, transparent);
      }
      .btn {
        height: 40px;
        padding: 0 var(--space-4);
        border: 1px solid transparent;
        border-radius: var(--radius);
        font: inherit;
        font-size: var(--text-sm);
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color var(--duration-fast) var(--ease-out),
          transform var(--duration-fast) var(--ease-out);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn--secondary {
        background: var(--card);
        color: var(--foreground);
        border-color: var(--border);
      }
      .btn--secondary:hover {
        background: var(--muted);
      }
      .btn--destructive {
        background: var(--destructive);
        color: var(--destructive-foreground);
      }
      /* 데모 */
      main {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: var(--space-6);
      }
      .open {
        height: 40px;
        padding: 0 var(--space-4);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        font: inherit;
        font-size: var(--text-sm);
        font-weight: 600;
        box-shadow: var(--shadow-raised);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <button class="open" type="button" onclick="document.getElementById('confirm').showModal()">
        정산 취소…
      </button>
    </main>

    <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
      <form method="dialog">
        <div class="dialog__body">
          <h2 class="dialog__title" id="confirm-title">이 정산을 취소할까요?</h2>
          <p class="dialog__desc" id="confirm-desc">
            거래처에 취소 알림이 가고, 같은 금액으로 다시 정산하려면 새로 요청해야 해요. 되돌릴 수 없어요.
          </p>
          <dl class="dialog__summary">
            <dt>거래처</dt>
            <dd>라온커피 성수점</dd>
            <dt>금액</dt>
            <dd>348,000원</dd>
            <dt>예정일</dt>
            <dd>9월 15일</dd>
          </dl>
        </div>
        <div class="dialog__actions">
          <button class="btn btn--secondary" value="cancel" type="submit" autofocus>돌아가기</button>
          <button class="btn btn--destructive" value="confirm" type="submit">정산 취소</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
