<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>exemplar · button</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      /* ── Button: 상태 8종 · 토큰만 참조 · 광학 정렬 ─────────────── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        height: 40px;
        padding: 0 var(--space-4);
        border: 1px solid transparent;
        border-radius: var(--radius);
        font: inherit;
        font-size: var(--text-sm);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.005em;
        color: var(--primary-foreground);
        background: var(--primary);
        cursor: pointer;
        user-select: none;
        touch-action: manipulation;
        transition:
          background-color var(--duration-fast) var(--ease-out),
          transform var(--duration-fast) var(--ease-out),
          box-shadow var(--duration-fast) var(--ease-out);
      }
      .btn:hover {
        background: var(--primary-hover);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn:disabled,
      .btn[aria-disabled='true'] {
        background: var(--muted);
        color: var(--muted-foreground);
        cursor: not-allowed;
        transform: none;
      }
      .btn[aria-busy='true'] {
        pointer-events: none;
      }
      .btn[aria-busy='true'] .spinner {
        display: inline-block;
      }
      .btn--secondary {
        background: var(--card);
        color: var(--foreground);
        border-color: var(--border);
        box-shadow: var(--shadow-raised);
      }
      .btn--secondary:hover {
        background: var(--muted);
      }
      .btn--ghost {
        background: transparent;
        color: var(--foreground);
      }
      .btn--ghost:hover {
        background: var(--muted);
      }
      .btn--destructive {
        background: var(--destructive);
        color: var(--destructive-foreground);
      }
      .btn--sm {
        height: 32px;
        padding: 0 var(--space-3);
        font-size: var(--text-xs);
      }
      .btn--lg {
        height: 48px;
        padding: 0 var(--space-6);
        font-size: var(--text-base);
      }
      .btn .icon {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        stroke-width: 1.5;
        fill: none;
        flex: none;
        translate: 0 0.5px; /* 광학 정렬: 텍스트 x-height에 맞춰 반 픽셀 내린다 */
      }
      .btn kbd {
        margin-left: var(--space-1);
        padding: 1px 5px;
        border-radius: calc(var(--radius) - 4px);
        background: oklch(0% 0 0 / 0.2); /* solid(primary) 위: 어두운 오버레이 — 흰 12%는 전경 대비를 깎는다 */
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 500;
      }
      .btn--secondary kbd,
      .btn--ghost kbd {
        background: color-mix(in oklch, currentColor 12%, transparent);
      }
      .spinner {
        display: none;
        width: 14px;
        height: 14px;
        border: 2px solid color-mix(in oklch, currentColor 30%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        font-size: var(--text-sm);
        color: var(--muted-foreground);
      }
      .status--success {
        color: var(--success);
      }
      .status--error {
        color: var(--destructive);
      }
      /* 데모 레이아웃 */
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: var(--space-12) var(--space-6);
        display: grid;
        gap: var(--space-8);
      }
      section {
        display: grid;
        gap: var(--space-3);
      }
      section h2 {
        font-size: var(--text-xs);
        font-weight: 500;
        color: var(--muted-foreground);
        letter-spacing: 0;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-3);
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h2>변형 — 한 화면에 primary는 하나</h2>
        <div class="row">
          <button class="btn" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            변경 사항 저장
          </button>
          <button class="btn btn--secondary" type="button">취소</button>
          <button class="btn btn--ghost" type="button">더 보기</button>
          <button class="btn btn--destructive" type="button">프로젝트 삭제</button>
        </div>
      </section>

      <section>
        <h2>크기 — 32 · 40 · 48, 모바일 탭 타깃은 44 이상</h2>
        <div class="row">
          <button class="btn btn--sm" type="button">작게</button>
          <button class="btn" type="button">기본</button>
          <button class="btn btn--lg" type="button">크게</button>
        </div>
      </section>

      <section>
        <h2>상태 — default · hover · focus-visible · active · disabled · loading · error · success</h2>
        <div class="row">
          <button class="btn" type="button" disabled>비활성</button>
          <button class="btn" type="button" aria-busy="true">
            <span class="spinner" aria-hidden="true"></span>
            저장 중…
          </button>
          <span class="status status--error" role="status">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" width="16" height="16" style="stroke: currentColor; fill: none; stroke-width: 1.5"><circle cx="12" cy="12" r="9" /><path d="M12 8v5M12 16h.01" /></svg>
            저장하지 못했어요 — 네트워크를 확인한 뒤 다시 시도
          </span>
          <span class="status status--success" role="status">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" width="16" height="16" style="stroke: currentColor; fill: none; stroke-width: 1.5"><path d="M5 12l5 5L20 7" /></svg>
            저장됨
          </span>
        </div>
        <p style="font-size: var(--text-sm); color: var(--muted-foreground); margin: 0">
          로딩 중에도 라벨을 유지한다. 비활성 버튼은 idle 폼에서 쓰지 않는다 — 검증은 submit 뒤에.
        </p>
      </section>

      <section>
        <h2>키보드 힌트 — 고빈도 동작에는 모션 없이 kbd</h2>
        <div class="row">
          <button class="btn btn--secondary" type="button">명령 팔레트 <kbd>⌘K</kbd></button>
        </div>
      </section>
    </main>
  </body>
</html>
