<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>exemplar · card</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      /* ── Card: 그림자 또는 border 중 하나 · 안에 카드 없음 · radius 중첩 ────── */
      .card {
        display: grid;
        gap: var(--space-4);
        padding: var(--space-6);
        border-radius: var(--radius);
        background: var(--card);
        color: var(--card-foreground);
        box-shadow: var(--shadow-raised);
      }
      .card--outlined {
        box-shadow: none;
        border: 1px solid var(--border);
      }
      .card__header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--space-4);
      }
      .card__title {
        font-size: var(--text-lg);
        font-weight: 600;
        line-height: 1.3;
      }
      .card__desc {
        margin: var(--space-1) 0 0;
        font-size: var(--text-sm);
        color: var(--muted-foreground);
      }
      .card__media {
        aspect-ratio: 16 / 9;
        border-radius: calc(var(--radius) - var(--space-2)); /* 안쪽 radius = 바깥 − padding, 0 이하면 0 */
        background: var(--muted);
        overflow: hidden;
      }
      .card__footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        padding-top: var(--space-4);
        border-top: 1px solid color-mix(in oklch, var(--foreground) 8%, transparent); /* hairline */
        font-size: var(--text-sm);
        color: var(--muted-foreground);
      }
      .card__kpi {
        font-size: var(--text-3xl);
        font-weight: 700;
        letter-spacing: var(--tracking-display);
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .delta {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
        font-size: var(--text-sm);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .delta--up {
        color: var(--success);
      }
      .delta--down {
        color: var(--destructive);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px var(--space-2);
        border-radius: calc(var(--radius) - 4px);
        background: var(--muted);
        color: var(--muted-foreground);
        font-size: var(--text-xs);
        font-weight: 500;
      }
      .badge::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 1px; /* 상태는 형태로도 구분: 사각 = 진행 중 */
        background: var(--warning);
      }
      /* 데모 레이아웃 */
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: var(--space-12) var(--space-6);
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: var(--space-6);
      }
      .skeleton {
        display: grid;
        gap: var(--space-3);
      }
      .skeleton span {
        display: block;
        height: 12px;
        border-radius: 4px;
        background: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <article class="card" aria-labelledby="c1">
        <div class="card__header">
          <div>
            <h3 class="card__title" id="c1">이번 달 정산</h3>
            <p class="card__desc">9월 1일 – 9월 6일 · 매일 09:00 갱신</p>
          </div>
          <span class="badge">집계 중</span>
        </div>
        <div>
          <div class="card__kpi">₩12,480,000</div>
          <span class="delta delta--up">+8.2% 지난주 대비</span>
        </div>
        <div class="card__footer">
          <span>정산 예정일 9월 15일</span>
          <a href="#">내역 보기</a>
        </div>
      </article>

      <article class="card card--outlined" aria-labelledby="c2">
        <div class="card__media" role="img" aria-label="상품 이미지 자리"></div>
        <div class="card__header">
          <div>
            <h3 class="card__title" id="c2">봄 시즌 룩북 촬영</h3>
            <p class="card__desc">다음 촬영까지 남은 컷 <span class="num">14</span>개</p>
          </div>
        </div>
        <div class="card__footer">
          <span class="delta delta--down">−3컷 어제 대비</span>
          <a href="#">일정 조정</a>
        </div>
      </article>

      <article class="card" aria-busy="true" aria-label="불러오는 중">
        <div class="skeleton" aria-hidden="true">
          <span style="width: 40%"></span>
          <span style="width: 70%; height: 28px"></span>
          <span style="width: 55%"></span>
        </div>
      </article>
    </main>
  </body>
</html>
