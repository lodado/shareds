<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>exemplar · table</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      /* ── Table: 좌정렬 텍스트 · 우정렬 tabular 숫자 · hairline · 상태는 형태+색+텍스트 ── */
      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--text-sm);
      }
      thead th {
        position: sticky;
        top: 0;
        background: var(--card);
        text-align: left;
        font-size: var(--text-xs);
        font-weight: 500;
        color: var(--muted-foreground);
        height: 40px;
        padding: 0 var(--space-4);
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      th.num,
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      tbody td {
        height: var(--row-h);
        padding: 0 var(--space-4);
        border-bottom: 1px solid color-mix(in oklch, var(--foreground) 6%, transparent);
        vertical-align: middle;
        white-space: nowrap;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover td {
        background: var(--muted);
      }
      tbody tr[aria-selected='true'] td {
        background: var(--accent);
      }
      td.primary {
        font-weight: 600;
        color: var(--foreground);
      }
      td.secondary {
        color: var(--muted-foreground);
      }
      .cell-truncate {
        max-width: 240px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-xs);
        font-weight: 500;
      }
      .status i {
        width: 8px;
        height: 8px;
        flex: none;
      }
      .status--done i {
        background: var(--success);
        border-radius: 50%;
      }
      .status--pending i {
        background: var(--warning);
        border-radius: 1px;
      }
      .status--failed i {
        background: var(--destructive);
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
      }
      .sort {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .sort svg {
        width: 12px;
        height: 12px;
        stroke: currentColor;
        stroke-width: 1.5;
        fill: none;
      }
      caption {
        caption-side: top;
        text-align: left;
        padding: var(--space-4) var(--space-4) var(--space-3);
        font-size: var(--text-sm);
        color: var(--muted-foreground);
      }
      /* 데모 레이아웃 */
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: var(--space-12) var(--space-6);
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--space-3);
        margin-bottom: var(--space-4);
      }
      .toolbar h1 {
        font-size: var(--text-2xl);
      }
      .density {
        display: inline-flex;
        gap: 2px;
        padding: 2px;
        border-radius: var(--radius);
        background: var(--muted);
        font-size: var(--text-xs);
      }
      .density button {
        font: inherit;
        padding: 4px 10px;
        border: 0;
        border-radius: calc(var(--radius) - 2px);
        background: transparent;
        color: var(--muted-foreground);
        cursor: pointer;
      }
      .density button[aria-pressed='true'] {
        background: var(--card);
        color: var(--foreground);
        box-shadow: var(--shadow-raised);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <h1>정산 내역</h1>
        <div class="density" role="group" aria-label="밀도">
          <button type="button" aria-pressed="false">촘촘히</button>
          <button type="button" aria-pressed="true">기본</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <caption>
            최근 5건 · 정렬: 날짜 최신순
          </caption>
          <thead>
            <tr>
              <th scope="col">
                <span class="sort" aria-sort="descending">날짜
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" /></svg>
                </span>
              </th>
              <th scope="col">거래처</th>
              <th scope="col">상태</th>
              <th scope="col" class="num">금액</th>
              <th scope="col" class="num">수수료</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="secondary"><time datetime="2026-09-06">2026-09-06</time></td>
              <td class="primary cell-truncate">주식회사 한빛물류 서울 강서 물류센터</td>
              <td><span class="status status--done"><i aria-hidden="true"></i>정산 완료</span></td>
              <td class="num">1,250,000</td>
              <td class="num">12,500</td>
            </tr>
            <tr aria-selected="true">
              <td class="secondary"><time datetime="2026-09-05">2026-09-05</time></td>
              <td class="primary cell-truncate">라온커피 성수점</td>
              <td><span class="status status--pending"><i aria-hidden="true"></i>집계 중</span></td>
              <td class="num">348,000</td>
              <td class="num">3,480</td>
            </tr>
            <tr>
              <td class="secondary"><time datetime="2026-09-04">2026-09-04</time></td>
              <td class="primary cell-truncate">세움디자인</td>
              <td><span class="status status--failed"><i aria-hidden="true"></i>실패 · 계좌 확인 필요</span></td>
              <td class="num">92,000</td>
              <td class="num">920</td>
            </tr>
            <tr>
              <td class="secondary"><time datetime="2026-09-03">2026-09-03</time></td>
              <td class="primary cell-truncate">그린마켓 온라인</td>
              <td><span class="status status--done"><i aria-hidden="true"></i>정산 완료</span></td>
              <td class="num">4,120,500</td>
              <td class="num">41,205</td>
            </tr>
            <tr>
              <td class="secondary"><time datetime="2026-09-02">2026-09-02</time></td>
              <td class="primary cell-truncate">오늘의 꽃집</td>
              <td><span class="status status--done"><i aria-hidden="true"></i>정산 완료</span></td>
              <td class="num">58,000</td>
              <td class="num">580</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
