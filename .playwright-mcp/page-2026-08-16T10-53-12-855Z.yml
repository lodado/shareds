          - generic [ref=f38e40]:
            - paragraph [ref=f38e41]: While traditional chat requires you to break a complex task into numerous prompts, Agent Mode autonomously builds a plan and uses its built-in tools to accomplish the entire multi-step workflow in one go, like building a website or running deep research. Now you can automate tasks without having to switch modalities or require additional prompting, in a powerful sandbox testing environment.
            - paragraph [ref=f38e42]: The release of Agent Mode also reinforces our core promise to be the best place to test the latest AI models, based on real-world use cases. It provides the same simple and intuitive interface tens of millions of people use on Arena.ai, increasing the flexibility to test and measure the agentic intelligence of different model labs.
