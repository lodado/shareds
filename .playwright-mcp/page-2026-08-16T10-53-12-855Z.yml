          - generic [ref=f38e48]:
            - paragraph [ref=f38e49]: Agent Mode offers a suite of advanced tools, including web search, image generation, coding and technical assistance, file attachments, and a powerful sandbox/bash environment for testing and iteration.
            - paragraph [ref=f38e50]: Arena now unlocks a whole new set of use cases beyond basic chat. Instead of breaking complex tasks into numerous isolated prompts, Agent Mode is smart enough to accomplish tasks on its own to get a job done, with minimal follow-ups from the user. With this new release we also offer a new leaderboard methodology geared towards understanding the performance of multi-component agents based on organic user traces.
          - figure [ref=f38e53]
          - generic [ref=f38e55]:
            - 'heading "Agent Mode for Users: Complex Tasks, Simplified" [level=2] [ref=f38e56]'
            - generic [ref=f38e58]:
              - paragraph [ref=f38e59]: Agent Mode provides value to both everyday users and entrepreneurs by offering a single, powerful tool to accomplish complex tasks and get more work done.
              - paragraph [ref=f38e60]: By combining research, coding, and analysis into one connected experience, users can tackle ambitious projects—like building a small business website, running deep research, or planning a product launch—with significantly less friction and manual coordination. It also means being able to put in one prompt to execute a multi-stage workflow, rather than continuing to have to re-prompt, saving time and effort to get to the answer or deliverable faster.
          - figure [ref=f38e63]
          - generic [ref=f38e66]:
            - paragraph [ref=f38e67]: "We have seen our community use Agent Mode in a myriad of different ways, taking advantage of some of the most critical workflows being addressed. The specific breakdown we’ve seen so far is as follows:"
            - list [ref=f38e68]:
              - listitem [ref=f38e69]:
                - strong [ref=f38e70]: "Coding Domination (29%):"
                - text: The task distribution is dominated by coding, which makes up a cumulative 29% of the task mix.
              - listitem [ref=f38e71]:
                - strong [ref=f38e72]: "Research & Planning (11% each):"
                - text: The next most popular categories belong to research-based tasks including looking up information, planning or brainstorming.
              - listitem [ref=f38e73]:
                - strong [ref=f38e74]: "Workflow Automation (4%):"
                - text: Workflow automation only makes up 3.9% of tasks, yet represents a promising category for generating value for end users.
              - listitem [ref=f38e75]:
                - strong [ref=f38e76]: "Remaining long-tail use cases:"
                - text: There's a number of long tail use cases, including data analysis, translation, and media analysis.
            - paragraph [ref=f38e77]: Another key insight is the levels of agency we see users giving the agents. The majority of initial messages index on delegation of certain tasks rather than handing over complete control. We see this trend continue for follow-on messages, where twice as many users end up tightening controls rather than loosening them, essentially treating the model like an employee, and taking more of a “hands-on” manager-type role. We’re excited to see the evolution of the user/agent relationship, especially as the models continue to evolve and improve, and as agentic workflows move from early adopters to the mainstream.
          - generic [ref=f38e79]:
            - heading "Measuring Real-World Utility" [level=2] [ref=f38e80]
            - paragraph [ref=f38e83]:
              - text: Agent Mode now answers the urgent question of how frontier models perform in agentic, real-world contexts. Agent Mode provides the signals of real-world utility into how various models handle multi-step workflows — something that is increasingly critical in today’s AI landscape. The data generated from all of these real-world tasks will power a public
              - link "agent leaderboard" [ref=f38e84] [cursor=pointer]:
                - /url: https://arena.ai/leaderboard/agent
              - text: ", providing a new standard for measuring AI advancement. We’re excited to have our community contributing to the leaderboard via the signals generated from their real-world agentic usage using the leading AI models. For more information, read our"
              - link "Agent Arena Leaderboard blog post" [ref=f38e85] [cursor=pointer]:
                - /url: /blog/agent-arena-methodology
              - text: that explores the methodology behind the rankings.
          - figure [ref=f38e88]
          - generic [ref=f38e89]:
