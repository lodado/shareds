              - button "When should I use Agent Mode vs other modes? Toggle FAQ Agent Mode combines research, coding, analysis, and iteration into one connected experience, allowing you to move fluidly between tasks without losing context. This means if you have a more complex, multi-step workflow, Agent Mode would be an ideal fit. With Agent Mode you can complete tasks such as building and launching a small business website, planning a product launch, or doing deep research into a topic of your choosing. Conversely, if you have simple tasks that could be accomplished via chat functionality, Agent Mode likely isn’t necessary. Anything regarding simple research, search, or basic knowledge queries that are single step are better suited for other modes such as Battle Mode, Side-by-Side, or Direct." [ref=f38e129] [cursor=pointer]:
