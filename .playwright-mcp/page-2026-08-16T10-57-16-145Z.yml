                - paragraph [ref=f82e431]:
                  - strong [ref=f82e432]: Agentless
                  - text: is an
                  - emphasis [ref=f82e433]: agentless
                  - text: approach to automatically solve software development problems. To solve each issue,
                  - strong [ref=f82e434]: Agentless
                  - text: "follows a simple three phase process: localization, repair, and patch validation."
                - list [ref=f82e435]:
                  - listitem [ref=f82e436]:
                    - text: 🙀
                    - strong [ref=f82e437]: Localization
                    - text: ": Agentless employs a hierarchical process to first localize the fault to specific files, then to relevant classes or functions, and finally to fine-grained edit locations"
                  - listitem [ref=f82e438]:
                    - text: 😼
                    - strong [ref=f82e439]: Repair
                    - text: ": Agentless takes the edit locations and samples multiple candidate patches per bug in a simple diff format"
                  - listitem [ref=f82e440]:
                    - text: 😸
                    - strong [ref=f82e441]: Patch Validation
                    - text: ": Agentless selects the regression tests to run and generates additional reproduction test to reproduce the original error. Using the test results, Agentless re-ranks all remaining patches to selects one to submit"
