        - paragraph [ref=f81e215]: I can't speak for Guillermo, but I agreed so strongly with what he said because of my experience as a UI engineer and how I personally had come to understand the term "integration" in this context.
        - paragraph [ref=f81e216]:
          - text: Especially at that time in my career, almost all the code I wrote either ran directly in a browser or was intended for a tool that would help me run code in a browser. So for me naturally the terms "unit", "integration", and "end-to-end" would be viewed through the lens of that experience. In fact, I added "static" to the trophy because in the world of JavaScript that's not a given like it is in the predominant languages when
          - link "the testing pyramid" [ref=f81e217] [cursor=pointer]:
            - /url: https://martinfowler.com/bliki/TestPyramid.html
          - text: was introduced.
        - paragraph [ref=f81e218]: The reason I explain this background is to help you understand the way the Testing Trophy is intended to be interpreted. I never considered whether it applied to microservices or even backend services at all. I considered my codebase in isolation and attempted to categorize the types of tests I could write within the confines of my own code ownership. I always thought of end-to-end tests as the place where you attempt to validate that things work without any (or more practically "as little as possible") mocking in place.
        - paragraph [ref=f81e219]: "So that left me with categorizing tests on my own code into either \"unit\" or \"integration\". I consider a \"unit\" to be a single function, class, or object that contains logic. So here's how I decided to (loosely) categorize them:"
        - list [ref=f81e220]:
          - listitem [ref=f81e221]: Unit tests are those which test units which either have no dependencies (collaborators) or which have those mocked for the test.
          - listitem [ref=f81e222]: Integration tests are those which test multiple units integrating with one another.
        - paragraph [ref=f81e223]:
          - text: Eventually, I created
          - link "Testing Library" [ref=f81e224] [cursor=pointer]:
            - /url: https://testing-library.com
          - text: "to encourage the kinds of testing practices that worked best for me:"
        - generic [ref=f81e225]:
          - link "Kent C. Dodds 🏹 avatar Kent C. Dodds 🏹 @kentcdodds" [ref=f81e226] [cursor=pointer]:
            - /url: https://x.com/kentcdodds
