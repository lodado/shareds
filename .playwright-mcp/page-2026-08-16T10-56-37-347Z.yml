            - generic [ref=f81e228]:
              - generic [ref=f81e229]: Kent C. Dodds 🏹
              - generic [ref=f81e230]: "@kentcdodds"
          - blockquote [ref=f81e231]:
            - text: I just published “Introducing the react-testing-library 🐐”
            - link "Introducing the react-testing-library 🐐" [ref=f81e232] [cursor=pointer]:
              - /url: https://kentcdodds.com/blog/introducing-the-react-testing-library
          - link "Referenced media Introducing the react-testing-library 🐐 A simpler replacement for enzyme that encourages good testing practices. kentcdodds.com" [ref=f81e233] [cursor=pointer]:
            - /url: https://kentcdodds.com/blog/introducing-the-react-testing-library
