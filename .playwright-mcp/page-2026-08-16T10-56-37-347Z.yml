        - paragraph [ref=f81e328]: Classification is important so we can have conversations about this. It's unfortunate that you pretty much need to come to a consensus on how you define these terms before having a productive conversation. But ultimately it really doesn't matter. As Justin says, it's a distraction. Especially when so many codebases are living life on the edge without an automated way to have confidence their changes are safe to deploy.
        - heading [level=2] [ref=f81e329]:
          - link "Conclusion" [ref=f81e330] [cursor=pointer]:
            - /url: "#conclusion"
        - paragraph [ref=f81e331]:
          - text: "Anyway, hopefully this helps to clear things up a bit. To sum up: When trying to apply the testing trophy to your situation, think of it within the code of an individual codebase. It definitely has applicability in backends, but I've only considered it for monoliths not microservices or even serverless functions (and"
          - link "I agree with Tim" [ref=f81e332] [cursor=pointer]:
            - /url: https://www.tbray.org/ongoing/When/202x/2021/05/15/Testing-in-2021
          - text: ", most of us should probably be writing monoliths if we can)."
        - paragraph [ref=f81e333]: "The testing trophy (when understood) has given me (and countless other) clarity on where to focus testing efforts. When properly interpreted, it helps me keep this critical principle in mind:"
        - generic [ref=f81e334]:
          - link "Kent C. Dodds 🏹 avatar Kent C. Dodds 🏹 @kentcdodds" [ref=f81e335] [cursor=pointer]:
            - /url: https://x.com/kentcdodds
            - img "Kent C. Dodds 🏹 avatar" [ref=f81e336]
            - generic [ref=f81e337]:
              - generic [ref=f81e338]: Kent C. Dodds 🏹
              - generic [ref=f81e339]: "@kentcdodds"
          - blockquote [ref=f81e340]: The more your tests resemble the way your software is used, the more confidence they can give you.
          - link "3:05 AM (UTC) · March 23rd, 2018" [ref=f81e342] [cursor=pointer]:
            - /url: https://x.com/kentcdodds/status/977018512689455106
