        - paragraph [ref=f81e264]:
          - text: By my own definition, Testing Library can be used to test individual React components (unit tests), entire pages with HTTP requests mocked
          - link "via MSW" [ref=f81e265] [cursor=pointer]:
            - /url: /blog/stop-mocking-fetch
          - text: (integration tests), the full app with very few mocks (end-to-end tests), and even
          - link "individual React hooks" [ref=f81e266] [cursor=pointer]:
            - /url: /blog/how-to-test-custom-react-hooks
          - text: if necessary (lower level unit tests). And Testing Library is now the most popular and de facto standard... er... testing library for React apps and increasingly the same is happening wherever the DOM can be found. In May 2020,
          - link "Testing Library received the \"Adopt\" distinction on the ThoughtWorks Technology Radar" [ref=f81e267] [cursor=pointer]:
            - /url: https://www.thoughtworks.com/radar/languages-and-frameworks/react-testing-library
          - text: .
        - paragraph [ref=f81e268]:
          - text: "I expect some will reply to this blog post with: \"Why did you have to make up your own definitions in the first place? Just use the ones that exist.\" So I'll respond before you ask: \"Which of the two dozen different definitions would you like me to have chosen for my own definition?\" 😂 😭 In his post about"
          - link "test shapes" [ref=f81e269] [cursor=pointer]:
            - /url: https://martinfowler.com/articles/2021-test-shapes.html
          - text: ","
          - link "Martin Fowler" [ref=f81e270] [cursor=pointer]:
            - /url: https://x.com/martinfowler
          - text: "approximates a quote of a \"test expert\" who was asked in the 1990s how they define \"unit test\":"
        - blockquote [ref=f81e271]:
          - paragraph [ref=f81e272]: “in the first morning of my training course I cover 24 different definitions of unit test”.
        - paragraph [ref=f81e273]: This is a sad state of affairs, and it's been that way since the 90s unfortunately. It is what it is. I had to choose something that made sense for me and as an educator, I had to choose something that would make the most sense for the people I'm teaching. Judging by the response from people who have implemented my recommendations, my decision was a good one.
        - paragraph [ref=f81e274]:
          - text: When discussing whether you can prove that testing is effective,
          - link "Tim Bray" [ref=f81e275] [cursor=pointer]:
            - /url: https://x.com/timbray
          - text: (in his article
          - link "Testing in the Twenties" [ref=f81e276] [cursor=pointer]:
            - /url: https://www.tbray.org/ongoing/When/202x/2021/05/15/Testing-in-2021
          - text: "), correctly says:"
        - blockquote [ref=f81e277]:
          - paragraph [ref=f81e278]: let's not kid ourselves that our software-testing tenets constitute scientific knowledge.
        - paragraph [ref=f81e279]:
          - text: I would say this applies to everything about testing–not just whether it's effective (it can be). Any attempt to come to a single definition for all these terms is a futile endeavor. I remember speaking at Assert(JS) (where I gave my talk
          - link "Write Tests. Not too many. Mostly Integration." [ref=f81e280] [cursor=pointer]:
            - /url: https://www.youtube.com/watch?v=Fha2bVoC8SE&list=PLV5CVI1eNcJgNqzNwcs4UKrlJdhfDjshf
          - text: ) and I observed how wildly different each talk was with regards to their recommendations on testing. But as I think about it now, I think lots of the difference could be attributed to our definitions of the terms of testing and less on how we strive to achieve confidence.
        - paragraph [ref=f81e281]:
          - link "Justin Searls" [ref=f81e282] [cursor=pointer]:
            - /url: https://x.com/searls
          - text: (who incidentally also
          - link "spoke at Assert(JS)" [ref=f81e283] [cursor=pointer]:
            - /url: https://www.youtube.com/watch?v=Af4M8GMoxi4
          - text: "that year) said it best when he tweeted:"
        - generic [ref=f81e284]:
          - link "Justin Searls avatar Justin Searls @searls" [ref=f81e285] [cursor=pointer]:
            - /url: https://x.com/searls
            - img "Justin Searls avatar" [ref=f81e286]
            - generic [ref=f81e287]:
              - generic [ref=f81e288]: Justin Searls
              - generic [ref=f81e289]: "@searls"
          - blockquote [ref=f81e290]: People love debating what percentage of which type of tests to write, but it's a distraction. Nearly zero teams write expressive tests that establish clear boundaries, run quickly & reliably, and only fail for useful reasons. Focus on that instead.
          - generic [ref=f81e292]:
            - link "swyx avatar swyx @swyx" [ref=f81e293] [cursor=pointer]:
              - /url: https://x.com/swyx
              - img "swyx avatar" [ref=f81e294]
              - generic [ref=f81e295]:
                - generic [ref=f81e296]: swyx
                - generic [ref=f81e297]: "@swyx"
            - blockquote [ref=f81e298]:
              - text: The
              - link "@MartinFowler" [ref=f81e299] [cursor=pointer]:
                - /url: https://x.com/MartinFowler
              - text: Test Pyramid has fallen out of style. Integration > Unit tests is the new conventional wisdom. In frontend, we now have the "Testing Trophy" from
              - link "@rauchg" [ref=f81e300] [cursor=pointer]:
                - /url: https://x.com/rauchg
              - text: and
              - link "@kentcdodds" [ref=f81e301] [cursor=pointer]:
                - /url: https://x.com/kentcdodds
              - text: . In backend,
              - link "@theburningmonk" [ref=f81e302] [cursor=pointer]:
                - /url: https://x.com/theburningmonk
              - text: "'s course advocates the \"Testing Honeycomb\" from"
              - link "@SpotifyEng" [ref=f81e303] [cursor=pointer]:
                - /url: https://x.com/SpotifyEng
              - text: .
              - link "twitter.com/swyx/status/1261202288476971008" [ref=f81e304] [cursor=pointer]:
