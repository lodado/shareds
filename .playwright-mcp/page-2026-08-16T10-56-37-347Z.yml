              - /url: https://x.com/intent/like?tweet_id=977018512689455106
            - link [ref=f81e358] [cursor=pointer]:
              - /url: https://x.com/kentcdodds/status/977018512689455106
        - paragraph [ref=f81e362]: This is the guiding principle for Testing Library and it's how I think about every testing problem I face.
        - paragraph [ref=f81e363]:
          - strong [ref=f81e364]: Remember,
          - text: it's all about getting a good return on your investment where "return" is "confidence" and "investment" is "time." If we had unlimited time, then trying to classify things wouldn't be necessary, we'd just write tests forever! But we don't, so I hope this helps you when trying to decide where to put your efforts.
        - paragraph [ref=f81e365]:
          - text: P.S. If you'd like more of my thoughts on testing, I have
          - link "a lot of posts on the subject on my blog" [ref=f81e366] [cursor=pointer]:
            - /url: /blog?q=test
          - text: ". Here are a few specific articles I recommend you read next:"
        - list [ref=f81e367]:
          - listitem [ref=f81e368]:
            - link "Confidently Shipping Code" [ref=f81e369] [cursor=pointer]:
              - /url: /blog/confidently-shipping-code
            - text: ": Why I care about testing."
          - listitem [ref=f81e370]:
