        - paragraph [ref=f81e185]:
          - text: Which was my take on
          - link "Guillermo Rauch's" [ref=f81e186] [cursor=pointer]:
            - /url: https://x.com/rauchg
          - text: "tweet from about a year earlier:"
        - generic [ref=f81e187]:
