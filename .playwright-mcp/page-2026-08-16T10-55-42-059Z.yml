            - 'heading "1: Visibility of System Status" [level=2] [ref=f63e112]'
            - paragraph [ref=f63e113]:
              - strong [ref=f63e114]: The design should always keep users informed about what is going on, through appropriate feedback within a reasonable amount of time.
            - paragraph [ref=f63e115]: When users know the current system status, they learn the outcome of their prior interactions and determine next steps. Predictable interactions create trust in the product as well as the brand.
            - complementary [ref=f63e116]:
              - generic [ref=f63e117]:
                - heading "Go one step further than definitions." [level=3] [ref=f63e118]
                - paragraph [ref=f63e119]: Use the heuristics to defend and inform your design in our self-paced course, 10 Usability Heuristics — created by the team who brought you the framework first.
              - link "What You'll Learn" [ref=f63e121] [cursor=pointer]:
                - /url: https://www.nngroup.com/contents/self-paced-courses/10-usability-heuristics-from-theory-to-practice/?promo_type=courses&promo_pos=inline
            - generic [ref=f63e122]:
              - figure [ref=f63e124]:
                - 'img "Usability Heuristic #1: Man beside “You Are Here” indicators on a mall maps to show him where he currently is." [ref=f63e125]'
                - generic [ref=f63e126]:
                  - strong [ref=f63e127]:
                    - emphasis [ref=f63e128]: "Example of Usability Heuristic #1:"
                  - text: You Are Here
                  - emphasis [ref=f63e129]: indicators on mall maps show people where they currently are, to help them understand where to go next.
              - generic [ref=f63e130]:
                - paragraph [ref=f63e131]:
                  - strong [ref=f63e132]: Tips
                - list [ref=f63e133]:
                  - listitem [ref=f63e134]: Communicate clearly to users what the system’s state is — no action with consequences to users should be taken without informing them.
                  - listitem [ref=f63e135]: Present feedback to the user as quickly as possible (ideally, immediately).
                  - listitem [ref=f63e136]:
                    - text: Build trust through open and
                    - link "continuous communication" [ref=f63e137] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/microinteractions/
                    - text: .
                - paragraph [ref=f63e138]:
                  - strong [ref=f63e139]: Learn more
                - list [ref=f63e140]:
                  - listitem [ref=f63e141]:
                    - link [ref=f63e142] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/visibility-system-status/
                      - text: "Full article:"
                      - emphasis [ref=f63e143]: Visibility of System Status
                  - listitem [ref=f63e144]:
                    - link [ref=f63e145] [cursor=pointer]:
                      - /url: https://www.nngroup.com/videos/usability-heuristic-system-status/
                      - text: 3-minute video about the
                      - emphasis [ref=f63e146]: Visibility Heuristic
            - 'heading "2: Match Between the System and the Real World" [level=2] [ref=f63e147]'
            - paragraph [ref=f63e148]:
              - strong [ref=f63e149]: The design should speak the users' language. Use words, phrases, and concepts familiar to the user, rather than internal jargon. Follow real-world conventions, making information appear in a natural and logical order.
            - paragraph [ref=f63e150]: The way you should design depends very much on your specific users. Terms, concepts, icons, and images that seem perfectly clear to you and your colleagues may be unfamiliar or confusing to your users.
            - paragraph [ref=f63e151]:
              - text: When a design’s controls follow real-world conventions and correspond to desired outcomes (called
              - link "natural mapping" [ref=f63e152] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/natural-mappings/
              - text: ), it’s easier for users to learn and remember how the interface works. This helps to build an experience that feels intuitive.
            - generic [ref=f63e153]:
              - figure [ref=f63e155]:
                - 'img "Usability Heuristic #2: A stovetop that has controls that match the layout of the heating elements." [ref=f63e156]'
                - generic [ref=f63e157]:
                  - strong [ref=f63e158]:
                    - emphasis [ref=f63e159]: "Example of Usability Heuristic #2:"
                  - emphasis [ref=f63e160]: When stovetop controls match the layout of heating elements, users can quickly understand which control maps to which heating element.
              - generic [ref=f63e161]:
                - paragraph [ref=f63e162]:
                  - strong [ref=f63e163]: Tips
                - list [ref=f63e164]:
                  - listitem [ref=f63e165]: Ensure that users can understand meaning without having to go look up a word’s definition.
                  - listitem [ref=f63e166]: Never assume your understanding of words or concepts will match that of your users.
                  - listitem [ref=f63e167]:
                    - text: User research will uncover your
                    - link "users' familiar terminology," [ref=f63e168] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/user-centric-language/
                    - text: as well as their mental models around important concepts.
                - paragraph [ref=f63e169]:
                  - strong [ref=f63e170]: Learn more
                - list [ref=f63e171]:
                  - listitem [ref=f63e172]:
                    - link [ref=f63e173] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/match-system-real-world/
                      - text: "Full article:"
                      - emphasis [ref=f63e174]: Match Between the System and the Real World
                  - listitem [ref=f63e175]:
                    - link [ref=f63e176] [cursor=pointer]:
                      - /url: https://www.nngroup.com/videos/match-system-real-world/
                      - text: "2-minute video:"
                      - emphasis [ref=f63e177]: Match Between the System and the Real World
            - 'heading "3: User Control and Freedom" [level=2] [ref=f63e178]'
            - paragraph [ref=f63e179]:
              - strong [ref=f63e180]: Users often perform actions by mistake. They need a clearly marked "emergency exit" to leave the unwanted action without having to go through an extended process.
            - paragraph [ref=f63e181]: When it's easy for people to back out of a process or undo an action, it fosters a sense of freedom and confidence. Exits allow users to remain in control of the system and avoid getting stuck and feeling frustrated.
            - generic [ref=f63e182]:
              - figure [ref=f63e184]:
                - 'img "Usability Heuristic #3: A door with a light-up emergency exit above it." [ref=f63e185]'
                - generic [ref=f63e186]:
                  - strong [ref=f63e187]:
                    - emphasis [ref=f63e188]: "Example of Usability Heuristic #3:"
                  - emphasis [ref=f63e189]: Digital spaces need quick emergency exits, just like physical spaces do.
              - generic [ref=f63e190]:
                - paragraph [ref=f63e191]:
                  - strong [ref=f63e192]: Tips
                - list [ref=f63e193]:
                  - listitem [ref=f63e194]:
                    - text: Support
                    - emphasis [ref=f63e195]: Undo
                    - text: and
                    - emphasis [ref=f63e196]: Redo
                    - text: .
                  - listitem [ref=f63e197]:
                    - text: Show a clear way to exit the current interaction, like a
                    - link [ref=f63e198] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/reset-and-cancel-buttons/
                      - emphasis [ref=f63e199]: Cancel
                      - text: button
                    - text: .
                  - listitem [ref=f63e200]: Make sure the exit is clearly labeled and discoverable.
                - paragraph [ref=f63e201]:
                  - strong [ref=f63e202]: Learn more
                - list [ref=f63e203]:
                  - listitem [ref=f63e204]:
                    - link [ref=f63e205] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/user-control-and-freedom/
                      - text: "Full article:"
                      - emphasis [ref=f63e206]: User Control and Freedom
                  - listitem [ref=f63e207]:
                    - link [ref=f63e208] [cursor=pointer]:
                      - /url: https://www.nngroup.com/videos/usability-heuristic-user-control-freedom/
                      - text: "2-minute video:"
                      - emphasis [ref=f63e209]: User Control and Freedom
            - 'heading "4: Consistency and Standards" [level=2] [ref=f63e210]'
            - paragraph [ref=f63e211]:
              - strong [ref=f63e212]: Users should not have to wonder whether different words, situations, or actions mean the same thing. Follow platform and industry conventions.
            - paragraph [ref=f63e213]:
              - link "Jakob's Law" [ref=f63e214] [cursor=pointer]:
                - /url: https://www.nngroup.com/videos/jakobs-law-internet-ux/
              - text: states that people spend most of their time using digital products
              - emphasis [ref=f63e215]: other than yours
              - text: . Users’ experiences with those other products set their expectations. Failing to maintain consistency may increase the users'
              - link "cognitive load" [ref=f63e216] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/minimize-cognitive-load/
              - text: by forcing them to learn something new.
            - generic [ref=f63e217]:
              - figure [ref=f63e219]:
                - 'img "Usability Heuristic #4: A hotel check-in counter at that is always located at the front of a hotel." [ref=f63e220]'
                - generic [ref=f63e221]:
                  - strong [ref=f63e222]:
                    - emphasis [ref=f63e223]: "Example of Usability Heuristic #4:"
                  - emphasis [ref=f63e224]: Checkin counters are usually located at the front of hotels. This consistency meets customers’ expectations.
              - generic [ref=f63e225]:
                - paragraph [ref=f63e226]:
                  - strong [ref=f63e227]: Tips
                - list [ref=f63e228]:
                  - listitem [ref=f63e229]:
                    - text: Improve
                    - link "learnability" [ref=f63e230] [cursor=pointer]:
                      - /url: https://www.nngroup.com/videos/learnability-efficiency-ui-design/
                    - text: "by maintaining both types of consistency: internal and external."
                  - listitem [ref=f63e231]:
                    - text: Maintain
                    - link "consistency" [ref=f63e232] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/omnichannel-consistency/
                    - text: within a single product or a
                    - link "family of products (internal consistency)." [ref=f63e233] [cursor=pointer]:
                      - /url: https://www.nngroup.com/videos/design-systems/
                  - listitem [ref=f63e234]:
                    - text: Follow established
                    - link "industry conventions" [ref=f63e235] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/do-interface-standards-stifle-design-creativity/
                    - text: (external consistency).
                - paragraph [ref=f63e236]:
                  - strong [ref=f63e237]: Learn more
                - list [ref=f63e238]:
                  - listitem [ref=f63e239]:
                    - link [ref=f63e240] [cursor=pointer]:
                      - /url: http://www.nngroup.com/articles/consistency-and-standards/
                      - text: "Full article:"
                      - emphasis [ref=f63e241]: Consistency and Standards
                  - listitem [ref=f63e242]:
                    - link [ref=f63e243] [cursor=pointer]:
                      - /url: https://www.nngroup.com/videos/usability-heuristic-consistency-standards/
                      - text: "3-minute video:"
                      - emphasis [ref=f63e244]: Consistency and Standards
            - 'heading "5: Error Prevention" [level=2] [ref=f63e245]'
            - paragraph [ref=f63e246]:
              - strong [ref=f63e247]: Good error messages are important, but the best designs carefully prevent problems from occurring in the first place. Either eliminate error-prone conditions, or check for them and present users with a confirmation option before they commit to the action.
            - paragraph [ref=f63e248]:
              - text: "There are two types of errors:"
              - link "slips and mistakes" [ref=f63e249] [cursor=pointer]:
                - /url: https://www.nngroup.com/videos/slips-vs-mistakes/
              - text: . Slips are unconscious errors caused by inattention. Mistakes are conscious errors based on a mismatch between the user’s mental model and the design.
            - generic [ref=f63e250]:
              - figure [ref=f63e252]:
                - 'img "Usability Heuristic #5: A highway that has guard rails so a driver can''t drive off the side." [ref=f63e253]'
                - generic [ref=f63e254]:
                  - strong [ref=f63e255]:
                    - emphasis [ref=f63e256]: "Example of Usability Heuristic #5:"
                  - emphasis [ref=f63e257]: Guard rails on curvy mountain roads prevent drivers from falling off cliffs.
              - generic [ref=f63e258]:
                - paragraph [ref=f63e259]:
                  - strong [ref=f63e260]: Tips
                - list [ref=f63e261]:
                  - listitem [ref=f63e262]: "Prioritize your effort: Prevent high-cost errors first, then little frustrations."
                  - listitem [ref=f63e263]:
                    - link "Avoid slips" [ref=f63e264] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/slips/
                    - text: by providing helpful constraints and good
                    - link "defaults" [ref=f63e265] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/the-power-of-defaults/
                    - text: .
                  - listitem [ref=f63e266]:
                    - text: Prevent mistakes by removing memory burdens, supporting undo, and
                    - link "warning your users" [ref=f63e267] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/confirmation-dialog/
                    - text: .
                - paragraph [ref=f63e268]:
                  - strong [ref=f63e269]: Learn more
                - list [ref=f63e270]:
                  - listitem [ref=f63e271]:
                    - link [ref=f63e272] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/slips/
                      - text: "Full article:"
                      - emphasis [ref=f63e273]: Preventing User Errors
                  - listitem [ref=f63e274]:
                    - link [ref=f63e275] [cursor=pointer]:
                      - /url: https://www.nngroup.com/videos/usability-heuristic-error-prevention/
                      - text: "3-minute video:"
                      - emphasis [ref=f63e276]: Error Prevention
            - 'heading "6: Recognition Rather than Recall" [level=2] [ref=f63e277]'
            - paragraph [ref=f63e278]:
              - strong [ref=f63e279]: Minimize the user's memory load by making elements, actions, and options visible. The user should not have to remember information from one part of the interface to another. Information required to use the design (e.g. field labels or menu items) should be visible or easily retrievable when needed.
            - paragraph [ref=f63e280]:
              - text: Humans have limited short-term
              - link "memories" [ref=f63e281] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/working-memory-external-memory/
              - text: . Interfaces that promote recognition reduce the amount of cognitive effort required from users.
            - generic [ref=f63e282]:
              - figure [ref=f63e284]:
                - 'img "Usability Heuristic #6: A castle that represents Lisbon. It is easier for people to hear the capital and place it''s country, rather than name a capital outright." [ref=f63e285]'
                - generic [ref=f63e286]:
                  - strong [ref=f63e287]:
                    - emphasis [ref=f63e288]: "Example of Usability Heuristic #6:"
                  - emphasis [ref=f63e289]: It’s easier for most people to recognize the capitals of countries, instead of having to remember them. People are more likely to correctly answer the question
                  - text: Is Lisbon the capital of Portugal?
                  - emphasis [ref=f63e290]: rather than
                  - text: What’s the capital of Portugal?
              - generic [ref=f63e291]:
                - paragraph [ref=f63e292]:
                  - strong [ref=f63e293]: Tips
                - list [ref=f63e294]:
                  - listitem [ref=f63e295]: Let people recognize information in the interface, rather than forcing them to remember (“recall”) it.
                  - listitem [ref=f63e296]:
                    - text: Offer
                    - link "help in context" [ref=f63e297] [cursor=pointer]:
                      - /url: https://www.nngroup.com/videos/just-in-time-help/
                    - text: ", instead of giving users a long tutorial to memorize."
                  - listitem [ref=f63e298]: Reduce the information that users have to remember.
                - paragraph [ref=f63e299]:
                  - strong [ref=f63e300]: Learn more
                - list [ref=f63e301]:
                  - listitem [ref=f63e302]:
                    - link [ref=f63e303] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/recognition-and-recall/
                      - text: "Full article:"
                      - emphasis [ref=f63e304]: Recognition vs. Recall in UX
                  - listitem [ref=f63e305]:
                    - link [ref=f63e306] [cursor=pointer]:
                      - /url: https://www.nngroup.com/videos/recognition-vs-recall/
                      - text: "3-minute video:"
                      - emphasis [ref=f63e307]: Recognition vs. Recall
            - 'heading "7: Flexibility and Efficiency of Use" [level=2] [ref=f63e308]'
            - paragraph [ref=f63e309]:
              - strong [ref=f63e310]: Shortcuts — hidden from novice users — may speed up the interaction for the expert user so that the design can cater to both inexperienced and experienced users. Allow users to tailor frequent actions.
            - paragraph [ref=f63e311]: Flexible processes can be carried out in different ways, so that people can pick whichever method works for them.
            - generic [ref=f63e312]:
              - figure [ref=f63e314]:
                - 'img "Usability Heuristic #7: A picture of a map with 2 routes. The first is a regular route, the second is a shortcut." [ref=f63e315]'
                - generic [ref=f63e316]:
                  - strong [ref=f63e317]:
                    - emphasis [ref=f63e318]: "Example of Usability Heuristic #7:"
                  - emphasis [ref=f63e319]: Regular routes are listed on maps, but locals with knowledge of the area can take shortcuts.
              - generic [ref=f63e320]:
                - paragraph [ref=f63e321]:
                  - strong [ref=f63e322]: Tips
                - list [ref=f63e323]:
                  - listitem [ref=f63e324]:
                    - text: Provide
                    - link "accelerators" [ref=f63e325] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/ui-accelerators/
                    - text: like keyboard shortcuts and touch gestures.
                  - listitem [ref=f63e326]:
                    - text: Provide
                    - link "personalization" [ref=f63e327] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/personalization/
                    - text: by tailoring content and functionality for individual users.
                  - listitem [ref=f63e328]:
                    - text: Allow for
                    - link "customization" [ref=f63e329] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/customization-personalization/
                    - text: ", so users can make selections about how they want the product to work."
                - paragraph [ref=f63e330]:
                  - strong [ref=f63e331]: Learn more
                - list [ref=f63e332]:
                  - listitem [ref=f63e333]:
                    - link [ref=f63e334] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/flexibility-efficiency-heuristic/
                      - text: "Full article:"
                      - emphasis [ref=f63e335]: "Flexibility and Efficiency of Use: The 7th Usability Heuristic Explained"
                  - listitem [ref=f63e336]:
                    - link [ref=f63e337] [cursor=pointer]:
                      - /url: https://www.nngroup.com/videos/flexibility-efficiency-use/
                      - text: "3-minute video:"
                      - emphasis [ref=f63e338]: Flexibility and Efficiency of Use
            - 'heading "8: Aesthetic and Minimalist Design" [level=2] [ref=f63e339]'
            - paragraph [ref=f63e340]:
              - strong [ref=f63e341]: Interfaces should not contain information that is irrelevant or rarely needed. Every extra unit of information in an interface competes with the relevant units of information and diminishes their relative visibility.
            - paragraph [ref=f63e342]:
              - text: This heuristic doesn't mean you have to use a
              - link "flat design" [ref=f63e343] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/flat-design/
              - text: — it's about making sure you're keeping the content and visual design focused on the essentials. Ensure that the visual elements of the interface support the user's primary goals.
            - generic [ref=f63e344]:
              - figure [ref=f63e346]:
                - 'img "Usability Heuristic #8: Two teapots side by side. One basic and straightforward, the other ornate with a fancy handle and curvy spout." [ref=f63e347]'
                - generic [ref=f63e348]:
                  - strong [ref=f63e349]:
                    - emphasis [ref=f63e350]: "Example of Usability Heuristic #8:"
                  - emphasis [ref=f63e351]: An ornate teapot may have excessive decorative elements, like an uncomfortable handle or hard-to-wash nozzle, that can interfere with usability.
              - generic [ref=f63e352]:
                - paragraph [ref=f63e353]:
                  - strong [ref=f63e354]: Tips
                - list [ref=f63e355]:
                  - listitem [ref=f63e356]:
                    - text: Keep the
                    - link "content" [ref=f63e357] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/how-little-do-users-read/
                    - text: and
                    - link "visual design" [ref=f63e358] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/principles-visual-design/
                    - text: of UI focused on the essentials.
                  - listitem [ref=f63e359]: Don't let unnecessary elements distract users from the information they really need.
                  - listitem [ref=f63e360]:
                    - link "Prioritize the content and features" [ref=f63e361] [cursor=pointer]:
                      - /url: https://www.nngroup.com/videos/less-is-more/
                    - text: to support primary goals.
                - paragraph [ref=f63e362]:
                  - strong [ref=f63e363]: Learn more
                - list [ref=f63e364]:
                  - listitem [ref=f63e365]:
                    - link [ref=f63e366] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/aesthetic-minimalist-design/
                      - text: "Full article:"
                      - emphasis [ref=f63e367]: "Aesthetic and Minimalist Design (Usability Heuristic #8)"
                  - listitem [ref=f63e368]:
                    - link [ref=f63e369] [cursor=pointer]:
                      - /url: https://www.nngroup.com/videos/aesthetic-and-minimalist-design/
                      - text: "3-minute video:"
                      - emphasis [ref=f63e370]: Aesthetic and Minimalist Design
            - 'heading "9: Help Users Recognize, Diagnose, and Recover from Errors" [level=2] [ref=f63e371]'
            - paragraph [ref=f63e372]:
              - strong [ref=f63e373]: Error messages should be expressed in plain language (no error codes), precisely indicate the problem, and constructively suggest a solution.
            - paragraph [ref=f63e374]: These error messages should also be presented with visual treatments that will help users notice and recognize them.
            - generic [ref=f63e375]:
              - figure [ref=f63e377]:
                - 'img "Usability Heuristic #9: A picture of a road with a wrong way sign to the right that would warn drivers not to enter." [ref=f63e378]'
                - generic [ref=f63e379]:
                  - strong [ref=f63e380]:
                    - emphasis [ref=f63e381]: "Example of Usability Heuristic #9:"
                  - text: Wrong way
                  - emphasis [ref=f63e382]: signs on the road remind drivers that they are heading in the wrong direction and ask them to stop.
              - generic [ref=f63e383]:
                - paragraph [ref=f63e384]:
                  - strong [ref=f63e385]: Tips
                - list [ref=f63e386]:
                  - listitem [ref=f63e387]:
                    - text: Use traditional
                    - link "error-message" [ref=f63e388] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/error-message-guidelines/
                    - text: visuals, like bold, red text.
                  - listitem [ref=f63e389]:
                    - text: Tell users what went wrong in
                    - link "language they will understand" [ref=f63e390] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/plain-language-experts/
                    - text: — avoid technical jargon.
                  - listitem [ref=f63e391]: Offer users a solution, like a shortcut that can solve the error immediately.
                - paragraph [ref=f63e392]:
                  - strong [ref=f63e393]: Learn more
                - list [ref=f63e394]:
                  - listitem [ref=f63e395]:
                    - link [ref=f63e396] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/error-message-guidelines/
                      - text: "Full article:"
                      - emphasis [ref=f63e397]: Error-Message Guidelines
                  - listitem [ref=f63e398]:
                    - link [ref=f63e399] [cursor=pointer]:
                      - /url: https://www.nngroup.com/videos/usability-heuristic-recognize-errors/
                      - text: "2-minute video:"
                      - emphasis [ref=f63e400]: Helping Users Overcome Errors
            - 'heading "10: Help and Documentation" [level=2] [ref=f63e401]'
            - paragraph [ref=f63e402]:
              - strong [ref=f63e403]: It’s best if the system doesn’t need any additional explanation. However, it may be necessary to provide documentation to help users understand how to complete their tasks.
            - paragraph [ref=f63e404]: Help and documentation content should be easy to search and focused on the user's task. Keep it concise, and list concrete steps that need to be carried out.
            - generic [ref=f63e405]:
              - figure [ref=f63e407]:
                - generic [ref=f63e408]:
                  - strong [ref=f63e409]:
                    - emphasis [ref=f63e410]: "Example of Usability Heuristic #10:"
                  - emphasis [ref=f63e411]: Information kiosks at airports are easily recognizable and solve customers’ problems in context and immediately.
              - generic [ref=f63e412]:
                - paragraph [ref=f63e413]:
                  - strong [ref=f63e414]: Tips
                - list [ref=f63e415]:
                  - listitem [ref=f63e416]:
                    - text: Ensure that the help documentation is easy to
                    - link "search" [ref=f63e417] [cursor=pointer]:
                      - /url: https://www.nngroup.com/articles/search-visible-and-simple/
                    - text: .
                  - listitem [ref=f63e418]: Whenever possible, present the documentation in context right at the moment that the user requires it.
                  - listitem [ref=f63e419]: List concrete steps to be carried out.
                - paragraph [ref=f63e420]:
                  - strong [ref=f63e421]: Learn more
                - list [ref=f63e422]:
                  - listitem [ref=f63e423]:
                    - link [ref=f63e424] [cursor=pointer]:
