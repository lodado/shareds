            - heading "Note from Jakob" [level=3] [ref=f63e441]
            - paragraph [ref=f63e442]: I originally developed the heuristics for heuristic evaluation in collaboration with Rolf Molich in 1990 [Molich and Nielsen 1990; Nielsen and Molich 1990]. Four years later, I refined the heuristics based on a factor analysis of 249 usability problems [Nielsen 1994a] to derive a set of heuristics with maximum explanatory power, resulting in this revised set of heuristics [Nielsen 1994b].
            - paragraph [ref=f63e443]:
              - text: In 2020, we updated this article, adding more explanation, examples, and related links. While we slightly refined the language of the definitions, the
              - strong [ref=f63e444]: 10 heuristics themselves have remained relevant and unchanged since 1994.
              - text: When something has remained true for 26 years, it will likely apply to future generations of user interfaces as well.
            - heading "See Also" [level=3] [ref=f63e445]
