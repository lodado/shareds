        - /url: /engineering
      - generic [ref=f52e36]:
        - 'heading "Scaling Managed Agents: Decoupling the brain from the hands" [level=1] [ref=f52e39]'
        - generic [ref=f52e40]:
          - paragraph [ref=f52e41]: Published Apr 08, 2026
          - paragraph [ref=f52e42]: Harnesses encode assumptions that go stale as models improve. Managed Agents—our hosted service for long-horizon agent work—is built around interfaces that stay stable as harnesses change.
    - generic [ref=f52e43]:
      - article [ref=f52e44]:
        - generic [ref=f52e46]:
          - paragraph [ref=f52e47]:
            - emphasis [ref=f52e48]:
              - text: Get started with Claude Managed Agents by following our
              - link "docs" [ref=f52e49] [cursor=pointer]:
                - /url: https://platform.claude.com/docs/en/managed-agents/overview
              - text: .
            - text: A running topic on the Engineering Blog is how to
            - link "build effective agents" [ref=f52e50] [cursor=pointer]:
              - /url: https://www.anthropic.com/engineering/building-effective-agents
            - text: and
            - link "design harnesses" [ref=f52e51] [cursor=pointer]:
              - /url: https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents
            - text: for
            - link "long-running work" [ref=f52e52] [cursor=pointer]:
              - /url: https://www.anthropic.com/engineering/harness-design-long-running-apps
            - text: . A common thread across this work is that harnesses encode assumptions about what Claude can’t do on its own. However, those assumptions need to be frequently questioned because they can
            - link "go stale" [ref=f52e53] [cursor=pointer]:
              - /url: http://www.incompleteideas.net/IncIdeas/BitterLesson.html
            - text: as models improve.
          - paragraph
          - paragraph [ref=f52e54]:
            - text: As just one example, in prior work
            - link "we found" [ref=f52e55] [cursor=pointer]:
              - /url: https://www.anthropic.com/engineering/harness-design-long-running-apps
            - text: that Claude Sonnet 4.5 would wrap up tasks prematurely as it sensed its context limit approaching—a behavior sometimes called “context anxiety.” We addressed this by adding context resets to the harness. But when we used the same harness on Claude Opus 4.5, we found that the behavior was gone. The resets had become dead weight.
          - paragraph
          - paragraph [ref=f52e56]: "We expect harnesses to continue evolving. So we built Managed Agents: a hosted service in the Claude Platform that runs long-horizon agents on your behalf through a small set of interfaces meant to outlast any particular implementation—including the ones we run today."
          - paragraph
          - paragraph [ref=f52e57]:
            - text: "Building Managed Agents meant solving an old problem in computing: how to design a system for “"
            - link "programs as yet unthought of" [ref=f52e58] [cursor=pointer]:
              - /url: http://www.catb.org/esr/writings/taoup/html/ch03s01.html
            - text: .” Decades ago, operating systems solved this problem by virtualizing hardware into abstractions—
            - emphasis [ref=f52e59]: process, file
            - text: —general enough for programs that didn't exist yet. The abstractions outlasted the hardware. The
            - code [ref=f52e60]: read()
            - text: command is agnostic as to whether it’s accessing a disk pack from the 1970s or a modern SSD. The abstractions on top stayed stable while the implementations underneath changed freely.
          - paragraph
          - paragraph [ref=f52e61]: "Managed Agents follow the same pattern. We virtualized the components of an agent: a session (the append-only log of everything that happened), a harness (the loop that calls Claude and routes Claude’s tool calls to the relevant infrastructure), and a sandbox (an execution environment where Claude can run code and edit files). This allows the implementation of each to be swapped without disturbing the others. We're opinionated about the shape of these interfaces, not about what runs behind them."
          - paragraph [ref=f52e62]
          - figure [ref=f52e64]
          - heading "Don’t adopt a pet" [level=2] [ref=f52e66]
          - paragraph [ref=f52e67]: We started by placing all agent components into a single container, which meant the session, agent harness, and sandbox all shared an environment. There were benefits to this approach, including that file edits are direct syscalls, and there were no service boundaries to design.
          - paragraph
          - paragraph [ref=f52e68]:
            - text: "But by coupling everything into one container, we ran into an old infrastructure problem: we’d adopted a"
            - link [ref=f52e69] [cursor=pointer]:
              - /url: https://cloudscaling.com/blog/cloud-computing/the-history-of-pets-vs-cattle/
              - emphasis [ref=f52e70]: pet
            - text: . In the pets-vs-cattle analogy, a pet is a named, hand-tended individual you can’t afford to lose, while cattle are interchangeable. In our case, the server became that pet; if a container failed, the session was lost. If a container was unresponsive, we had to nurse it back to health.
          - paragraph
          - paragraph [ref=f52e71]:
            - text: Nursing containers meant debugging unresponsive stuck sessions. Our only window in was the WebSocket event stream, but that couldn’t tell us
            - emphasis [ref=f52e72]: where
            - text: failures arose, which meant that a bug in the harness, a packet drop in the event stream, or a container going offline all presented the same. To figure out what went wrong, an engineer had to open a shell inside the container, but because that container often also held user data, that approach essentially meant we lacked the ability to debug.
          - paragraph
          - paragraph [ref=f52e73]: A second issue was that the harness assumed that whatever Claude worked on lived in the container with it. When customers asked us to connect Claude to their virtual private cloud, they had to either peer their network with ours, or run our harness in their own environment. An assumption baked into the harness became a problem when we wanted to connect it to different infrastructure.
          - paragraph
          - heading "Decouple the brain from the hands" [level=2] [ref=f52e74]
          - paragraph [ref=f52e75]: The solution we arrived at was to decouple what we thought of as the “brain” (Claude and its harness) from both the “hands” (sandboxes and tools that perform actions) and the “session” (the log of session events). Each became an interface that made few assumptions about the others, and each could fail or be replaced independently.
          - paragraph
          - paragraph [ref=f52e76]:
            - strong [ref=f52e77]: The harness leaves the container.
            - text: "Decoupling the brain from the hands meant the harness no longer lived inside the container. It called the container the way it called any other tool:"
            - code [ref=f52e78]: execute(name, input) → string
            - text: ". The container became cattle. If the container died, the harness caught the failure as a tool-call error and passed it back to Claude. If Claude decided to retry, a new container could be reinitialized with a standard recipe:"
            - code [ref=f52e79]: "provision({resources})"
            - text: . We no longer had to nurse failed containers back to health.
          - paragraph
          - paragraph [ref=f52e80]:
            - strong [ref=f52e81]: Recovering from harness failure.
            - text: The harness also became cattle. Because the session log sits outside the harness, nothing in the harness needs to survive a crash. When one fails, a new one can be rebooted with
            - code [ref=f52e82]: wake(sessionId)
            - text: ", use"
            - code [ref=f52e83]: getSession(id)
            - text: to get back the event log, and resume from the last event. During the agent loop, the harness writes to the session with
            - code [ref=f52e84]: emitEvent(id, event)
            - text: in order to keep a durable record of events.
          - paragraph [ref=f52e85]
          - figure [ref=f52e87]
          - paragraph [ref=f52e89]
          - paragraph [ref=f52e90]:
            - strong [ref=f52e91]: The security boundary.
            - text: In the coupled design, any untrusted code that Claude generated was run in the same container as credentials—so a prompt injection only had to convince Claude to read its own environment. Once an attacker has those tokens, they can spawn fresh, unrestricted sessions and delegate work to them. Narrow scoping is an obvious mitigation, but this encodes an assumption about what Claude can't do with a limited token—and Claude is getting increasingly smart. The structural fix was to make sure the tokens are never reachable from the sandbox where Claude’s generated code runs.
          - paragraph
          - paragraph [ref=f52e92]:
            - text: We used two patterns to ensure this. Auth can be bundled with a resource or held in a vault outside the sandbox. For Git, we use each repository’s access token to clone the repo during sandbox initialization and wire it into the local git remote. Git
            - code [ref=f52e93]: push
            - text: and
            - code [ref=f52e94]: pull
            - text: work from inside the sandbox without the agent ever handling the token itself. For custom tools, we support MCP and store OAuth tokens in a secure vault. Claude calls MCP tools via a dedicated proxy; this proxy takes in a token associated with the session. The proxy can then fetch the corresponding credentials from the vault and make the call to the external service. The harness is never made aware of any credentials.
          - heading "The session is not Claude’s context window" [level=2] [ref=f52e95]
          - paragraph [ref=f52e96]:
            - text: Long-horizon tasks often exceed the length of Claude’s context window, and the standard ways to address this all involve irreversible decisions about what to keep. We’ve explored these techniques in
            - link "prior work" [ref=f52e97] [cursor=pointer]:
              - /url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
            - text: on context engineering. For example, compaction lets Claude save a summary of its context window and the memory tool lets Claude write context to files, enabling learning across sessions. This can be paired with context trimming, which selectively removes tokens such as old tool results or thinking blocks.
          - paragraph
          - paragraph [ref=f52e98]:
            - text: But irreversible decisions to selectively retain or discard context can lead to failures. It is difficult to know which tokens the future turns will need. If messages are transformed by a compaction step, the harness removes compacted messages from Claude’s context window, and these are recoverable only if they are stored. Prior work
            - link "has explored" [ref=f52e99] [cursor=pointer]:
              - /url: https://arxiv.org/pdf/2512.24601
            - text: ways to address this by storing context as an object that lives
            - emphasis [ref=f52e100]: outside
            - text: the context window. For example, context can be an object in a REPL that the LLM programmatically accesses by writing code to filter or slice it.
          - paragraph
          - figure [ref=f52e102]
          - paragraph [ref=f52e104]:
            - text: In Managed Agents, the session provides this same benefit, serving as a context object that lives outside Claude’s context window. But rather than be stored within the sandbox or REPL, context is durably stored in the session log. The interface,
            - code [ref=f52e105]: getEvents(),
            - text: allows the brain to interrogate context by selecting positional slices of the event stream. The interface can be used flexibly, allowing the brain to pick up from wherever it last stopped reading, rewinding a few events before a specific moment to see the lead up, or rereading context before a specific action.
          - paragraph
          - paragraph [ref=f52e106]: Any fetched events can also be transformed in the harness before being passed to Claude’s context window. These transformations can be whatever the harness encodes, including context organization to achieve a high prompt cache hit rate and context engineering. We separated the concerns of recoverable context storage in the session and arbitrary context management in the harness because we can’t predict what specific context engineering will be required in future models. The interfaces push that context management into the harness, and only guarantee that the session is durable and available for interrogation.
          - heading "Many brains, many hands" [level=2] [ref=f52e107]
          - paragraph [ref=f52e108]:
            - strong [ref=f52e109]: Many brains.
            - text: Decoupling the brain from the hands solved one of our earliest customer complaints. When teams wanted Claude to work against resources in their own VPC, the only path was to peer their network with ours, because the container holding the harness assumed every resource sat next to it. Once the harness was no longer in the container, that assumption went away. The same change had a performance payoff. When we initially put the brain in a container, it meant that many brains required as many containers. For each brain, no inference could happen until that container was provisioned; every session paid the full container setup cost up front. Every session, even ones that would never touch the sandbox, had to clone the repo, boot the process, fetch pending events from our servers.
          - paragraph
          - paragraph [ref=f52e110]:
            - text: That dead time is expressed in time-to-first-token (TTFT), which measures how long a session waits between accepting work and producing its first response token. TTFT is the latency the user most acutely
            - emphasis [ref=f52e111]: feels
            - text: .
          - paragraph
          - paragraph [ref=f52e112]:
            - text: Decoupling the brain from the hands means that containers are provisioned by the brain via a tool call
            - code [ref=f52e113]: (execute(name, input) → string)
            - text: only if they are needed. So a session that didn't need a container right away didn't wait for one. Inference could start as soon as the orchestration layer pulled pending events from the session log. Using this architecture, our p50 TTFT dropped roughly 60% and p95 dropped over 90%. Scaling to many brains just meant starting many stateless harnesses, and connecting them to hands only if needed.
          - paragraph
          - paragraph [ref=f52e114]:
            - strong [ref=f52e115]: Many hands.
            - text: "We also wanted the ability to connect each brain to many hands. In practice, this means Claude must reason about many execution environments and decide where to send work—a harder cognitive task than operating in a single shell. We started with the brain in a single container because earlier models weren't capable of this. As intelligence scaled, the single container became the limitation instead: when that container failed, we lost state for every hand that the brain was reaching into."
          - paragraph
          - paragraph [ref=f52e116]:
            - text: Decoupling the brain from the hands makes each hand a tool,
            - code [ref=f52e117]: execute(name, input) → string
            - text: ": a name and input go in, and a string is returned. That interface supports any custom tool, any MCP server, and our own tools. The harness doesn’t know whether the sandbox is a container, a phone, or a Pokémon emulator. And because no hand is coupled to any brain, brains can pass hands to one another."
          - paragraph [ref=f52e118]
          - figure [ref=f52e120]
          - paragraph
          - heading "Conclusion" [level=2] [ref=f52e122]
          - paragraph [ref=f52e123]: "The challenge we faced is an old one: how to design a system for “programs as yet unthought of.” Operating systems have lasted decades by virtualizing the hardware into abstractions general enough for programs that didn't exist yet. With Managed Agents, we aimed to design a system that accommodates future harnesses, sandboxes, or other components around Claude."
          - paragraph
          - paragraph [ref=f52e124]:
            - text: Managed Agents is a meta-harness in the same spirit, unopinionated about the
            - emphasis [ref=f52e125]: specific
            - text: harness that Claude will need in the future. Rather, it is a system with general interfaces that allow many different harnesses. For example, Claude Code is an excellent harness that we use widely across tasks. We’ve also shown that task-specific agent harnesses excel in narrow domains. Managed Agents can accommodate any of these, matching Claude’s intelligence over time.
          - paragraph
          - paragraph [ref=f52e126]: "Meta-harness design means being opinionated about the interfaces around Claude: we expect that Claude will need the ability to manipulate state (the session) and perform computation (the sandbox). We also expect that Claude will require the ability to scale to many brains and many hands. We designed the interfaces so that these can be run reliably and securely over long time horizons. But we make no assumptions about the number or location of brains or hands that Claude will need."
          - heading "Acknowledgements" [level=2] [ref=f52e127]
          - paragraph [ref=f52e128]: Written by Lance Martin, Gabe Cemaj, and Michael Cohen. Thanks to Nodir Turakulov and Jeremy Fox for helpful conversations on these topics. Special thanks to the Agents API team and Jake Eaton for their contributions.
