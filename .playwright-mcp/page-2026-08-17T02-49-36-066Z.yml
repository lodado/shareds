            - paragraph [ref=f16e246]:
              - text: Take notice, our
              - code [ref=f16e247]: Component
              - text: now only consumes custom hooks. These custom hooks give us a little more context to what they mean, and we don’t have the implementation details of our state handler functions sitting in the middle of our component function.
            - paragraph [ref=f16e248]:
              - text: Another benefit of this pattern is that dependencies quickly become obvious
              - emphasis [ref=f16e249]: because they end up being arguments to our custom hooks
              - text: . What if our
              - code [ref=f16e250]: useInput
              - text: hook should begin with an initial state other than an empty string and we use that for resetting the input as well?
