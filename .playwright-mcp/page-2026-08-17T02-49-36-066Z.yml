                - generic [ref=f16e73]: "🔥 take I haven't fully thought through incoming: Every use of useEffect should be in a custom hook with a damn good name. It's frequently difficult to read & comprehend intention of the code when effects are strewn about. Better to encapsulate and provide context."
            - paragraph [ref=f16e75]:
              - text: This tweet was my response to some refactoring of our codebase, but having more than a month now to practice this a few more times, I’m convinced this pattern is the right way to go. I’ll go further and say
              - strong [ref=f16e76]: most uses of React hooks should be encapsulated in a custom hook
              - text: ", and I’m going to try and convince you of that on this post."
            - paragraph [ref=f16e77]:
              - text: Before we get started, it will benefit you greatly if you read my post on
              - link "encapsulation" [ref=f16e78] [cursor=pointer]:
                - /url: /encapsulation
              - text: first. In that post, I argue that the primary purpose of a function is to encapuslate all the elements of a concern together into a single structure. We’re going to apply this pattern to how we work with React Hooks.
            - heading "The Problem" [level=3] [ref=f16e79]
            - paragraph [ref=f16e80]: Given the nature of our work, that requirements change frequently and therefore code changes frequently, too, it is not surprising that our codebases become messy. Our logic gets strewn about like tools left on a workbench. The problem is that hidden in the mess of functions and objects is important information that is getting lost. Important historical decisions left without explanation or context and more. I’ll try to come up with a contrived example quickly.
            - paragraph [ref=f16e81]:
