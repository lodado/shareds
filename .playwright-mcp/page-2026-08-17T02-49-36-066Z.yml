            - paragraph [ref=f16e313]: Obviously, this type of change might be completely unnecessary for my example, but I hope you can recognize where this layer of abstraction might be useful to you when you have to change the implementation details of a hook. We were able to replace the entire state management of our hook without changing the API, which means our component behaves the same way, even though the implementation of that behavior has changed quite a bit.
            - heading "How to Enforce this Pattern" [level=3] [ref=f16e314]
            - paragraph [ref=f16e315]:
              - text: What good is a pattern if you can’t come up with a way to get others to use it? To steer them down the good path? We can do that for this pattern with an ESLint plugin and rule. Thus, I give you the
              - code [ref=f16e316]: eslint-plugin-use-encapsulation
              - text: and the
              - code [ref=f16e317]: prefer-custom-hooks
              - text: "rule! You can find it here:"
              - link "https://github.com/kyleshevlin/eslint-plugin-use-encapsulation" [ref=f16e318] [cursor=pointer]:
                - /url: https://github.com/kyleshevlin/eslint-plugin-use-encapsulation
              - text: .
            - paragraph [ref=f16e319]:
              - text: Following the installation instructions, you’ll see that
              - code [ref=f16e320]: prefer-custom-hooks
              - text: will warn you whenever you use a React hook directly inside a component. The only way around the warning (other than disabling the rule), is to use the React hooks from within a custom hook.
            - heading "Summary" [level=3] [ref=f16e321]
            - paragraph [ref=f16e322]: By opting to write all the hooks consumed by your components as custom ones, you will be providing future devs (including yourself) useful context by encapsulating all the pieces of a concern into a single function. By doing this, you gain all the benefits of proper encapsulation and make your components more declarative. You might even gain a few useful reusable hooks in the process.
            - heading "useEncapsulation Talk at CascadiaJS" [level=3] [ref=f16e323]
            - paragraph [ref=f16e324]: I recently gave a talk on this topic at the CascadiaJS conference and wanted to share that recording with you. Enjoy!
