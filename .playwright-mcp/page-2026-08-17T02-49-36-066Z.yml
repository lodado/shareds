            - paragraph [ref=f16e166]:
              - text: Are you starting to see the problem I’m seeing? Even though we wrote relatively clean and clear code, we have started to create a
              - strong [ref=f16e167]: gap
              - text: between related implementation details.
            - paragraph [ref=f16e168]:
              - text: We
              - emphasis [ref=f16e169]: need
              - text: to call our hooks in the same order every render of
              - code [ref=f16e170]: Component
              - text: . Those are the rules. To accomplish this, we’ve followed a common organizational pattern with our declarations of state near the top of our component and our various event handlers further down. But in following this pattern, we’ve separated the toggle state and its event handlers with the interruption of declaring another instance of
              - code [ref=f16e171]: useState
              - text: . Even worse, our input state is separated from its related handlers by three unrelated function declarations.
              - strong [ref=f16e172]: Just imagine this in your codebase and I’m sure you’ve seen far worse!
              - text: This can quickly become a nightmare.
            - paragraph [ref=f16e173]:
              - text: "There is, fortunately, a very simple solution:"
              - strong [ref=f16e174]: custom hooks
              - text: .
            - heading "Why Custom Hooks are the Solution" [level=3] [ref=f16e175]
            - paragraph [ref=f16e176]:
              - text: A custom hook is
              - emphasis [ref=f16e177]: just a function
              - text: and functions are structures we can use to encapsulate the related elements of a concern and expose an API to our function’s consumer. In the case of our
              - code [ref=f16e178]: Component
              - text: ", these custom hooks are fairly simple to create."
