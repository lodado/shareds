            - paragraph [ref=f16e273]:
              - text: There are even more benefits. By adding this layer of abstraction between our component and the standard React hooks, we can change the implementation of our custom hook’s API without changing the component. Perhaps I want to use a reducer instead of
              - code [ref=f16e274]: useState
              - text: for our
