                  - row [ref=f53e134]:
                    - cell "Claude declares victory on the entire project too early." [ref=f53e135]
                    - 'cell "Set up a feature list file: based on the input spec, set up a structured JSON file with a list of end-to-end feature descriptions." [ref=f53e136]'
                    - cell "Read the feature list file at the beginning of a session. Choose a single feature to start working on." [ref=f53e137]
                  - row [ref=f53e138]:
                    - cell "Claude leaves the environment in a state with bugs or undocumented progress." [ref=f53e139]
                    - cell "An initial git repo and progress notes file is written." [ref=f53e140]
                    - cell "Start the session by reading the progress notes file and git commit logs, and run a basic test on the development server to catch any undocumented bugs. End the session by writing a git commit and progress update." [ref=f53e141]
                  - row [ref=f53e142]:
                    - cell "Claude marks features as done prematurely." [ref=f53e143]
                    - cell "Set up a feature list file." [ref=f53e144]
                    - cell "Self-verify all features. Only mark features as “passing” after careful testing." [ref=f53e145]
                  - row [ref=f53e146]:
                    - cell "Claude has to spend time figuring out how to run the app." [ref=f53e147]
                    - cell [ref=f53e148]:
                      - text: Write an
                      - code [ref=f53e149]: init.sh
                      - text: script that can run the development server.
                    - cell [ref=f53e150]:
                      - text: Start the session by reading
                      - code [ref=f53e151]: init.sh
                      - text: .
            - generic [ref=f53e152]: Summarizing four common failure modes and solutions in long-running AI agents.
          - heading "Future work" [level=2] [ref=f53e153]
          - paragraph [ref=f53e154]: This research demonstrates one possible set of solutions in a long-running agent harness to enable the model to make incremental progress across many context windows. However, there remain open questions.
          - paragraph [ref=f53e155]: Most notably, it’s still unclear whether a single, general-purpose coding agent performs best across contexts, or if better performance can be achieved through a multi-agent architecture. It seems reasonable that specialized agents like a testing agent, a quality assurance agent, or a code cleanup agent, could do an even better job at sub-tasks across the software development lifecycle.
          - paragraph [ref=f53e156]: Additionally, this demo is optimized for full-stack web app development. A future direction is to generalize these findings to other fields. It’s likely that some or all of these lessons can be applied to the types of long-running agentic tasks required in, for example, scientific research or financial modeling.
          - paragraph
          - paragraph
          - paragraph
          - heading "Acknowledgements" [level=3] [ref=f53e157]
          - paragraph [ref=f53e158]: Written by Justin Young. Special thanks to David Hershey, Prithvi Rajasakeran, Jeremy Hadfield, Naia Bouscal, Michael Tingley, Jesse Mu, Jake Eaton, Marius Buleandara, Maggie Vo, Pedram Navid, Nadine Yasser, and Alex Notov for their contributions.
          - paragraph [ref=f53e159]:
            - text: This work reflects the collective efforts of several teams across Anthropic who made it possible for Claude to safely do long-horizon autonomous software engineering, especially the code RL & Claude Code teams. Interested candidates who would like to contribute are welcome to apply at
            - link "anthropic.com/careers" [ref=f53e160] [cursor=pointer]:
              - /url: http://anthropic.com/careers
            - text: .
          - paragraph
          - heading "Footnotes" [level=3] [ref=f53e161]
          - paragraph [ref=f53e162]: 1. We refer to these as separate agents in this context only because they have different initial user prompts. The system prompt, set of tools, and overall agent harness was otherwise identical.
