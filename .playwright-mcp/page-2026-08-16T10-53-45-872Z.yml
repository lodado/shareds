  - main [ref=f53e33]:
    - region "Engineering Article Hero" [ref=f53e34]:
      - link "Engineering at Anthropic" [ref=f53e35] [cursor=pointer]:
        - /url: /engineering
      - generic [ref=f53e36]:
        - heading "Effective harnesses for long-running agents" [level=1] [ref=f53e39]
        - generic [ref=f53e40]:
          - paragraph [ref=f53e41]: Published Nov 26, 2025
          - paragraph [ref=f53e42]: Agents still face challenges working across many context windows. We looked to human engineers for inspiration in creating a more effective harness for long-running agents.
    - generic [ref=f53e43]:
      - article [ref=f53e44]:
        - generic [ref=f53e46]:
          - paragraph [ref=f53e47]: As AI agents become more capable, developers are increasingly asking them to take on complex tasks requiring work that spans hours, or even days. However, getting agents to make consistent progress across multiple context windows remains an open problem.
          - paragraph [ref=f53e48]: The core challenge of long-running agents is that they must work in discrete sessions, and each new session begins with no memory of what came before. Imagine a software project staffed by engineers working in shifts, where each new engineer arrives with no memory of what happened on the previous shift. Because context windows are limited, and because most complex projects cannot be completed within a single window, agents need a way to bridge the gap between coding sessions.
          - paragraph [ref=f53e49]:
            - text: We developed a two-fold solution to enable the
            - link "Claude Agent SDK" [ref=f53e50] [cursor=pointer]:
              - /url: https://platform.claude.com/docs/en/agent-sdk/overview
            - text: "to work effectively across many context windows: an"
            - strong [ref=f53e51]: initializer agent
            - text: that sets up the environment on the first run, and a
            - strong [ref=f53e52]: coding agent
            - text: that is tasked with making incremental progress in every session, while leaving clear artifacts for the next session. You can find code examples in the accompanying
            - link "quickstart." [ref=f53e53] [cursor=pointer]:
              - /url: https://github.com/anthropics/claude-quickstarts/tree/main/autonomous-coding
          - heading "The long-running agent problem" [level=2] [ref=f53e54]
          - paragraph [ref=f53e55]: The Claude Agent SDK is a powerful, general-purpose agent harness adept at coding, as well as other tasks that require the model to use tools to gather context, plan, and execute. It has context management capabilities such as compaction, which enables an agent to work on a task without exhausting the context window. Theoretically, given this setup, it should be possible for an agent to continue to do useful work for an arbitrarily long time.
          - paragraph [ref=f53e56]:
            - text: However, compaction isn’t sufficient. Out of the box, even a frontier coding model like Opus 4.5 running on the Claude Agent SDK in a loop across multiple context windows will fall short of building a production-quality web app if it’s only given a high-level prompt, such as “build a clone of
            - link "claude.ai" [ref=f53e57] [cursor=pointer]:
              - /url: http://claude.ai/redirect/website.v1.3307435e-1cdf-4ea8-addf-c0041489739f
            - text: .”
          - paragraph [ref=f53e58]: Claude’s failures manifested in two patterns. First, the agent tended to try to do too much at once—essentially to attempt to one-shot the app. Often, this led to the model running out of context in the middle of its implementation, leaving the next session to start with a feature half-implemented and undocumented. The agent would then have to guess at what had happened, and spend substantial time trying to get the basic app working again. This happens even with compaction, which doesn’t always pass perfectly clear instructions to the next agent.
          - paragraph [ref=f53e59]: A second failure mode would often occur later in a project. After some features had already been built, a later agent instance would look around, see that progress had been made, and declare the job done.
          - paragraph [ref=f53e60]:
            - text: This decomposes the problem into two parts. First, we need to set up an initial environment that lays the foundation for
            - emphasis [ref=f53e61]: all
            - text: "the features that a given prompt requires, which sets up the agent to work step-by-step and feature-by-feature. Second, we should prompt each agent to make incremental progress towards its goal while also leaving the environment in a clean state at the end of a session. By “clean state” we mean the kind of code that would be appropriate for merging to a main branch: there are no major bugs, the code is orderly and well-documented, and in general, a developer could easily begin work on a new feature without first having to clean up an unrelated mess."
          - paragraph [ref=f53e62]: "When experimenting internally, we addressed these problems using a two-part solution:"
          - list [ref=f53e63]:
            - listitem [ref=f53e64]:
              - text: "Initializer agent: The very first agent session uses a specialized prompt that asks the model to set up the initial environment: an"
              - code [ref=f53e65]: init.sh
              - text: script, a claude-progress.txt file that keeps a log of what agents have done, and an initial git commit that shows what files were added.
            - listitem [ref=f53e66]:
              - text: "Coding agent: Every subsequent session asks the model to make incremental progress, then leave structured updates."
              - superscript [ref=f53e67]: "1"
          - paragraph [ref=f53e68]: The key insight here was finding a way for agents to quickly understand the state of work when starting with a fresh context window, which is accomplished with the claude-progress.txt file alongside the git history. Inspiration for these practices came from knowing what effective software engineers do every day.
          - heading "Environment management" [level=2] [ref=f53e69]
          - paragraph [ref=f53e70]:
            - text: In the updated
            - link "Claude 4 prompting guide" [ref=f53e71] [cursor=pointer]:
              - /url: https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/claude-4-best-practices#multi-context-window-workflows
            - text: ", we shared some best practices for multi-context window workflows, including a harness structure that uses “a different prompt for the very first context window.” This “different prompt” requests that the initializer agent set up the environment with all the necessary context that future coding agents will need to work effectively. Here, we provide a deeper dive on some of the key components of such an environment."
          - heading "Feature list" [level=3] [ref=f53e72]
          - paragraph [ref=f53e73]:
            - text: To address the problem of the agent one-shotting an app or prematurely considering the project complete, we prompted the initializer agent to write a comprehensive file of feature requirements expanding on the user’s initial prompt. In the
            - link "claude.ai" [ref=f53e74] [cursor=pointer]:
              - /url: http://claude.ai/redirect/website.v1.3307435e-1cdf-4ea8-addf-c0041489739f
            - text: clone example, this meant over 200 features, such as “a user can open a new chat, type in a query, press enter, and see an AI response.” These features were all initially marked as “failing” so that later coding agents would have a clear outline of what full functionality looked like.
          - paragraph
          - generic [ref=f53e76]:
            - code [ref=f53e78]: "{ \"category\": \"functional\", \"description\": \"New chat button creates a fresh conversation\", \"steps\": [ \"Navigate to main interface\", \"Click the 'New Chat' button\", \"Verify a new conversation is created\", \"Check that chat area shows welcome state\", \"Verify conversation appears in sidebar\" ], \"passes\": false }"
            - button "Copy code" [ref=f53e80] [cursor=pointer]:
              - generic [ref=f53e83]: Copy
          - paragraph [ref=f53e84]: We prompt coding agents to edit this file only by changing the status of a passes field, and we use strongly-worded instructions like “It is unacceptable to remove or edit tests because this could lead to missing or buggy functionality.” After some experimentation, we landed on using JSON for this, as the model is less likely to inappropriately change or overwrite JSON files compared to Markdown files.
          - heading "Incremental progress" [level=3] [ref=f53e85]
          - paragraph [ref=f53e86]: Given this initial environment scaffolding, the next iteration of the coding agent was then asked to work on only one feature at a time. This incremental approach turned out to be critical to addressing the agent’s tendency to do too much at once.
          - paragraph [ref=f53e87]: Once working incrementally, it’s still essential that the model leaves the environment in a clean state after making a code change. In our experiments, we found that the best way to elicit this behavior was to ask the model to commit its progress to git with descriptive commit messages and to write summaries of its progress in a progress file. This allowed the model to use git to revert bad code changes and recover working states of the code base.
          - paragraph [ref=f53e88]: These approaches also increased efficiency, as they eliminated the need for an agent to have to guess at what had happened and spend its time trying to get the basic app working again.
          - heading "Testing" [level=3] [ref=f53e89]
          - paragraph [ref=f53e90]:
            - text: One final major failure mode that we observed was Claude’s tendency to mark a feature as complete without proper testing. Absent explicit prompting, Claude tended to make code changes, and even do testing with unit tests or
            - code [ref=f53e91]: curl
            - text: commands against a development server, but would fail recognize that the feature didn’t work end-to-end.
          - paragraph [ref=f53e92]: In the case of building a web app, Claude mostly did well at verifying features end-to-end once explicitly prompted to use browser automation tools and do all testing as a human user would.
          - figure "Screenshots taken by Claude through the Puppeteer MCP server as it tested the claude.ai clone." [ref=f53e94]:
            - img "Screenshots taken by Claude through the Puppeteer MCP server as it tested the claude.ai clone." [ref=f53e95]
          - paragraph [ref=f53e97]: Providing Claude with these kinds of testing tools dramatically improved performance, as the agent was able to identify and fix bugs that weren’t obvious from the code alone.
          - paragraph [ref=f53e98]: Some issues remain, like limitations to Claude’s vision and to browser automation tools making it difficult to identify every kind of bug. For example, Claude can’t see browser-native alert modals through the Puppeteer MCP, and features relying on these modals tended to be buggier as a result.
          - heading "Getting up to speed" [level=2] [ref=f53e99]
          - paragraph [ref=f53e100]: "With all of the above in place, every coding agent is prompted to run through a series of steps to get its bearings, some quite basic but still helpful:"
          - list [ref=f53e101]:
            - listitem [ref=f53e102]:
              - emphasis [ref=f53e103]:
                - text: Run
                - code [ref=f53e104]: pwd
                - text: to see the directory you’re working in. You’ll only be able to edit files in this directory.
            - listitem [ref=f53e105]:
              - emphasis [ref=f53e106]: Read the git logs and progress files to get up to speed on what was recently worked on.
            - listitem [ref=f53e107]:
              - emphasis [ref=f53e108]: Read the features list file and choose the highest-priority feature that’s not yet done to work on.
          - paragraph [ref=f53e109]: This approach saves Claude some tokens in every session since it doesn’t have to figure out how to test the code. It also helps to ask the initializer agent to write an init.sh script that can run the development server, and then run through a basic end-to-end test before implementing a new feature.
          - paragraph [ref=f53e110]: In the case of the claude.ai clone, this meant that the agent always started the local development server and used the Puppeteer MCP to start a new chat, send a message, and receive a response. This ensured that Claude could quickly identify if the app had been left in a broken state, and immediately fix any existing bugs. If the agent had instead started implementing a new feature, it would likely make the problem worse.
          - paragraph [ref=f53e111]: "Given all this, a typical session starts off with the following assistant messages:"
          - generic [ref=f53e113]:
            - code [ref=f53e115]: "[Assistant] I'll start by getting my bearings and understanding the current state of the project. [Tool Use] <bash - pwd> [Tool Use] <read - claude-progress.txt> [Tool Use] <read - feature_list.json> [Assistant] Let me check the git log to see recent work. [Tool Use] <bash - git log --oneline -20> [Assistant] Now let me check if there's an init.sh script to restart the servers. <Starts the development server> [Assistant] Excellent! Now let me navigate to the application and verify that some fundamental features are still working. <Tests basic functionality> [Assistant] Based on my verification testing, I can see that the fundamental functionality is working well. The core chat features, theme switching, conversation loading, and error handling are all functioning correctly. Now let me review the tests.json file more comprehensively to understand what needs to be implemented next. <Starts work on a new feature>"
            - button "Copy code" [ref=f53e117] [cursor=pointer]:
              - generic [ref=f53e120]: Copy
          - generic [ref=f53e122]:
            - region "Summarizing four common failure modes and solutions in long-running AI agents." [ref=f53e123]:
              - paragraph [ref=f53e124]: Agent failure modes and solutions
              - table [ref=f53e125]:
                - rowgroup [ref=f53e126]:
                  - row [ref=f53e127]:
                    - columnheader [ref=f53e128]:
                      - strong [ref=f53e129]: Problem
                    - columnheader [ref=f53e130]:
                      - strong [ref=f53e131]: Initializer Agent Behavior
                    - columnheader [ref=f53e132]:
