          - generic [ref=f33e26]:
            - heading "Build, Deploy, and Evaluate with Fullstack Code Arena" [level=1] [ref=f33e27]:
              - paragraph [ref=f33e29]: Build, Deploy, and Evaluate with
              - paragraph [ref=f33e31]: Fullstack Code Arena
            - paragraph [ref=f33e32]: Code Arena has evolved beyond frontend prototyping into a complete fullstack AI development platform. Explore capabilities like databases, authentication, third-party integrations, and deployments, and see how Fullstack Code Arena helps developers, entrepreneurs, and AI labs build, deploy, and evaluate production-ready applications.
        - generic [ref=f33e33]:
          - generic [ref=f33e36]:
            - paragraph [ref=f33e37]:
              - text: AI coding models are evolving faster than ever before. The question is no longer simply whether a model can write static code, but how well it can build real end-to-end applications. That’s why we’re evolving
              - link "Code Arena" [ref=f33e38] [cursor=pointer]:
                - /url: https://arena.ai/code?ref=arena.ai
              - text: to incorporate fullstack capabilities.
            - paragraph [ref=f33e39]:
              - text: When we first
              - link "launched Code Arena last year" [ref=f33e40] [cursor=pointer]:
                - /url: https://arena.ai/blog/code-arena/
              - text: ", our goal was to change how AI coding models were evaluated. Seeing the positive response and adoption from our community, we’re now doubling down with the addition of measuring fullstack development abilities of the AI models. Starting today, Code Arena evolves from solely a frontend prototyping tool to a complete, fullstack AI development platform. The following is a look at what this new era of Code Arena unlocks for developers and builders."
          - generic [ref=f33e42]:
            - 'heading "What’s Different: The Fullstack Leap" [level=3] [ref=f33e43]'
            - paragraph [ref=f33e46]: We initially introduced Code Arena to measure "coding in motion," as developers could watch models build frontend web apps step-by-step, then vote on their performance & benchmark in the Code Leaderboard. With today's launch, we are continuing to innovate, evolving our architecture to support true fullstack web development, complete with databases, API keys, and live deployments.
          - figure "Fig 1. Building an ecommerce store for sneakerheads in Fullstack Code Arena" [ref=f33e49]:
            - img "Fig 1. Building an ecommerce store for sneakerheads in Fullstack Code Arena" [ref=f33e50]
          - generic [ref=f33e54]:
            - paragraph [ref=f33e55]: "With Fullstack, we now support building more complex apps, including:"
            - list [ref=f33e56]:
              - listitem [ref=f33e57]: Apps that have a sign up or login flow, like a members-only ecommerce app where you need to login to browse and purchase
              - listitem [ref=f33e58]: The ability to connect to third party services via an API key, such as bringing in an OpenAI key to make API calls for an AI chatbot product.
              - listitem [ref=f33e59]: Apps that store a user’s progress for them to come back to, like an education or learning app where a user continually logs in over multiple days or weeks to pick up where they left off.
            - paragraph [ref=f33e60]: This changes Code Arena from more of an experimental prototyping environment to a daily-use tool where real work gets done.
            - paragraph:
              - strong
            - paragraph [ref=f33e61]:
              - strong [ref=f33e62]: "Key new features and benefits include:"
            - list [ref=f33e63]:
              - listitem [ref=f33e64]:
                - strong [ref=f33e65]: "Database Integration:"
                - text: Database layer allowing agents to generate code for PostgreSQL, user authentication, and Row Level Security.
              - listitem [ref=f33e66]:
                - strong [ref=f33e67]: "Third party access:"
                - text: The ability to safely connect to third party services and apps, such as calling an LLM, or connecting to a payments API to accept payments for an ecommerce app, for example.
              - listitem [ref=f33e68]:
                - strong [ref=f33e69]: "Persistent Dev Server & Visual Terminal:"
                - text: A live dev server running inside the sandbox with hot reloading.
              - listitem [ref=f33e70]:
                - strong [ref=f33e71]: "Bash and Web Search Tools:"
                - text: We’ve moved beyond reading and editing files — Agents are now equipped to run any bash command, as well as search the web for real-time information or documentation via search, vastly expanding what’s possible to build.
              - listitem [ref=f33e72]:
                - strong [ref=f33e73]: "Fast Deployments:"
                - text: A seamless build-to-ship pipeline that allows you to deploy your fullstack web apps directly to Vercel.
          - generic [ref=f33e75]:
            - heading "Empowering Builders To Do More" [level=3] [ref=f33e76]
            - generic [ref=f33e78]:
              - paragraph [ref=f33e79]: "By removing the limitations of the single-page frontend, Fullstack Code Arena is now a daily-use tool designed for three key audiences:"
              - paragraph [ref=f33e80]:
                - strong [ref=f33e81]:
                  - strong [ref=f33e82]: "1. For Entrepreneurs and Small Businesses:"
                - text: Code Arena removes the technical barriers that limit your potential. By providing full data persistence and user management, we enable you to transform ideas into complex, functional applications without hitting technical ceilings.
              - paragraph [ref=f33e83]:
                - strong [ref=f33e84]:
                  - strong [ref=f33e85]: "2. For Developers:"
                - text: Code Arena provides a production-grade environment built for real work. With persistent, long-running sandboxes, you can seamlessly build, iterate, and ship complete applications within a single, integrated workspace.
              - paragraph [ref=f33e86]:
                - strong [ref=f33e87]:
                  - strong [ref=f33e88]: "3. For AI Model Labs:"
                - text: Code Arena delivers the high-fidelity evaluations necessary to advance software-engineering AI. By testing models on complex backend tasks—such as database operations and multi-file generation—you gain the critical data required to train the next generation of intelligent systems.
              - paragraph [ref=f33e89]:
                - text: We’re excited to usher in this next stage of AI coding, which isn't just about just writing code—it's about building complete, real-world software.
                - strong [ref=f33e90]:
                  - strong [ref=f33e91]:
                    - text: Ready to build? Try out the new
                    - link "Fullstack Code Arena" [ref=f33e92] [cursor=pointer]:
                      - /url: https://arena.ai/code?ref=arena.ai
                    - text: today.
              - paragraph [ref=f33e93]:
                - text: Have additional questions? Visit our
                - link "help center" [ref=f33e94] [cursor=pointer]:
                  - /url: https://help.arena.ai/articles/5701270322-arena-how-to-code-arena?ref=arena.ai
                - text: for more.
