        - heading "Featured research" [level=2] [ref=f59e159]
        - paragraph [ref=f59e160]: METR researches, develops and runs cutting-edge tests of AI capabilities, including broad autonomous capabilities and the ability of AI systems to conduct AI R&D.
        - tabpanel [ref=f59e163]:
          - generic [ref=f59e164]:
            - img "Measuring the Self-Reported Impact of Early-2026 AI on Technical Worker Productivity" [ref=f59e166]
            - heading "Measuring the Self-Reported Impact of Early-2026 AI on Technical Worker Productivity" [level=3] [ref=f59e167]
            - paragraph [ref=f59e168]: A survey of 349 technical workers finds a median 1.4–2x self-reported change in value of work due to AI tools, expected to grow over time, though there are reasons to be skeptical of the magnitude.
            - link "Read more" [ref=f59e170] [cursor=pointer]:
              - /url: /blog/2026-05-11-ai-usage-survey/
          - generic [ref=f59e172]:
            - img "Early Work on Monitorability Evaluations" [ref=f59e174]
            - heading "Early Work on Monitorability Evaluations" [level=3] [ref=f59e175]
            - paragraph [ref=f59e176]: We show preliminary results on a prototype evaluation that tests monitors' ability to catch AI agents doing side tasks, and AI agents' ability to bypass this monitoring.
            - link "Read more" [ref=f59e178] [cursor=pointer]:
              - /url: /blog/2026-01-19-early-work-on-monitorability-evaluations/
          - generic [ref=f59e180]:
            - img "How Does Time Horizon Vary Across Domains?" [ref=f59e182]
            - heading "How Does Time Horizon Vary Across Domains?" [level=3] [ref=f59e183]
            - paragraph [ref=f59e184]: We build on our time-horizon work and analyze 9 benchmarks for scientific reasoning, math, robotics, computer use, and self-driving in terms of time-horizon trends; we observe generally similar rates of improvement to the 7-month doubling time in our original time-horizon work.
            - link "Read more" [ref=f59e186] [cursor=pointer]:
              - /url: /blog/2025-07-14-how-does-time-horizon-vary-across-domains/
