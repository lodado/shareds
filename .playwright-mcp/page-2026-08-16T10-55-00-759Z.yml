            - listitem [ref=f59e62]:
              - link "Wider adoption of AI has made it more difficult to measure task-level productivity" [ref=f59e63] [cursor=pointer]:
                - /url: "#wider-adoption-of-ai-has-made-it-more-difficult-to-measure-task-level-productivity"
            - listitem [ref=f59e64]:
              - link "Selected developer quotes" [ref=f59e65] [cursor=pointer]:
                - /url: "#selected-developer-quotes"
            - listitem [ref=f59e66]:
