        - generic [ref=f56e174]:
          - heading "Trace grading" [level=1] [ref=f56e176]
          - paragraph [ref=f56e177]: Grade model outputs with reproducible evaluations.
          - button "Copy Page" [ref=f56e181] [cursor=pointer]
        - article [ref=f56e186]:
          - paragraph [ref=f56e187]: Trace grading is the process of assigning structured scores or labels to an agent’s trace—the end-to-end log of decisions, tool calls, and reasoning steps—to assess correctness, quality, or adherence to expectations. These annotations help identify where the agent did well or made mistakes, enabling targeted improvements in orchestration or behavior.
          - paragraph [ref=f56e188]: Trace evals use those graded traces to systematically evaluate agent performance across many examples, helping to benchmark changes, identify regressions, or validate improvements. Unlike black-box evaluations, trace evals provide more data to better understand why an agent succeeds or fails.
          - paragraph [ref=f56e189]: Use both features to track, analyze, and optimize the performance of groups of agents.
          - heading "Get started with traces Copy link to get started with traces" [level=2] [ref=f56e190]:
            - generic [ref=f56e191]: Get started with traces
            - button "Copy link to get started with traces" [ref=f56e192] [cursor=pointer]
          - list [ref=f56e195]:
            - listitem [ref=f56e196]:
              - text: In the dashboard, navigate to Logs >
              - link "Traces" [ref=f56e197] [cursor=pointer]:
                - /url: https://platform.openai.com/logs?api=traces
              - text: .
            - listitem [ref=f56e198]:
              - text: Select a workflow. You’ll see traces from SDK-based apps, and from existing
              - link "Agent Builder" [ref=f56e199] [cursor=pointer]:
                - /url: /api/docs/guides/agent-builder
              - text: workflows during the transition window.
            - listitem [ref=f56e200]: Select a trace to inspect your workflow.
            - listitem [ref=f56e201]: Create a grader, and run it to grade your agents’ performance against grader criteria.
          - paragraph [ref=f56e202]:
            - text: Trace grading is a valuable tool for error identification at scale, which is critical for building resilience into your AI applications. Learn more about our recommended process in our
            - link "cookbook" [ref=f56e203] [cursor=pointer]:
              - /url: /cookbook/examples/evaluation/building_resilient_prompts_using_an_evaluation_flywheel
            - text: .
          - heading "Evaluate traces with runs Copy link to evaluate traces with runs" [level=2] [ref=f56e204]:
            - generic [ref=f56e205]: Evaluate traces with runs
            - button "Copy link to evaluate traces with runs" [ref=f56e206] [cursor=pointer]
          - list [ref=f56e209]:
            - listitem [ref=f56e210]:
              - text: Select
              - strong [ref=f56e211]: Grade all
              - text: . This takes you to the evaluation dashboard.
            - listitem [ref=f56e212]: In the evaluation dashboard, add and edit test criteria.
            - listitem [ref=f56e213]: Add a run to evaluate outputs. You can configure run options like model, date range, and tool calls to get more specificity in your eval.
          - paragraph [ref=f56e214]:
