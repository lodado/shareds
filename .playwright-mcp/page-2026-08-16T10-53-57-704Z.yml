          - generic [ref=f54e203]:
            - heading "Working with evals" [level=1] [ref=f54e205]
            - paragraph [ref=f54e206]: Test and improve model outputs through evaluations.
            - button "Copy Page" [ref=f54e210] [cursor=pointer]
        - article [ref=f54e215]:
          - paragraph [ref=f54e216]:
            - text: Evaluations (often called
            - strong [ref=f54e217]: evals
            - text: ) test model outputs to ensure they meet style and content criteria that you specify. Writing evals to understand how your LLM applications are performing against your expectations, especially when upgrading or trying new models, is an essential component to building reliable applications.
          - paragraph [ref=f54e218]:
            - text: In this guide, we will focus on
            - strong [ref=f54e219]:
              - text: configuring evals programmatically using the
              - link "Evals API" [ref=f54e220] [cursor=pointer]:
                - /url: /api/docs/api-reference/evals
            - text: . If you prefer, you can also configure evals
            - link "in the OpenAI dashboard" [ref=f54e221] [cursor=pointer]:
              - /url: https://platform.openai.com/evaluations
            - text: .
          - paragraph [ref=f54e231]:
            - text: OpenAI is deprecating the Evals platform. Existing evals content remains available during the transition window. Evals will become read-only for existing users on October 31, 2026, and the platform is scheduled to shut down on November 30, 2026. See the
            - link "deprecations page" [ref=f54e232] [cursor=pointer]:
              - /url: /api/docs/deprecations#2026-06-03-evals-platform
            - text: for the current timeline.
          - paragraph [ref=f54e242]:
            - text: If you’re new to evaluations, or want a more iterative environment to experiment in as you build your eval, consider trying
            - link "Datasets" [ref=f54e243] [cursor=pointer]:
              - /url: /api/docs/guides/evaluation-getting-started
            - text: instead.
          - paragraph [ref=f54e244]: Broadly, there are three steps to build and run evals for your LLM application.
          - list [ref=f54e245]:
            - listitem [ref=f54e246]: Describe the task to be done as an eval
            - listitem [ref=f54e247]: Run your eval with test inputs (a prompt and input data)
            - listitem [ref=f54e248]: Analyze the results, then iterate and improve on your prompt
          - paragraph [ref=f54e249]:
            - text: This process is somewhat similar to behavior-driven development (BDD), where you begin by specifying how the system should behave before implementing and testing the system. Let’s see how we would complete each of the steps above using the
            - link "Evals API" [ref=f54e250] [cursor=pointer]:
              - /url: /api/docs/api-reference/evals
            - text: .
          - heading "Create an eval for a task Copy link to create an eval for a task" [level=2] [ref=f54e251]:
            - generic [ref=f54e252]: Create an eval for a task
            - button "Copy link to create an eval for a task" [ref=f54e253] [cursor=pointer]
          - paragraph [ref=f54e256]:
            - text: "Creating an eval begins by describing a task to be done by a model. Let’s say that we would like to use a model to classify the contents of IT support tickets into one of three categories:"
            - code [ref=f54e257]: Hardware
            - text: ","
            - code [ref=f54e258]: Software
            - text: ", or"
            - code [ref=f54e259]: Other
            - text: .
          - paragraph [ref=f54e260]:
            - text: To implement this use case, you can use either the
            - link "Chat Completions API" [ref=f54e261] [cursor=pointer]:
              - /url: /api/docs/api-reference/chat
            - text: or the
            - link "Responses API" [ref=f54e262] [cursor=pointer]:
              - /url: /api/docs/api-reference/responses
            - text: . Both examples below combine a
            - link "developer message" [ref=f54e263] [cursor=pointer]:
              - /url: /api/docs/guides/text
            - text: with a user message containing the text of a support ticket.
          - generic [ref=f54e266]:
            - generic [ref=f54e267]:
              - generic [ref=f54e268]: Categorize IT support tickets
              - button "Python" [ref=f54e270] [cursor=pointer]
