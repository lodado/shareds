      - heading "Research Partners" [level=3] [ref=f62e85]
      - paragraph [ref=f62e86]: The 2025 DORA Report is presented by Google Cloud in collaboration with the following research partners.
      - heading "Premier Research Partner" [level=4] [ref=f62e87]
      - generic [ref=f62e89]:
        - link [ref=f62e90] [cursor=pointer]:
          - /url: https://itrevolution.com/
          - img "IT Revolution" [ref=f62e91]
        - paragraph [ref=f62e92]: IT Revolution empowers enterprise technology leaders with essential insights for succeeding in the digital age through books, papers, events, and more. We focus on leadership strategies and organizational practices that drive high performance in large, complex companies, helping them thrive in the rapidly evolving business landscape.
      - heading "Research Partners" [level=4] [ref=f62e93]
      - generic [ref=f62e94]:
        - generic [ref=f62e95]:
          - link [ref=f62e96] [cursor=pointer]:
            - /url: https://github.com/
            - img "GitHub" [ref=f62e97]
          - paragraph [ref=f62e98]: GitHub is the world’s leading AI-powered developer platform to build, scale, and deliver secure software. Over 150 million people, including more than 90% of the Fortune 100 companies, use GitHub to collaborate and experiment across 420+ million repositories.
        - generic [ref=f62e99]:
          - link [ref=f62e100] [cursor=pointer]:
            - /url: https://about.gitlab.com/
            - img "GitLab" [ref=f62e101]
          - paragraph [ref=f62e102]: GitLab is the most comprehensive, intelligent DevSecOps platform for software innovation. GitLab enables organizations to increase developer productivity, improve operational efficiency, reduce security and compliance risk, and accelerate digital transformation. More than 50 million registered users and more than 50% of the Fortune 100 trust GitLab to ship better, more secure software faster.
        - generic [ref=f62e103]:
          - link [ref=f62e104] [cursor=pointer]:
            - /url: https://skillbench.com/
            - img "SkillBench" [ref=f62e105]
          - paragraph [ref=f62e106]: SkillBench helps organizations implement generative AI to boost productivity and skills. Our AI-native platform decomposes focal work, certifies outputs with internal experts, predicts skill-based outcomes of AI use, and securely traces turn-by-turn developer-AI interactions for validation. This new telemetry unlocks strategic possibilities for organizations and their people.
        - generic [ref=f62e107]:
          - link [ref=f62e108] [cursor=pointer]:
            - /url: https://www.workhelix.com/
            - img "Workhelix" [ref=f62e109]
          - paragraph [ref=f62e110]: Workhelix helps large enterprises plan, co-create, measure, and accelerate AI transformation. We identify where generative AI drives the greatest ROI, co-create actionable rollout plans, and track adoption over time--turning investments into measurable gains. Founded by Stanford and MIT experts, we blend causal-inference analytics with change-management tools for every adoption phase.
