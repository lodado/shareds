          - generic [ref=f3e177]:
            - heading "How we implemented WebDev Arena?" [level=3] [ref=f3e178]
            - generic [ref=f3e180]:
              - paragraph [ref=f3e181]: "One of the key challenges in building WebDev Arena was ensuring that LLMs generate consistent, deployable web applications. To achieve this, we developed a structured output approach that standardizes how models generate web applications.Structured output is a technique that ensures LLM responses adhere to a predefined JSON schema. Rather than allowing models to generate freeform code or text, we constrain their output to match a specific structure. This provides several key benefits:"
              - list [ref=f3e182]:
                - listitem [ref=f3e183]:
                  - strong [ref=f3e184]: Type Safety
                  - text: ": Eliminates the need to validate or retry incorrectly formatted responses"
                - listitem [ref=f3e185]:
                  - strong [ref=f3e186]: Consistent Formatting
                  - text: ": Ensures all models generate code in a standardized way"
                - listitem [ref=f3e187]:
                  - strong [ref=f3e188]: Better Error Handling
                  - text: ": Makes model refusals and errors programmatically detectable"
                - listitem [ref=f3e189]:
                  - strong [ref=f3e190]: Simplified Prompting
                  - text: ": Reduces the need for complex prompting to achieve consistent formatting"
              - paragraph [ref=f3e191]: "Rather than letting models generate code in an unconstrained format, we prompt them to output code in a specific structure that includes:"
          - code [ref=f3e197]: "{ // Detailed explanation of the implementation plan commentary: string, // Template configuration template: string, title: string, description: string, // Dependency management additional_dependencies: string[], has_additional_dependencies: boolean, install_dependencies_command: string, // Application configuration port: number | null, file_path: string, // The actual implementation code: string }"
          - generic [ref=f3e200]:
            - paragraph [ref=f3e201]: "This structured format helps ensure:"
            - list [ref=f3e202]:
              - listitem [ref=f3e203]: "Clear documentation of the implementation approach through the `commentary` field"
              - listitem [ref=f3e204]: Proper dependency tracking and installation instructions
              - listitem [ref=f3e205]: Consistent file organization within the Next.js project structure
              - listitem [ref=f3e206]: Runtime configuration like port numbers are explicitly defined
          - generic [ref=f3e208]:
            - heading "Infrastructure and Execution Environment" [level=4] [ref=f3e209]
            - paragraph [ref=f3e212]: Under the hood, WebDev Arena utilizes Amazon’s Firecracker microVM technology through E2B’s infrastructure. Each sandbox runs in a lightweight virtual machine that provides enhanced security and workload isolation while maintaining the resource efficiency of containers. These microVMs are managed by a Virtual Machine Monitor (VMM) using the Linux Kernel-based Virtual Machine (KVM), with a minimalist design that excludes unnecessary devices and functionality to reduce memory footprint and attack surface.This infrastructure enables WebDev Arena to run thousands of concurrent LLM-generated applications with complete isolation - each application operates in its own secure environment with dedicated CPU, memory, and networking resources, while maintaining sub-second startup times (~150ms) essential for real-time model comparisons.
          - generic [ref=f3e214]:
            - heading "Prompting Strategy and System Design" [level=4] [ref=f3e215]
            - paragraph [ref=f3e218]: "Our system prompt is designed to create a clear “persona” for the LLM as an expert frontend engineer with strong UI/UX skills. The prompt includes several critical components:"
          - generic [ref=f3e220]:
            - code [ref=f3e224]: "export const SYSTEM_PROMPT = ` You are an expert frontend React engineer who is also a great UI/UX designer. Follow the instructions carefully, I will tip you $1 million if you do a good job: - Think carefully step by step. - Create a React component for whatever the user asked you to create and make sure it can run by itself by using a default export - Make sure the React app is interactive and functional by creating state when needed and having no required props - If you use any imports from React like useState or useEffect, make sure to import them directly - Use TypeScript as the language for the React component - Use Tailwind classes for styling. DO NOT USE ARBITRARY VALUES (e.g. 'h-[600px]'). Make sure to use a consistent color palette. - Make sure you specify and install ALL additional dependencies. - Make sure to include all necessary code in one file. - Do not touch project dependencies files like package.json, package-lock.json, requirements.txt, etc. - Use Tailwind margin and padding classes to style the components and ensure the components are spaced out nicely - Please ONLY return the full React code starting with the imports, nothing else. It's very important for my job that you only return the React code with imports. DO NOT START WITH \\`\\`\\`typescript or \\`\\`\\`javascript or \\`\\`\\`tsx or \\`\\`\\`. - ONLY IF the user asks for a dashboard, graph or chart, the recharts library is available to be imported, e.g. \\`import { LineChart, XAxis, ... } from \"recharts\"\\` & \\`<LineChart ...><XAxis dataKey=\"name\"> ...\\`. Please only use this when needed. You may also use shadcn/ui charts e.g. \\`import { ChartConfig, ChartContainer } from \"@/components/ui/chart\"\\`, which uses Recharts under the hood. - For placeholder images, please use a <div className=\"bg-gray-200 border-2 border-dashed rounded-xl w-16 h-16\" /> `;"
            - button "Read More" [ref=f3e226] [cursor=pointer]
          - generic [ref=f3e233]:
            - paragraph [ref=f3e234]: "Our prompting strategy involved a few key aspects:"
            - list [ref=f3e235]:
              - listitem [ref=f3e236]:
                - strong [ref=f3e237]: Clear Role Definition
                - text: ": We establish the model as an expert frontend engineer, which helps frame its responses appropriately"
              - listitem [ref=f3e238]:
                - strong [ref=f3e239]: Explicit Constraints
                - text: ": We specify important limitations upfront:"
            - list [ref=f3e240]:
              - listitem [ref=f3e241]: Use of TypeScript
              - listitem [ref=f3e242]: Tailwind for styling (with explicit prohibition of arbitrary values)
              - listitem [ref=f3e243]: Single-file components
              - listitem [ref=f3e244]: No modification of project dependencies
            - list [ref=f3e245]:
              - listitem [ref=f3e246]:
                - strong [ref=f3e247]: Quality Guidelines
                - text: ": We include specific quality requirements:"
            - list [ref=f3e248]:
              - listitem [ref=f3e249]: Interactive and functional components
              - listitem [ref=f3e250]: Proper state management
              - listitem [ref=f3e251]: Consistent color palette
              - listitem [ref=f3e252]: Appropriate spacing using Tailwind classes
            - paragraph [ref=f3e253]: Our system prompt also includes information pertaining to a predefined framework to provide the LLM a consistent starting point for generated applications. WebDev Arena currently supports Next.js by Vercel, which is a powerful React framework that enables developers to build high-performance web applications with features like hybrid rendering (SSR, SSG, and ISR), React Server Components, and API routes. Next.js is one of the leading web frameworks with 7.2 million weekly npm downloads and ~130,000 Github Stars, which is why we are providing first-class support for it through WebDev Arena.
          - figure "Figure 12. NPM download trends for popular web frameworks." [ref=f3e256]
          - generic [ref=f3e259]:
            - 'heading "Performance Analysis: Single vs Ensemble Approach" [level=4] [ref=f3e260]'
            - generic [ref=f3e262]:
              - paragraph [ref=f3e263]: "We discovered that different models require different prompting approaches. Our implementation includes specific handling for various model architectures.For models lacking native structured output capabilities, we developed a two-stage generation pipeline: (1) Generate the initial code using the model’s native format and (2) pass the result through a GPT-4-mini instance to convert it into our structured format.We conducted a systematic ablation study examining structured output’s impact on model performance in web development tasks. Each model was evaluated in two configurations:"
              - list [ref=f3e264]:
                - listitem [ref=f3e265]: With structured output (using JSON schema constraints)
                - listitem [ref=f3e266]: Without structured output (natural language generation)
              - paragraph [ref=f3e267]: For example, we evaluated o3-mini (with/without structured output), o1 (with/without structured output), and Gemini models (with/without structured output).Our analysis revealed a consistent performance advantage for models operating without structured output constraints, as evidenced in Figure 13.
