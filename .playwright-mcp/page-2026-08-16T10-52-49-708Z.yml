          - paragraph [ref=f3e49]:
            - text: LLMs have shown impressive coding abilities in various coding benchmarks, but how well can they actually build functional web applications? We introduce
            - link "WebDev Arena" [ref=f3e50] [cursor=pointer]:
              - /url: http://webdev.lmarena.ai/
            - text: ": a real-time AI coding competition where models go head-to-head in web development challenges.Inspired by"
            - link "LMArena" [ref=f3e51] [cursor=pointer]:
              - /url: http://lmarena.ai/
            - text: ", WebDev Arena allows users to test LLMs in a real-world coding task: building interactive web applications. Users submit a prompt, two LLMs generate web apps, and the community votes on which model performs better.Try out our"
            - link "colab" [ref=f3e52] [cursor=pointer]:
              - /url: https://colab.research.google.com/drive/1xq_-PGp8gJ8aHUyokrSqL_qZnn8s-UHV?usp=sharing
            - text: to explore the data and analysis behind WebDev Arena.
          - generic [ref=f3e54]:
            - heading "Why WebDev Arena?" [level=3] [ref=f3e55]
            - generic [ref=f3e57]:
              - paragraph [ref=f3e58]: "Traditional coding benchmarks like HumanEval focus on solving isolated function-based problems, but real-world coding demands more—including UI generation, handling package dependencies, and structuring complete applications.From an end-user’s perspective, the setup is simple:"
              - list [ref=f3e59]:
                - listitem [ref=f3e60]: Users submit a prompt (e.g., “Build a simple chess game”).
                - listitem [ref=f3e61]: Two LLMs generate competing web apps.
                - listitem [ref=f3e62]: Users interact with both apps and vote on the better one.
                - listitem [ref=f3e63]: Results contribute to a live leaderboard ranking LLMs by performance.
              - paragraph [ref=f3e64]: Examples“Create a Hacker News clone”
          - figure "Figure 1. Example of a Hacker News clone built by an LLM." [ref=f3e67]
          - paragraph [ref=f3e72]: “Build a basic chess game”
          - figure "Figure 2. Example of a chess game built by an LLM." [ref=f3e75]
          - generic [ref=f3e78]:
            - heading "WebDev Arena Leaderboard" [level=3] [ref=f3e79]
            - generic [ref=f3e81]:
              - paragraph [ref=f3e82]:
                - text: Since
                - link "our launch" [ref=f3e83] [cursor=pointer]:
                  - /url: https://x.com/aryanvichare10/status/1866561638712881172
                - text: in Dec 2024, we have collected over 80,000 community votes and provided a live ranking of LLMs based on their real-world coding performance.Similar to
                - link "Chatbot Arena" [ref=f3e84] [cursor=pointer]:
                  - /url: http://lmarena.ai/leaderboard
                - text: ", we use the Bradley-Terry (BT) model, which estimates model strengths from pairwise comparisons. In simple terms, the BT model uses win/loss data from pairwise matchups and calculates a score for each model, reflecting its likelihood of winning against others. This ranking system is similar to Elo, commonly used in chess, and competitive games, despite the difference being a player’s skill rating may evolve over time, while LLMs stay static.Key Takeaways"
              - list [ref=f3e85]:
                - listitem [ref=f3e86]: "Claude 3.7 Sonnet currently holds the #1 spot with a 76% average win rate"
                - listitem [ref=f3e87]: "Claude 3.5 Sonnet ranks #2"
                - listitem [ref=f3e88]: "Deepseek R1 ranks #3"
          - figure "Figure 3. Current WebDev Arena leaderboard showing model rankings." [ref=f3e91]
