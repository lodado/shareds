  - main [ref=f76e58]:
    - generic [ref=f76e59]:
      - heading "The power of good design" [level=1] [ref=f76e60]
      - generic: Dieter Rams’s ideology, engrained within Vitsœ
    - generic [ref=f76e62]:
      - generic [ref=f76e63]:
        - generic [ref=f76e64]:
          - heading "Good design at Vitsœ" [level=2] [ref=f76e66]
          - figure [ref=f76e68]:
            - img "620 Chair high back in red leather with off-white shell. 606 Universal Shelving System in the background." [ref=f76e69]
          - generic [ref=f76e70]:
            - paragraph [ref=f76e71]: "Here at Vitsœ we stand for the inordinate power of good design in everything we do: designing thoughtfully, responsibly and intelligently for our company, our furniture and the many people who share a profound interest in all of our tomorrows."
            - paragraph [ref=f76e72]: For over 65 years, Vitsœ has worked continuously with Dieter Rams. He still improves his designs to this day and is often cited by a new generation as a key influence on their work that is shaping the 21st century.
        - generic [ref=f76e74]:
          - paragraph [ref=f76e76]: “In 1957 I began to develop a storage system that formed the basis of the company Vitsœ, which was founded in 1959. Thus the ideology behind my design is engrained within the company.”
          - generic [ref=f76e77]: Dieter Rams
        - generic [ref=f76e79]:
          - heading "Ten principles for good design" [level=2] [ref=f76e81]
          - generic [ref=f76e82]:
            - paragraph [ref=f76e83]: "Back in the late 1970s, Dieter Rams was becoming increasingly concerned by the state of the world around him: “An impenetrable confusion of forms, colours and noises.”"
            - paragraph [ref=f76e84]: "Aware that he was a significant contributor to that world, he asked himself an important question: is my design good design?"
            - paragraph [ref=f76e85]: His answer is expressed in his ten principles for good design.
          - figure "Vitsœ’s designer, Dieter Rams. Photograph by Abisag Tüllmann" [ref=f76e86]:
            - img "Dieter Rams, Vitsœ's furniture designer. Photograph by Abisag Tüllmann" [ref=f76e87]
        - generic [ref=f76e89]:
          - generic [ref=f76e90]: "1"
          - generic [ref=f76e91]:
            - heading "Good design is innovative" [level=2] [ref=f76e92]
            - paragraph [ref=f76e93]: The possibilities for innovation are not, by any means, exhausted. Technological development is always offering new opportunities for innovative design. But innovative design always develops in tandem with innovative technology, and can never be an end in itself.
          - figure "TP 1 radio/phono combination, 1959, by Dieter Rams for Braun" [ref=f76e94]:
            - img "Braun TP 1 radio/phono designed by Dieter Rams" [ref=f76e95]
        - generic [ref=f76e97]:
          - generic [ref=f76e98]: "2"
          - generic [ref=f76e99]:
            - heading "Good design makes a product useful" [level=2] [ref=f76e100]
            - paragraph [ref=f76e101]: A product is bought to be used. It has to satisfy certain criteria, not only functional, but also psychological and aesthetic. Good design emphasizes the usefulness of a product whilst disregarding anything that could possibly detract from it.
          - figure "MPZ 21 multipress citrus juicer, 1972, by Dieter Rams and Jürgen Greubel for Braun" [ref=f76e102]:
            - img "Braun MPZ 21 multipress citrus juicer designed by Dieter Rams" [ref=f76e103]
        - generic [ref=f76e105]:
          - generic [ref=f76e106]: "3"
          - generic [ref=f76e107]:
            - heading "Good design is aesthetic" [level=2] [ref=f76e108]
            - paragraph [ref=f76e109]: The aesthetic quality of a product is integral to its usefulness because products we use every day affect our person and our well-being. But only well-executed objects can be beautiful.
          - figure "RT 20 tischsuper radio, 1961, by Dieter Rams for Braun" [ref=f76e110]:
            - img "Braun RT 20 tisch super radio, designed by Dieter Rams" [ref=f76e111]
        - generic [ref=f76e113]:
          - generic [ref=f76e114]: "4"
          - generic [ref=f76e115]:
            - heading "Good design makes a product understandable" [level=2] [ref=f76e116]
            - paragraph [ref=f76e117]: It clarifies the product’s structure. Better still, it can make the product talk. At best, it is self-explanatory.
          - figure "T 1000 world receiver, 1963, by Dieter Rams for Braun" [ref=f76e118]:
            - img "Braun T 1000 world receiver, designed by Dieter Rams" [ref=f76e119]
        - generic [ref=f76e121]:
          - generic [ref=f76e122]: "5"
          - generic [ref=f76e123]:
            - heading "Good design is unobtrusive" [level=2] [ref=f76e124]
            - paragraph [ref=f76e125]: Products fulfilling a purpose are like tools. They are neither decorative objects nor works of art. Their design should therefore be both neutral and restrained, to leave room for the user’s self-expression.
          - figure "Cylindric T 2 lighter, 1968, by Dieter Rams for Braun" [ref=f76e126]:
            - img "Braun Cylindric T 2 lighter, designed by Dieter Rams" [ref=f76e127]
        - generic [ref=f76e129]:
          - generic [ref=f76e130]: "6"
          - generic [ref=f76e131]:
            - heading "Good design is honest" [level=2] [ref=f76e132]
            - paragraph [ref=f76e133]: It does not make a product more innovative, powerful or valuable than it really is. It does not attempt to manipulate the consumer with promises that cannot be kept.
          - figure "L 450 flat loudspeaker, TG 60 reel-to-reel tape recorder and TS 45 control unit, 1962-64, by Dieter Rams for Braun" [ref=f76e134]:
            - img "Braun L 450 flat loudspeaker, designed by Dieter Rams" [ref=f76e135]
        - generic [ref=f76e137]:
          - generic [ref=f76e138]: "7"
          - generic [ref=f76e139]:
            - heading "Good design is long-lasting" [level=2] [ref=f76e140]
            - paragraph [ref=f76e141]: It avoids being fashionable and therefore never appears antiquated. Unlike fashionable design, it lasts many years – even in today’s throwaway society.
          - figure [ref=f76e142]:
            - img "620 Chair Programme. Hand made by Vitsœ" [ref=f76e143]
            - generic [ref=f76e144]:
              - link "620 Chair Program" [ref=f76e145] [cursor=pointer]:
                - /url: /us/620
              - text: ", 1962, by Dieter Rams for Vitsœ"
        - generic [ref=f76e146]:
          - generic [ref=f76e147]: "8"
          - generic [ref=f76e148]:
            - heading "Good design is thorough down to the last detail" [level=2] [ref=f76e149]
            - paragraph [ref=f76e150]: Nothing must be arbitrary or left to chance. Care and accuracy in the design process show respect towards the user.
          - figure "ET 66 calculator, 1987, by Dietrich Lubs for Braun" [ref=f76e151]:
            - img "Braun ET 66 calculatorv, designed by Dieter Rams" [ref=f76e152]
        - generic [ref=f76e154]:
          - generic [ref=f76e155]: "9"
          - generic [ref=f76e156]:
            - heading "Good design is environmentally-friendly" [level=2] [ref=f76e157]
            - paragraph [ref=f76e158]: Design makes an important contribution to the preservation of the environment. It conserves resources and minimizes physical and visual pollution throughout the lifecycle of the product.
          - figure [ref=f76e159]:
            - img "Modular shelving, 606 Universal Shelving System with drawer cabinets." [ref=f76e160]
            - generic [ref=f76e161]:
              - link "606 Universal Shelving System" [ref=f76e162] [cursor=pointer]:
                - /url: /us/606
              - text: ", 1960, by Dieter Rams for Vitsœ"
        - generic [ref=f76e163]:
          - generic [ref=f76e164]: "10"
          - generic [ref=f76e165]:
            - heading "Good design is as little design as possible" [level=2] [ref=f76e166]
            - paragraph [ref=f76e167]: Less, but better – because it concentrates on the essential aspects, and the products are not burdened with non-essentials.
            - paragraph [ref=f76e168]: Back to purity, back to simplicity.
          - figure "L 2 speaker, 1958, by Dieter Rams for Braun" [ref=f76e169]:
            - img "Braun L 2 speaker, designed by Dieter Rams" [ref=f76e170]
        - generic [ref=f76e174]:
