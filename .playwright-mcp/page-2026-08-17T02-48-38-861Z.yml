            - code [ref=f3e284]:
              - generic [ref=f3e285]: "// 🟢 Recommended: Convert it to a regular function so it can be called anywhere"
              - generic [ref=f3e286]: "function getSorted(items) {"
              - generic [ref=f3e287]: return items.slice().sort();
              - generic [ref=f3e288]: "}"
        - paragraph [ref=f3e289]: "As a regular function, it can safely be called inside conditional statements:"
