        - paragraph [ref=f3e242]:
          - text: If your function doesn't call any Hooks, avoid the
          - code [ref=f3e243]: use
          - text: prefix and write it as a regular function. This allows the function to be called anywhere, including in conditions. You should only use the
          - code [ref=f3e244]: use
          - text: prefix when the function calls at least one Hook inside it.
        - paragraph [ref=f3e245]:
          - text: Technically, React does not enforce this. In principle, you could make a Hook that doesn't call other Hooks, but this is often confusing and limiting. However, there may be rare cases where it is helpful, such as when you plan to add Hook calls in the future. In that case, naming it with the
          - code [ref=f3e246]: use
          - text: prefix makes sense so that components won't be able to call it conditionally once Hooks are added. If you don't plan to use Hooks inside it (now or later), don't make it a Hook.
        - heading [level=2] [ref=f3e247]:
          - link "Examples" [ref=f3e248] [cursor=pointer]:
            - /url: "#examples"
          - button "Copy Anchor Link" [ref=f3e249] [cursor=pointer]
        - heading [level=3] [ref=f3e253]:
          - link [ref=f3e254] [cursor=pointer]:
            - /url: "#using-the-use-prefix-without-calling-any-hooks"
            - text: Using the
            - code [ref=f3e255]: use
            - text: prefix without calling any Hooks
          - button "Copy Anchor Link" [ref=f3e256] [cursor=pointer]
        - paragraph [ref=f3e260]:
          - text: Functions with the
          - code [ref=f3e261]: use
          - text: prefix are treated as Hooks and must follow Hook rules (for example, they cannot be called conditionally). If a function doesn't call any Hooks, remove the
          - code [ref=f3e262]: use
          - text: prefix and make it a regular function.
        - figure [ref=f3e263]:
          - button "Copy Text" [ref=f3e265] [cursor=pointer]
          - region [ref=f3e269]:
            - code [ref=f3e271]:
              - generic [ref=f3e272]: "// 🔴 Problem: The function doesn't call any Hooks but uses the use prefix"
              - generic [ref=f3e273]: "function useSorted(items) {"
              - generic [ref=f3e274]: return items.slice().sort();
              - generic [ref=f3e275]: "}"
        - figure [ref=f3e276]:
