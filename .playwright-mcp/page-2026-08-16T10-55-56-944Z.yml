            - list [ref=f69e229]:
              - listitem [ref=f69e230]:
                - link "Qualitative Usability Testing" [ref=f69e231] [cursor=pointer]:
                  - /url: https://www.nngroup.com/articles/qual-usability-testing-study-guide/
