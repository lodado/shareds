                - text: (Article)
            - heading "Remote Usability Testing" [level=3] [ref=f69e276]
            - paragraph [ref=f69e277]:
              - text: "For detailed help planning, conducting, and analyzing remote user testing, check out our full-day seminar:"
              - link "Remote Usability Testing." [ref=f69e278] [cursor=pointer]:
                - /url: https://www.nngroup.com/courses/remote-studies/
