  - main [ref=f69e56]:
    - article [ref=f69e59]:
      - generic [ref=f69e60]:
        - heading "Usability (User) Testing 101" [level=1] [ref=f69e61]
        - generic [ref=f69e65]:
          - link "Kate Moran" [ref=f69e67] [cursor=pointer]:
            - /url: /articles/author/kate-moran/
          - paragraph [ref=f69e68]: December 1, 2019 · Last reviewed Jul. 15, 2026
        - link [ref=f69e70] [cursor=pointer]:
          - /url: "#"
          - paragraph [ref=f69e72]: Share
      - generic [ref=f69e73]:
        - generic [ref=f69e74]:
          - generic [ref=f69e75]: "Summary: UX researchers use this popular observational methodology to uncover problems and opportunities in designs."
          - generic [ref=f69e76]:
            - paragraph [ref=f69e77]:
              - link "Usability" [ref=f69e78] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/usability-101-introduction-to-usability/
              - text: testing (alternately called
              - strong [ref=f69e79]: user testing
              - text: ) is a popular UX-research methodology.
            - blockquote [ref=f69e80]:
              - paragraph [ref=f69e81]:
                - text: In a
                - strong [ref=f69e82]: usability-testing
                - text: session, a researcher (called a “facilitator” or a “moderator”) asks a participant to perform tasks, usually using one or more specific user interfaces. While the participant completes each task, the researcher observes the participant’s behavior and listens for feedback.
            - generic [ref=f69e84]:
              - heading "In This Article:" [level=2] [ref=f69e87]
              - list [ref=f69e88]:
                - listitem [ref=f69e89]:
                  - link "Why Usability Test?" [ref=f69e90] [cursor=pointer]:
                    - /url: "#toc-why-usability-test-1"
                - listitem [ref=f69e91]:
                  - link "Elements of Usability Testing" [ref=f69e92] [cursor=pointer]:
                    - /url: "#toc-elements-of-usability-testing-2"
                - listitem [ref=f69e93]:
                  - link "Types of Usability Testing" [ref=f69e94] [cursor=pointer]:
                    - /url: "#toc-types-of-usability-testing-3"
                - listitem [ref=f69e95]:
                  - link "Cost of Usability Testing" [ref=f69e96] [cursor=pointer]:
                    - /url: "#toc-cost-of-usability-testing-4"
                - listitem [ref=f69e97]:
                  - link "NN/g Resources for Usability Testing" [ref=f69e98] [cursor=pointer]:
                    - /url: "#toc-nng-resources-for-usability-testing-5"
            - heading "Why Usability Test?" [level=2] [ref=f69e99]
            - paragraph [ref=f69e100]: "The goals of usability testing vary by study, but they usually include:"
            - list [ref=f69e101]:
              - listitem [ref=f69e102]:
                - strong [ref=f69e103]: Identifying problems
                - text: in the design of the product or service
              - listitem [ref=f69e104]:
                - strong [ref=f69e105]: Uncovering opportunities
                - text: to improve
              - listitem [ref=f69e106]:
                - strong [ref=f69e107]: Learning about the target user’s
                - text: behavior and preferences
            - figure [ref=f69e109]:
              - emphasis [ref=f69e111]: Usability testing helps us to uncover problems, discover opportunities, and learn about users.
            - paragraph [ref=f69e112]:
              - text: Why do we need to do usability testing?
              - link "Won’t a good professional UX designer know" [ref=f69e113] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/the-myth-of-the-genius-designer/
              - text: how to design a great user interface? Even the best UX designers can’t design a perfect — or even good enough — user experience without
              - link [ref=f69e114] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/parallel-and-iterative-design/
                - strong [ref=f69e115]: iterative design
              - strong [ref=f69e116]: driven by observations of real users
              - text: and of their interactions with the design.
            - paragraph [ref=f69e117]:
              - text: There are many variables in designing a modern user interface and there are even more variables in the
              - link "human brain" [ref=f69e118] [cursor=pointer]:
                - /url: https://www.nngroup.com/courses/human-mind/
              - text: . The total number of combinations is huge.
              - strong [ref=f69e119]: The only way to get UX design right is to test it.
            - heading "Elements of Usability Testing" [level=2] [ref=f69e120]
            - paragraph [ref=f69e121]:
              - text: There are many different types of usability testing, but the core elements in most usability tests are
              - strong [ref=f69e122]: the facilitator, the tasks, and the participant
              - text: .
            - figure [ref=f69e124]:
              - emphasis [ref=f69e126]: A usability-testing session involves a participant and a facilitator who gives tasks to the participant and observes the participant’s behavior.
            - paragraph [ref=f69e127]: The facilitator administers tasks to the participant. As the participant performs these tasks, the facilitator observes the participant’s behavior and listens for feedback. The facilitator may also ask followup questions to elicit detail from the participant.
            - figure [ref=f69e129]:
              - emphasis [ref=f69e131]: In a usability test, the facilitator gives instructions and task scenarios to the participant. The participant provides behavioral and verbal feedback about the interface while he performs those tasks.
            - heading "Facilitator" [level=3] [ref=f69e132]
            - paragraph [ref=f69e133]:
              - text: The
              - strong [ref=f69e134]: facilitator
              - link "guides the participant" [ref=f69e135] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/usability-checklist/
              - text: through the test process. She gives instructions, answers the participant’s questions, and asks followup questions.
            - paragraph [ref=f69e136]:
              - text: The facilitator works to ensure that the test results in high-quality, valid data, without
              - link "accidentally influencing the participant’s behavior" [ref=f69e137] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/leading-questions/
              - text: . Achieving this balance is difficult and requires training.
            - paragraph [ref=f69e138]:
              - text: (In one form of remote usability testing, called
              - link "remote unmoderated testing" [ref=f69e139] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/unmoderated-usability-testing/
              - text: ", an application may perform some of the facilitator’s roles.)"
            - heading "Tasks" [level=3] [ref=f69e140]
            - paragraph [ref=f69e141]:
              - text: The
              - strong [ref=f69e142]: tasks
              - text: in a usability test are realistic activities that the participant might perform in real life. They can be very specific or very open-ended,
              - link "depending on the research questions" [ref=f69e143] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/ux-research-goals-to-scenarios/
              - text: and the type of usability testing.
            - paragraph [ref=f69e144]: "Examples of tasks from real usability studies:"
            - blockquote [ref=f69e145]:
              - paragraph [ref=f69e146]:
                - emphasis [ref=f69e147]: Your printer is showing “Error 5200”. How can you get rid of the error message?
              - paragraph [ref=f69e148]:
                - emphasis [ref=f69e149]: You're considering opening a new credit card with Wells Fargo. Please visit wellsfargo.com and decide which credit card you might want to open, if any.
              - paragraph [ref=f69e150]:
                - emphasis [ref=f69e151]: You’ve been told you need to speak to Tyler Smith from the Project Management department. Use the intranet to find out where they are located. Tell the researcher your answer.
            - paragraph [ref=f69e152]:
              - link "Task wording" [ref=f69e153] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/better-usability-tasks/
              - text: is very important in usability testing. Small errors in the phrasing of a task can cause the participant to misunderstand what they’re asked to do or can influence how participants perform the task (a psychological phenomenon called
              - link "priming" [ref=f69e154] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/priming/
              - text: ).
            - paragraph [ref=f69e155]: Task instructions can be delivered to the participant verbally (the facilitator might read them) or can be handed to a participant written on task sheets. We often ask participants to read the task instructions out loud. This helps ensure that the participant reads the instructions completely, and helps the researchers with their notetaking, because they always know which task the user is performing.
            - complementary [ref=f69e156]:
              - generic [ref=f69e157]:
                - heading "Stuck on the task writing step?" [level=3] [ref=f69e158]
                - paragraph [ref=f69e159]: Go from task-writing pro to task-writing expert using the tips and tricks used by real NN/G researchers in Task Writing for Usability Tests.
              - link "What You'll Learn" [ref=f69e161] [cursor=pointer]:
                - /url: https://www.nngroup.com/contents/self-paced-courses/task-writing-for-usability-tests/?promo_type=courses&promo_pos=inline
            - heading "Participant" [level=3] [ref=f69e162]
            - paragraph [ref=f69e163]:
              - text: The
              - strong [ref=f69e164]: participant
              - text: should be a
              - link "realistic user" [ref=f69e165] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/recruiting-test-participants-for-usability-studies/
              - text: of the product or service being studied. That might mean that the user is already using the product or service in real life. Alternatively, in some cases, the participant might just have a similar background to the target user group, or might have the same needs, even if he isn’t already a user of the product.
            - paragraph [ref=f69e166]:
              - text: Participants are often asked to
              - link [ref=f69e167] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/
                - strong [ref=f69e168]: think out loud
              - text: during usability testing (called the “think-aloud method”). The facilitator might ask the participants to narrate their actions and thoughts as they perform tasks. The goal of this approach is to understand participants’ behaviors, goals, thoughts, and motivations.
            - figure [ref=f69e170]:
              - emphasis [ref=f69e172]: In this usability-test session, the participant sits on the left, and the facilitator sits on the right. The participant uses a special testing laptop, which is running screen-recording software. The laptop has a webcam to capture the participant’s facial expressions and is connected to an external monitor for the facilitator. The facilitator listens to his feedback, administers tasks, and takes notes. The photo captures the moment after the participant’s task, when the facilitator is asking him followup questions.
            - heading "Types of Usability Testing" [level=2] [ref=f69e173]
            - heading "Qualitative vs. Quantitative" [level=3] [ref=f69e174]
            - paragraph [ref=f69e175]:
              - text: Usability testing can be either
              - link "qualitative or quantitative" [ref=f69e176] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/quant-vs-qual/
              - text: .
            - blockquote [ref=f69e177]:
              - paragraph [ref=f69e178]:
                - strong [ref=f69e179]: Qualitative usability testing
                - text: focuses on collecting insights, findings, and anecdotes about how people use the product or service. Qualitative usability testing is best for discovering problems in the user experience. This form of usability testing is more common than quantitative usability testing.
              - paragraph [ref=f69e180]:
                - strong [ref=f69e181]: Quantitative usability testing
                - text: focuses on collecting metrics that describe the user experience. Two of the metrics most commonly collected in quantitative usability testing are task success and time on task. Quantitative usability testing is best for collecting
                - link "benchmarks" [ref=f69e182] [cursor=pointer]:
                  - /url: https://www.nngroup.com/courses/measuring-ux/
                - text: .
            - paragraph [ref=f69e183]:
              - text: The number of participants needed for a usability test varies depending on the type of study. For a typical
              - strong [ref=f69e184]: qualitative usability study
              - text: of a single user group, we recommend
              - link [ref=f69e185] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/
                - strong [ref=f69e186]: using five participants
              - text: to uncover the majority of the most common problems in the product.
            - heading "Remote vs. In-Person Testing" [level=3] [ref=f69e187]
            - paragraph [ref=f69e188]:
              - text: "Remote usability tests are popular because they often require less time and money than in-person studies. There are two types of remote usability testing:"
              - link "moderated and unmoderated" [ref=f69e189] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/remote-usability-tests/
              - text: .
            - blockquote [ref=f69e190]:
              - paragraph [ref=f69e191]:
                - link [ref=f69e192] [cursor=pointer]:
                  - /url: https://www.nngroup.com/articles/moderated-remote-usability-test/
                  - strong [ref=f69e193]: Remote moderated
                - text: usability tests work very similarly to in-person studies. The facilitator still interacts with the participant and asks her to perform tasks. However, the facilitator and participant are in different physical locations. Usually, moderated tests can be performed using screen-sharing software like Skype or GoToMeeting.
              - paragraph [ref=f69e194]:
                - link [ref=f69e195] [cursor=pointer]:
                  - /url: https://www.nngroup.com/articles/unmoderated-usability-testing/
                  - strong [ref=f69e196]: Remote unmoderated
                - text: remote usability tests do not have the same facilitator–participant interaction as an in-person or moderated tests. The researcher uses a dedicated
                - link "online remote-testing tool" [ref=f69e197] [cursor=pointer]:
                  - /url: https://www.nngroup.com/articles/unmoderated-user-testing-tools/
                - text: to set up written tasks for the participant. Then, the participant completes those tasks alone on her own time. The testing tool delivers the task instructions and any followup questions. After the participant completes her test, the researcher receives a recording of the session, along with metrics like task success.
            - figure [ref=f69e199]:
              - emphasis [ref=f69e201]: In remote unmoderated usability testing, the flow of information changes because the facilitator does not interact with the participant in the same way as an in a moderated test. The testing platform takes on the role of the facilitator, administering tasks to the participant. The researcher designs the study and upload task instructions on the platform, and then reviews the data after it’s collected, usually by observing video recordings of the tasks.
            - heading "Cost of Usability Testing" [level=2] [ref=f69e202]
            - paragraph [ref=f69e203]:
              - text: Simple,
              - link "“discount” usability" [ref=f69e204] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/discount-usability-20-years/
              - text: "studies can be inexpensive, though you usually must pay a few hundred dollars as incentives to participants. The testing session can take place in a conference room, and the simplest study will take 3 days of your time (assuming that you have already learned how to do it, and you have access to participants):"
            - list [ref=f69e205]:
              - listitem [ref=f69e206]: "Day 1: Plan the study"
              - listitem [ref=f69e207]: "Day 2: Test the 5 users"
              - listitem [ref=f69e208]: "Day 3: Analyze the findings and convert them into redesign recommendations for the next iteration"
            - paragraph [ref=f69e209]:
              - text: On the other hand,
              - link "more-expensive research" [ref=f69e210] [cursor=pointer]:
                - /url: https://www.nngroup.com/articles/when-high-cost-usability-makes-sense/
              - text: is sometimes required, and the cost can run into several hundred thousand dollars for the most elaborate studies.
            - paragraph [ref=f69e211]: "Things that add cost include:"
            - list [ref=f69e212]:
              - listitem [ref=f69e213]:
                - link "Competitive testing" [ref=f69e214] [cursor=pointer]:
                  - /url: https://www.nngroup.com/articles/competitive-usability-evaluations/
                - text: of multiple designs
              - listitem [ref=f69e215]:
                - link "International testing" [ref=f69e216] [cursor=pointer]:
                  - /url: https://www.nngroup.com/articles/international-usability-testing/
                - text: in multiple countries
              - listitem [ref=f69e217]:
                - text: Testing with multiple user groups (or
                - link "personas" [ref=f69e218] [cursor=pointer]:
                  - /url: https://www.nngroup.com/courses/personas/
                - text: )
              - listitem [ref=f69e219]: Quantitative studies
              - listitem [ref=f69e220]:
                - text: Use of fancy equipment like
                - link "eyetrackers" [ref=f69e221] [cursor=pointer]:
                  - /url: https://www.nngroup.com/articles/eyetracking-setup/
              - listitem [ref=f69e222]:
                - text: Needing a true usability lab or focus group room to
                - link "allow others to observe" [ref=f69e223] [cursor=pointer]:
                  - /url: https://www.nngroup.com/articles/observer-guidelines/
              - listitem [ref=f69e224]:
                - text: Wanting a detailed
                - link "analysis and report" [ref=f69e225] [cursor=pointer]:
                  - /url: https://www.nngroup.com/articles/formal-vs-quick-usability-reports/
                - text: about the findings.
            - paragraph [ref=f69e226]:
              - text: The
              - link "return on investment" [ref=f69e227] [cursor=pointer]:
                - /url: https://www.nngroup.com/courses/measuring-ux/
              - text: (ROI) for advanced studies can still be high, though usually not as high as that for simple studies.
