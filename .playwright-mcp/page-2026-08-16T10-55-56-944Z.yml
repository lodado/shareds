            - paragraph [ref=f69e245]:
              - text: For hands-on training and help honing your facilitation skills, check out
              - link "our full-day course on usability testing" [ref=f69e246] [cursor=pointer]:
                - /url: https://www.nngroup.com/courses/usability-testing/
              - text: .
