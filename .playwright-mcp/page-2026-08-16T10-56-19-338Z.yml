- generic [active] [ref=f79e1]:
  - main [ref=f79e2]:
    - generic [ref=f79e4]:
      - heading "Chapter 1" [level=3] [ref=f79e5]
      - heading "Designing Systems" [level=1] [ref=f79e6]
      - paragraph [ref=f79e7]: Create design systems, not pages
    - generic [ref=f79e8]:
      - paragraph [ref=f79e9]:
        - text: A long, long time ago, there were these things called
        - emphasis [ref=f79e10]: books
        - text: . Remember them? These contraptions were heavy and bulky and made from the pulp of dead trees. Inside these books were things called
        - emphasis [ref=f79e11]: pages
        - text: . You turned them, and they cut your fingers.
      - paragraph [ref=f79e12]: Awful things. I’m so glad these book things with their razor-sharp pages aren’t around anymore.
      - paragraph [ref=f79e13]: Oh, wait…
      - heading [level=2] [ref=f79e14]:
        - link "#" [ref=f79e15] [cursor=pointer]:
          - /url: "#our-paginated-past"
        - text: Our paginated past
      - paragraph [ref=f79e16]: The page has been with us for a long time now. A few millennia, actually. The first books were thick slabs of clay created about 4,000 years ago, soon replaced by scrolls as the preferred way to consume the written word. And while reading technology has come a long way – from papyrus to parchment to paperback to pixels – the concept of the page holds strong to this day.
      - paragraph [ref=f79e17]:
        - text: The page metaphor has been baked into the lexicon of the web since the very beginning. Tim Berners-Lee invented the World Wide Web so that he, his colleagues at CERN, and other academics could easily share and link together their world of
        - emphasis [ref=f79e18]: documents
        - text: . This document-based, academic genesis of the web is why the concept of the page is so deeply ingrained in the vocabulary of the internet.
      - paragraph [ref=f79e19]: So what?
      - paragraph [ref=f79e20]: As we’ll discuss throughout this book, the way things are named very much impacts how they’re perceived and utilized. Thinking of the web as pages has real ramifications on how people interact with web experiences, and influences how we go about creating web interfaces.
      - paragraph [ref=f79e21]: From the beginning, the page metaphor provided users with a familiar language with which to navigate this brave new World Wide Web. Concepts like bookmarking and pagination helped new web users explore and eventually master an entirely new medium using conventions they were already comfortable with.
      - figure "Chrome browser displaying ‘This webpage is not available" [ref=f79e22]:
        - img "Chrome browser displaying ‘This webpage is not available" [ref=f79e23]
      - paragraph [ref=f79e25]: The page was – and continues to be – a very visible and helpful metaphor for the users of the web. It also has a profound influence on how web experiences are created.
      - paragraph [ref=f79e26]: In the early days of the web, companies looking to get online simply translated their printed materials onto their websites. But even though these brochure websites offered a very one-dimensional perspective of what the web could offer, viewing websites as digital representations of the printed page was easy for creators to wrap their heads around.
      - paragraph [ref=f79e27]:
        - text: But we’re now 25 years into this new medium, and this once necessary figure of speech has overstayed its welcome. Unfortunately, the
        - strong [ref=f79e28]: page metaphor continues to run deep with respect to how we scope and execute our web projects
        - text: ". Here are just a few examples I hear on a regular basis:"
      - paragraph [ref=f79e29]:
        - text: “We’re a startup looking to launch a five-
        - emphasis [ref=f79e30]: page
        - text: website this October…”
      - paragraph [ref=f79e31]:
        - text: “Brad, how long will the home
        - emphasis [ref=f79e32]: page
        - text: take to build?”
      - paragraph [ref=f79e33]:
        - text: “How are we ever going to redesign this university website that contains over 30,000
        - emphasis [ref=f79e34]: pages
        - text: "?!”"
      - paragraph [ref=f79e35]: All of the statements above make the fundamental mistake of assuming a page is a uniform, isolated, quantifiable thing. The reality is that the web is a fluid, interactive, interdependent medium. As soon as we come to terms with this fact, the notion of the page quickly erodes as a useful means to scope and create web experiences.
      - paragraph [ref=f79e36]: How long will a homepage take to build? Well, that sort of depends on what’s on it, right? Maybe the homepage simply consists of a tagline and a background image, which means it could be done by lunch. Or maybe it’s chock-full of carousels, dynamic forms, and third-party integrations. In that case, maybe the homepage will take several months to complete.
      - paragraph [ref=f79e37]: As for the 30,000-page university website, it might be tempting to declare, “Thousands of pages?! Wow, that sounds challenging!” But in reality, those 30,000 pages may consist of three content types and two overarching layouts.
      - paragraph [ref=f79e38]:
        - text: Ultimately, a project’s level of effort is much better determined by the functionality and
        - link "components" [ref=f79e39] [cursor=pointer]:
          - /url: http://bradfrost.com/blog/post/scope-components-not-pages/
        - text: contained within those pages, rather than on the quantity of pages themselves.
      - paragraph [ref=f79e40]: The page metaphor has served its purpose helping users familiarize themselves with the web, and provided creators with the necessary transitional language with which to create for a brand new medium. But to build thoughtful interfaces meant to be served to a multitude of connected devices, the time has come for us to evolve beyond the page.
      - heading [level=2] [ref=f79e41]:
        - link "#" [ref=f79e42] [cursor=pointer]:
          - /url: "#tearing-up-the-page"
        - text: Tearing up the page
      - paragraph [ref=f79e43]:
        - text: "Thankfully, the web community is hard at work establishing principles and practices to help us effectively talk about and create for the web. And there’s one concept that keeps popping up in every conversation about how to make successful web experiences:"
        - strong [ref=f79e44]: modularity
        - text: .
      - paragraph [ref=f79e45]: "Modularity predates the web by a long shot. The Industrial Revolution brought about interchangeable parts and Henry Ford’s assembly line forever transformed the automobile manufacturing process. The earliest cars and components were individually crafted, which led to many safety and maintainability nightmares. Ford broke the automobile down into its component parts and modularized the assembly process. The results spoke for themselves: more uniform, more reliable, safer cars rolled out of the factory, and in record time to boot."
      - paragraph [ref=f79e46]:
        - text: As the machine age became the computer age, computer scientists began practicing object-oriented programming and establishing important modular concepts like
        - emphasis [ref=f79e47]: separation of concerns
        - text: and the
        - emphasis [ref=f79e48]: single responsibility principle
        - text: . It is from this world that the World Wide Web was born, so it’s no surprise that
        - link "modular design" [ref=f79e49] [cursor=pointer]:
          - /url: http://www.w3.org/DesignIssues/Principles.html#Modular
        - text: quickly became a design principle for the architecture of the web.
      - paragraph [ref=f79e50]:
        - text: Slowly, but surely, these concepts found their way into web designers’ workflows. In the early 2000s we saw the introduction of libraries like
        - link "YUI" [ref=f79e51] [cursor=pointer]:
          - /url: http://yuilibrary.com/
        - text: and
        - link "jQuery UI" [ref=f79e52] [cursor=pointer]:
          - /url: http://jqueryui.com/
        - text: that provided developers with a toolkit of widgets and patterns to create more consistent user interfaces.
      - paragraph [ref=f79e53]: If modularity has been around for such a long time, why are we talking about it now?
      - paragraph [ref=f79e54]: The short answer is that modularity matters more than ever. Right now, our entire industry is drowning in a sea of devices, viewport sizes, and online environments. And things aren’t slowing down anytime soon.
      - blockquote [ref=f79e55]:
        - paragraph [ref=f79e56]:
          - text: Disruption will only accelerate. The quantity and diversity of connected devices — many of which we haven’t imagined yet — will explode, as will the quantity and diversity of the people around the world who use them. Our existing standards, workflows, and infrastructure won’t hold up. Today’s onslaught of devices is already pushing them to the breaking point. They can’t withstand what’s ahead.
          - generic [ref=f79e57]:
            - text: –
            - link "The Future-Friendly manifesto" [ref=f79e58] [cursor=pointer]:
              - /url: http://futurefriendlyweb.com/
      - figure "These are just some of the connected devices we need to worry about." [ref=f79e59]:
        - img "These are just some of the connected devices we need to worry about." [ref=f79e60]
      - paragraph [ref=f79e62]: Like it or not, this multi-device universe is our reality. It was hard enough to get our web pages to display consistently in a handful of desktop browsers, but we’re now tasked with ensuring our web experiences look and function beautifully on a dizzying array of smartphones, tablets, phablets, netbooks, notebooks, desktops, TVs, game consoles, and more.
      - paragraph [ref=f79e63]: To address this reality while maintaining our sanity, it’s absolutely necessary for us to take a step back and break these giant responsibilities into smaller, more manageable chunks.
      - paragraph [ref=f79e64]: And that’s exactly what folks are doing. The spirit of modularity is weaving its way into every aspect of the web creation process and having profound effects on organizations’ strategy, process, content, design, and development.
      - heading [level=3] [ref=f79e65]:
        - link "#" [ref=f79e66] [cursor=pointer]:
          - /url: "#a-manageable-strategy"
        - text: A manageable strategy
      - paragraph [ref=f79e67]: Every organization is finally realizing that bulldozing their entire website and replacing it with a New-And-Shiny™ website every three to eight years isn’t (and never was) an optimal solution.
      - paragraph [ref=f79e68]: Out with the old! In with the new! It’s certainly an attractive prospect. But even before the launch party confetti is swept up, the calls start coming in. “You moved my cheese!” cry the users, who spent years learning the previous interface and functionality.
      - paragraph [ref=f79e69]:
        - text: When massive redesigns launch with significant changes to the experience, users get knocked down what Jared Spool calls the
        - link "“Magic Escalator of Acquired Knowledge”" [ref=f79e70] [cursor=pointer]:
          - /url: http://www.uie.com/articles/magic_escalator/
        - text: . Huge redesigns are a jolt to the system, and newly frustrated users have to spend a great deal of time and energy relearning the experience in order to slowly climb back up that escalator of acquired knowledge.
      - paragraph [ref=f79e71]: In addition to disorienting users, these monolithic redesigns don’t get to the organizational root of the problem. Without a fundamental change in process, history is bound to repeat itself, and what’s New-And-Shiny™ today becomes Old-And-Crusty™ tomorrow. The cycle repeats itself as companies push off minor updates until the next big redesign, ultimately paralyzing themselves and frustrating users in the process.
      - paragraph [ref=f79e72]:
        - text: Thankfully, even massive organizations are taking cues from the smaller, leaner startup world and striving to get things out the door quicker. By creating
        - emphasis [ref=f79e73]: minimum viable products
        - text: and shipping often to iteratively improve the experience, organizations are able to better address user feedback and keep up with the ever-shifting web landscape.
      - paragraph [ref=f79e74]: Moving away from Ron Popeil-esque, set-it-and-forget-it redesigns requires deliberate changes in organizational structure and workflow. Which is a heck of a lot easier said than done.
      - heading [level=3] [ref=f79e75]:
        - link "#" [ref=f79e76] [cursor=pointer]:
          - /url: "#an-iterative-process"
        - text: An iterative process
      - paragraph [ref=f79e77]: If I had a quarter for every time I heard some stakeholder declare “We’re trying to be more agile,” I’d be orbiting the earth in my private spacecraft instead of writing this book.
      - paragraph [ref=f79e78]:
        - text: Wanting to be more agile is commendable. But
        - emphasis [ref=f79e79]: agile
        - text: is a loaded term, with big differences between capital-A Agile and lowercase-a agile. Capital-A Agile is a specific methodology for software development, equipped with a
        - link "manifesto" [ref=f79e80] [cursor=pointer]:
          - /url: http://www.agilemanifesto.org/
        - text: and accompanying frameworks like
        - link "Scrum" [ref=f79e81] [cursor=pointer]:
          - /url: http://en.wikipedia.org/wiki/Scrum_%28software_development%29
        - text: and
        - link "Lean" [ref=f79e82] [cursor=pointer]:
          - /url: http://en.wikipedia.org/wiki/Lean_software_development
        - text: .
      - paragraph [ref=f79e83]:
        - text: Lowercase-a agile is more of an informal desire to create an efficient process. This desire may certainly involve adopting general
        - link "principles" [ref=f79e84] [cursor=pointer]:
          - /url: http://www.agilemanifesto.org/principles.html
        - text: "from capital-A Agile, but it may not involve adopting the Agile process in its entirety. Project manager Brett Harned explains:"
      - blockquote [ref=f79e85]:
        - paragraph [ref=f79e86]:
          - text: We want to be more agile; we’re embracing change, continuing improvement, being as flexible as possible, and adapting as we see fit. The thing is, we won’t ever truly be Agile, as the Manifesto states. That’s okay, as long as we say what we will be.
          - generic [ref=f79e87]:
            - text: –
            - link "Brett Harned" [ref=f79e88] [cursor=pointer]:
              - /url: http://cognition.happycog.com/article/diy-process
      - paragraph [ref=f79e89]: Organizational structure, client relations, personalities, and so on all play major roles in determining a project’s process. The trick is to find the process that works best for you, your organizational constraints and opportunities.
      - paragraph [ref=f79e90]: Even though it may be impossible to adopt a truly Agile process, it’s still a sound idea to work in cross-disciplinary teams, get into the final environment faster, ship early and often, and break bigger tasks into smaller components. In chapter 4, we’ll detail how to establish an effective pattern-based workflow.
      - heading [level=3] [ref=f79e91]:
        - link "#" [ref=f79e92] [cursor=pointer]:
          - /url: "#modularizing-content-im-on-team-chunk"
        - text: "Modularizing content: I’m on Team Chunk"
      - blockquote [ref=f79e93]:
        - paragraph [ref=f79e94]:
          - text: Get your content ready to go anywhere, because it’s going to go everywhere.
          - generic [ref=f79e95]:
            - text: –
            - link "For A Future-Friendly Web" [ref=f79e96] [cursor=pointer]:
              - /url: http://bradfrost.com/blog/web/for-a-future-friendly-web/
      - paragraph [ref=f79e97]: Publishing content for the Web used to be a fairly straightforward endeavor, as the desktop web was the only game in town. Oh, how things have changed. Today, our content is consumed by a whole slew of smartphones, dumb phones, netbooks, notebooks, tablets, e-readers, smartwatches, TVs, game consoles, digital signage, car dashboards, and more.
      - paragraph [ref=f79e98]: To properly address this increasingly diverse and eclectic digital landscape, we need to dramatically overhaul our perception of content and the tools we use to manage it.
      - blockquote [ref=f79e99]:
        - paragraph [ref=f79e100]:
          - text: In the future, what I believe is that we are going to have better content management and content publishing tools. We are going to have ways to take well-structured content, well-designed chunks of content that we can then figure out how we want to restructure and publish and display in a way that’s going to be right for the appropriate platform.
          - generic [ref=f79e101]:
            - text: –
            - link "Karen McGrane" [ref=f79e102] [cursor=pointer]:
              - /url: http://karenmcgrane.com/2012/09/04/adapting-ourselves-to-adaptive-content-video-slides-and-transcript-oh-my/
      - paragraph [ref=f79e103]:
        - text: Thankfully, this future is starting to take shape. Organizations are recognizing the need to create modularized content to better reach their audience wherever they may be. And content management systems are evolving beyond their web publishing platform roots into tools that can elegantly create and maintain modular content. While sophisticated content management systems have existed for years in the form of custom solutions like
        - link "NPR’s COPE (Create Once, Publish Everywhere) platform" [ref=f79e104] [cursor=pointer]:
          - /url: http://www.programmableweb.com/news/cope-create-once-publish-everywhere/2009/10/13
        - text: ", smart modular thinking is making its way into mainstream content management systems."
      - heading [level=3] [ref=f79e105]:
        - link "#" [ref=f79e106] [cursor=pointer]:
          - /url: "#classy-code"
        - text: Classy code
      - paragraph [ref=f79e107]: Modularity has long been a staple principle in the world of computer science, as we discussed earlier. While this principle existed long before the web was invented, it has taken some time for modularity to become engrained in the minds and hearts of web developers.
      - paragraph [ref=f79e108]:
        - text: Despite being around since 1995, JavaScript, the programming language of the web, first had to endure some growing pains to mature into the capable, respected language it is today. Now that JavaScript has grown up, developers can apply those tried-and-true computer science principles to their web development workflows. As a result, we’re seeing folks develop sophisticated
        - link "JavaScript patterns" [ref=f79e109] [cursor=pointer]:
          - /url: http://addyosmani.com/resources/essentialjsdesignpatterns/book/
        - text: and architectures.
      - paragraph [ref=f79e110]:
        - text: Applying modular programming principles to JavaScript is a bit of a no-brainer, since JavaScript is itself a programming language. But object-oriented thinking is weaving its way into other aspects of the web as well, including CSS, the styling language of the web. Methodologies like
        - link "OOCSS" [ref=f79e111] [cursor=pointer]:
          - /url: http://oocss.org/
        - text: ","
        - link "SMACSS" [ref=f79e112] [cursor=pointer]:
          - /url: https://smacss.com/
        - text: ", and"
        - link "BEM" [ref=f79e113] [cursor=pointer]:
          - /url: http://csswizardry.com/2013/01/mindbemding-getting-your-head-round-bem-syntax
        - text: have cropped up to help web designers create and maintain modular CSS architectures.
      - heading [level=3] [ref=f79e114]:
        - link "#" [ref=f79e115] [cursor=pointer]:
          - /url: "#visually-repaired"
        - text: Visually repaired
      - paragraph [ref=f79e116]: Not only is modularity infiltrating the code side of style on the web, it’s revolutionizing how visual designers approach modern web design.
      - paragraph [ref=f79e117]: As the number of viewports and environments proliferate, it’s become untenable to produce static mockups of every page of a web experience. As Stephen Hay quipped, presenting fully baked Photoshop comps “is the most effective way to show your clients what their website will never look like.”
      - paragraph [ref=f79e118]: "That’s not to say static design tools like Photoshop and Sketch aren’t important. Far from it. But it’s the way we use these tools that has changed dramatically. While creating hundreds of full-on comps isn’t realistic, these static tools excel at providing a playground to establish what Andy Clarke calls “design atmosphere”:"
      - blockquote [ref=f79e119]:
        - paragraph [ref=f79e120]:
          - text: Atmosphere describes the feelings we get that are evoked by colour, texture and typography. You might already think of atmosphere in different terms. You might call it “feel”, “mood” or even “visual identity.” Whatever words you choose, the atmosphere of a design doesn’t depend on layout. It’s independent of arrangement and visual placement. It will be seen, or felt, at every screen size and on every device.
          - generic [ref=f79e121]:
            - text: –
            - link "Andy Clarke" [ref=f79e122] [cursor=pointer]:
              - /url: http://stuffandnonsense.co.uk/blog/about/an-extract-from-designing-atoms-and-elements
      - paragraph [ref=f79e123]:
        - text: Establishing design atmosphere early is critical to a project’s success, which is why designers have found ways to facilitate these important conversations without having to generate full mockups. Designer Samantha Warren developed design artifacts called
        - link "style tiles" [ref=f79e124] [cursor=pointer]:
          - /url: http://styletil.es/
        - text: ", which demonstrate color, type, and texture explorations in a nice encapsulated one-pager. Designer Dan Mall built on Samantha’s idea with a concept called"
        - link "element collages" [ref=f79e125] [cursor=pointer]:
          - /url: http://danielmall.com/articles/rif-element-collages/
        - text: ", which demonstrate design atmosphere explorations in an exploded collage of interface elements."
      - figure "Style tiles, a concept created by designer Samantha Warren, allow designers to explore color, typography, and texture without having to develop fully realized comps." [ref=f79e126]:
        - img "Style tiles, a concept created by designer Samantha Warren, allow designers to explore color, typography, and texture without having to develop fully realized comps." [ref=f79e127]
      - paragraph [ref=f79e129]: By breaking visual explorations into smaller chunks, designers save time and effort while avoiding presenting unrealistic, premature layouts to clients. More importantly, these approaches shift stakeholders away from simply reacting to a pretty picture, and instead facilitate crucial conversations about overall design direction and how they relate to the project’s goals. We’ll discuss these concepts in more detail in chapter 4, but suffice it to say the visual design workflow is changing in a big way!
      - heading [level=3] [ref=f79e130]:
        - link "#" [ref=f79e131] [cursor=pointer]:
          - /url: "#systematic-ui-design"
        - text: Systematic UI design
      - blockquote [ref=f79e132]:
        - paragraph [ref=f79e133]:
          - text: We’re not designing pages, we’re designing systems of components.
          - generic [ref=f79e134]:
            - text: –
            - link "Stephen Hay" [ref=f79e135] [cursor=pointer]:
              - /url: http://bradfrost.com/blog/mobile/bdconf-stephen-hay-presents-responsive-design-workflow/
      - paragraph [ref=f79e136]: What is an interface made of? What are our Lego bricks? What are our Subway sandwich pieces that we combine into millions of delicious combinations? It’s these questions that we’ve been asking ourselves more and more now that we’re sending our interfaces to more and more places.
      - paragraph [ref=f79e137]:
        - text: A few years ago Ethan Marcotte introduced us to the idea of
        - link "responsive web design" [ref=f79e138] [cursor=pointer]:
          - /url: http://alistapart.com/article/responsive-web-design
        - text: "and its three core tenets: fluid grids, flexible media, and CSS media queries. These three ingredients provided a much-needed foundation for designers to create flexible layouts that smartly adapt to any screen size. Perhaps more importantly, responsive design helped get designers excited about creating thoughtful, adaptable, multi-device web experiences."
      - paragraph [ref=f79e139]: As designers quickly discovered, creating multi-device web experiences involves a lot more than creating squishy pages. Each individual piece of an interface contains its own unique challenges and opportunities in order for it to look and function beautifully across many screen sizes and environments.
      - paragraph [ref=f79e140]:
        - text: How can we present primary navigation – typically displayed as a horizontal list on large screens – in a thoughtful way on smaller screens? How do lightboxes, breadcrumbs, and carousels translate to smaller viewports and alternate input types? It’s these questions that led me to create
        - link "This Is Responsive" [ref=f79e141] [cursor=pointer]:
          - /url: http://bradfrost.github.io/this-is-responsive/index.html
        - text: ", a showcase of responsive patterns that demonstrate the various ways a particular component could be executed in a responsive environment."
      - paragraph [ref=f79e142]: While This Is Responsive is successful at articulating how these interface patterns can scale across screen sizes and environments, it’s still up to designers and developers to put these patterns into action. And as it turns out, that’s a lot of work.
      - heading [level=2] [ref=f79e143]:
        - link "#" [ref=f79e144] [cursor=pointer]:
          - /url: "#ui-frameworks-in-theory-and-in-practice"
        - text: UI frameworks, in theory and in practice
      - paragraph [ref=f79e145]: Designers and developers are already strapped for time and resources, and they’re now being tasked with making interfaces that look and function beautifully in any environment. That’s a very tall order.
      - paragraph [ref=f79e146]:
        - text: This need to address growing device diversity while still sanely getting projects out the door has given rise to front-end frameworks like
        - link "Foundation by Zurb" [ref=f79e147] [cursor=pointer]:
          - /url: http://foundation.zurb.com/
        - text: and
        - link "Bootstrap" [ref=f79e148] [cursor=pointer]:
          - /url: http://getbootstrap.com/
        - text: . These user interface frameworks provide designers with a collection of preassembled HTML patterns, CSS styles, and JavaScript to add functionality to interactive components like dropdowns and carousels. In essence, these frameworks are handy tool kits for quickly assembling interfaces.
      - figure "Bootstrap provides a collection of UI components to speed up development." [ref=f79e149]:
        - img "Bootstrap provides a collection of UI components to speed up development." [ref=f79e150]
      - paragraph [ref=f79e152]:
        - text: And boy are these things popular. As I’m writing this, Bootstrap is the most popular repository on the code-sharing site
        - link "GitHub" [ref=f79e153] [cursor=pointer]:
          - /url: https://github.com/
        - text: ", with over 77,000 stars and 30,000 forks. These frameworks’ popularity is a testament to the fact that designers and developers are seeking solid ground to stand on in this ever-complex web landscape."
      - paragraph [ref=f79e154]:
        - text: One of the most attractive aspects of these frameworks is
        - emphasis [ref=f79e155]: speed
        - text: . Frameworks like Bootstrap allow designers to get ideas off the ground quickly, rapidly create prototypes, and launch sites sooner. Because the patterns provided by a tool kit are already cross-browser tested, developers can spend their time on more important tasks rather than beating their heads against a table testing some archaic version of Internet Explorer. And in case designers do get stuck, these frameworks’ communities can provide helpful support and advice.
      - paragraph [ref=f79e156]: For freelancers, this increase in speed might mean they can take on an extra project or three, yielding more financial stability for the year. And in the startup world – a place where Bootstrap is omnipresent – minimum viable products can launch sooner, leading to faster answers regarding the products’ viability.
      - paragraph [ref=f79e157]: So frameworks like Bootstrap are insanely popular design systems that provide well-tested components, resulting in consistent designs and faster launches. What’s not to love? Well, like most everything in life, there are cons right there alongside the pros.
      - heading [level=3] [ref=f79e158]:
        - link "#" [ref=f79e159] [cursor=pointer]:
          - /url: "#trouble-in-framework-paradise"
        - text: Trouble in framework paradise
      - paragraph [ref=f79e160]:
        - text: "When I was a kid, I’d watch sci-fi movies and TV shows with a strange fascination. There was one question I could never quite shake:"
        - emphasis [ref=f79e161]: why are they all dressed the same
        - text: "?"
      - figure "In the future, everyone dresses the same. Illustration by Melissa Frost" [ref=f79e162]:
        - img "In the future, everyone dresses the same. Illustration by Melissa Frost" [ref=f79e163]
      - paragraph [ref=f79e165]:
        - text: I could only guess that given enough time, we
        - emphasis [ref=f79e166]: solve fashion
        - text: . “Say, these jumpsuits are pretty snazzy, and comfortable too! Let’s just all wear these from now on.” “Sounds good to me!”
      - paragraph [ref=f79e167]: Of course, that’s not how human beings work. We all have different tastes, goals, and desires. Variety, as they say, is the spice of life, and fashion, music, and design reflect our diverse nature. Yet on the web we tend to fall into the trap of wanting everyone to do things the same way. “Why don’t all browsers just standardize on WebKit?” “Why can’t device manufacturers just use the same screen sizes?” “Always use jQuery!” “Never use jQuery!” “Just use frameworks!” “Never use frameworks!”
      - paragraph [ref=f79e168]: Just like the real world, the diverse needs, goals, and desires of web projects lead to a myriad of different solutions. Of course, there’s a time and place for everything, and designers and developers need the discernment to know which tools to use and when.
      - paragraph [ref=f79e169]: Front-end frameworks are tools that provide a specific solution and a particular look and feel. While those solutions help speed up development, the resulting experiences end up resembling those sci-fi jumpsuits. When everyone uses the same buttons, grids, dropdowns, and components, things naturally start to look the same. If Nike, Adidas, Puma, and Reebok were to redesign their respective sites using Bootstrap, they would look substantially similar. That’s certainly not what these brands are going for. Sure, each brand can modify and extend the default look and feel, but after a while customization means fighting the framework’s given structure, style, and functionality.
      - paragraph [ref=f79e170]: In addition to look-alike issues, these frameworks can add unnecessary bloat to an experience. It’s fantastic that frameworks provide plenty of prebuilt components and functionality, but a large percentage of designers and developers won’t adopt every aspect of the framework. Unfortunately, users still have to download the framework’s unused CSS and JavaScript, resulting in slower page loads and frustration.
      - paragraph [ref=f79e171]:
        - text: On the flip side of that coin, frameworks might not go far enough, leading to developers needing to create a substantial amount of custom code to achieve their projects’ goals. At some point, a threshold is crossed where the initial benefits of using a framework–namely development
        - emphasis [ref=f79e172]: speed
        - text: –are outweighed by the time spent modifying, extending, and fixing the framework.
      - paragraph [ref=f79e173]: And then there’s the issue with naming. Using a framework means subscribing to someone else’s structure, naming, and style conventions. Of course, it’s important to establish a useful front-end lexicon, but what makes sense for an organization might not be what comes out of a framework’s box. I, for one, would balk at the idea of using Bootstrap’s default component for a featured content area they call a “jumbotron”. How a framework’s naming conventions jive with an existing codebase and workflow should be properly discussed before jumping on board the framework train.
      - paragraph [ref=f79e174]: Now that we’ve put frameworks through the wringer, it’s important to take a step back and recognize that conceptually these frameworks are very much on point. It’s an excellent idea to work with a design tool kit that promotes consistency and speeds up development time. While discussing the redesign of Microsoft’s homepage by Austin-based web shop Paravel, developer Dave Rupert stressed the importance of creating and delivering a design system to their client. Dave wonderfully articulated that it’s not necessarily about using Bootstrap for every client, but rather creating “tiny Bootstraps for every client.”
      - blockquote [ref=f79e175]:
        - paragraph [ref=f79e176]:
          - text: Responsive deliverables should look a lot like fully-functioning Twitter Bootstrap-style systems custom tailored for your clients’ needs. These living code samples are self-documenting style guides that extend to accommodate a client’s needs as well as the needs of the ever-evolving multi-device web.
          - generic [ref=f79e177]:
            - text: –
            - link "Dave Rupert" [ref=f79e178] [cursor=pointer]:
              - /url: http://daverupert.com/2013/04/responsive-deliverables/
      - paragraph [ref=f79e179]:
        - text: It’s not just about using a design system, it’s about creating
        - emphasis [ref=f79e180]: your
        - text: system.
      - heading [level=2] [ref=f79e181]:
        - link "#" [ref=f79e182] [cursor=pointer]:
          - /url: "#design-systems-save-the-day"
        - text: Design systems save the day
      - paragraph [ref=f79e183]: So what do robust design systems look like? What form do they take? How do you create, maintain, and enforce them?
      - paragraph [ref=f79e184]:
        - text: The cornerstones of good design systems are
        - emphasis [ref=f79e185]: style guides
        - text: ", which document and organize design materials while providing guidelines, usage, and guardrails."
      - paragraph [ref=f79e186]:
        - text: As it happens, there are
        - link "many flavors of style guides" [ref=f79e187] [cursor=pointer]:
          - /url: http://bradfrost.com/blog/post/style-guides/
        - text: ", including documentation for brand identity, writing, voice and tone, code, design language, and user interface patterns. This book won’t detail every category of style guide, but it’s important to take a look at each to better understand how each style guide influences the others, and how style guides for the web fit into a larger ecosystem."
      - heading [level=3] [ref=f79e188]:
        - link "#" [ref=f79e189] [cursor=pointer]:
          - /url: "#brand-identity"
        - text: Brand identity
      - paragraph [ref=f79e190]: Brand identity guidelines define the assets and materials that make a company unique. Logos, typography, color palettes, messaging (such as mission statements and taglines), collateral (such as business card and PowerPoint templates), and more are aggregated and described in brand identity guidelines.
      - figure "West Virginia University’s brand style guide." [ref=f79e191]:
        - img "West Virginia University’s brand style guide." [ref=f79e192]
      - paragraph [ref=f79e194]: It’s essential for a brand to present itself in a cohesive manner across an increasing number of media, channels, and touchpoints. How can everyone within an organization speak in one voice and feel part of a singular entity? How do third parties know which Pantone colors to use and how to correctly use the brand’s logo? Brand identity guidelines provide answers to these fundamental questions in one centralized hub.
      - paragraph [ref=f79e195]: Historically, brand identity guidelines were contained in hard-cover books (remember, those things with the pages?), but as with everything else, brand style guides are making their way online.
      - heading [level=3] [ref=f79e196]:
        - link "#" [ref=f79e197] [cursor=pointer]:
          - /url: "#design-language"
        - text: Design language
      - paragraph [ref=f79e198]: While brand identity guidelines are fairly tactile, design language guidelines are a bit harder to pin down. Design language style guides articulate a general design direction, philosophy, and approach to specific projects or products.
      - paragraph [ref=f79e199]:
        - text: To present itself in a cohesive way across a growing range of products and media, Google developed a design language called
        - emphasis [ref=f79e200]: material design
        - text: . The
        - link "material design style guide" [ref=f79e201] [cursor=pointer]:
          - /url: http://www.google.com/design/spec/material-design/introduction.html
        - text: defines its overarching design philosophy, goals, and general principles, while also providing specific applications of the material design language.
      - figure "Google’s material design language." [ref=f79e202]:
        - img "Google’s material design language." [ref=f79e203]
      - paragraph [ref=f79e205]: Design language style guides can (and usually do) incorporate aspects of other style guide categories in order to make high-level concepts a bit more tangible.
      - paragraph [ref=f79e206]: Design language guidelines aren’t set in stone the way brand guidelines are. For example, one day Google will likely develop a new design language to replace material design, so while Google’s overall brand will remain intact, the design vocabulary around its products will change.
      - heading [level=3] [ref=f79e207]:
        - link "#" [ref=f79e208] [cursor=pointer]:
          - /url: "#voice-and-tone"
        - text: Voice and tone
      - paragraph [ref=f79e209]: People interact with brands across a huge array of channels and media. In addition to the digital media we’ve discussed so far, brands also operate in print, retail, outdoor, radio, TV, and other channels. When a brand must communicate across so many varied touchpoints, speaking in a unified, consistent manner becomes critical to a brand’s success.
      - blockquote [ref=f79e210]:
        - paragraph [ref=f79e211]:
          - text: A brand’s voice stays the same from day to day, but its tone has to change all the time, depending on both the situation and the reader’s feelings.
          - generic [ref=f79e212]:
            - text: –
            - link "Kate Kiefer Lee" [ref=f79e213] [cursor=pointer]:
              - /url: http://www.slideshare.net/katekiefer/kkl-c-sforum
      - paragraph [ref=f79e214]: Voice is an elemental aspect of a brand’s identity, so typically brand identity guidelines include some reference to the brand’s voice. However, these guidelines usually aren’t very nuanced, which is why voice and tone guidelines are so important.
      - paragraph [ref=f79e215]:
        - text: Voice and tone guidelines get into the weeds by articulating how the company’s voice and tone should shift across a variety of scenarios.
        - link "MailChimp’s brilliant voice and tone guidelines" [ref=f79e216] [cursor=pointer]:
          - /url: http://voiceandtone.com/
        - text: define how the brand’s tone changes across content types, so that when a user’s credit card is declined, writers know to shift away from their generally cheeky and playful tone of voice and adopt a more serious tone instead.
      - figure "MailChimp’s Voice and Tone guidelines" [ref=f79e217]:
        - img "MailChimp’s Voice and Tone guidelines" [ref=f79e218]
      - heading [level=3] [ref=f79e220]:
        - link "#" [ref=f79e221] [cursor=pointer]:
          - /url: "#writing"
        - text: Writing
      - paragraph [ref=f79e222]: The rise of the web and content-managed websites makes it easier than ever for many people within an organization to publish content. This, of course, can be a double-edged sword, as maintaining a consistent writing style for an organization with many voices can be challenging. Writing style guides provide every author some guidelines and guardrails for contributing content.
      - figure "The Economist’s writing style guide" [ref=f79e223]:
        - img "The Economist’s writing style guide" [ref=f79e224]
      - paragraph [ref=f79e226]:
        - text: Writing style guides can be extremely granular, defining particulars around punctuation and grammar, but they don’t always have to be so detailed.
        - link "Dalhousie University’s writing style guide" [ref=f79e227] [cursor=pointer]:
          - /url: http://www.dal.ca/webteam/web_style_guide/writing_for_the_web.html
        - text: provides a concise list of principles and best practices for content contributors to follow.
      - heading [level=3] [ref=f79e228]:
        - link "#" [ref=f79e229] [cursor=pointer]:
          - /url: "#code-style-guides"
        - text: Code style guides
      - paragraph [ref=f79e230]: It’s essential for teams to write legible, scalable, maintainable code. But without a way to promote and enforce code consistency, it’s easy for things to fall apart and leave every developer to fend for themselves.
      - figure "GitHub’s code style guide provides best practices for writing HTML, CSS, JavaScript, and Ruby within their organization." [ref=f79e231]:
        - img "GitHub’s code style guide provides best practices for writing HTML, CSS, JavaScript, and Ruby within their organization." [ref=f79e232]
      - paragraph [ref=f79e234]: Code style guides provide conventions, patterns, and examples for how teams should approach their code. These guidelines and guardrails help rein in the madness so that teams can focus on producing great work together rather than refactoring a bunch of sloppy, inconsistent code.
      - heading [level=2] [ref=f79e235]:
        - link "#" [ref=f79e236] [cursor=pointer]:
          - /url: "#pattern-libraries"
        - text: Pattern Libraries
      - paragraph [ref=f79e237]: And now for the main event. Pattern libraries, also known as front-end style guides, UI libraries, or component libraries, are quickly becoming a cornerstone of modern interface design.
      - figure "Code for America’s pattern library" [ref=f79e238]:
        - img "Code for America’s pattern library" [ref=f79e239]
      - paragraph [ref=f79e241]: The rest of this book will concentrate on how to approach interface design in a systematic manner, and detail how to establish and maintain pattern libraries.
      - heading [level=2] [ref=f79e242]:
        - link "#" [ref=f79e243] [cursor=pointer]:
          - /url: "#style-guide-benefits"
        - text: Style guide benefits
      - paragraph [ref=f79e244]:
        - text: Getting UIs to work across a myriad of screen sizes, devices, browsers, and environments is a tall order in and of itself. But once you factor in other team members, clients, stakeholders, and organizational quirks, things start looking downright
        - emphasis [ref=f79e245]: intimidating
        - text: .
      - paragraph [ref=f79e246]: Style guides are important tools that help prevent chaos, both from a design and development standpoint and also from an organizational perspective. Here’s why style guides are now essential tools for modern web design and development.
      - heading [level=3] [ref=f79e247]:
        - link "#" [ref=f79e248] [cursor=pointer]:
          - /url: "#consistently-awesome"
        - text: Consistently awesome
      - paragraph [ref=f79e249]:
        - strong [ref=f79e250]: Web style guides promote consistency and cohesion
        - text: across a user interface. This consistency benefits both the people who create these interfaces and also their users.
      - paragraph [ref=f79e251]: I recently visited my health insurance provider’s website to pay my bill. In the course of five clicks, I was hit with four distinct interface designs, some of which looked like they were last touched in 1999. This inconsistent experience put the burden on me, the user, to figure out what went where and how to interpret disparate interface elements. By the time I got to the payment form, I felt like I couldn’t trust the company to successfully and securely process my payment.
      - paragraph [ref=f79e252]: Style guides help iron out these inconsistencies by encouraging reuse of interface elements. Designers and developers can refer back to existing patterns to ensure the work they’re producing is consistent with what’s already been established.
      - paragraph [ref=f79e253]: Even third parties responsible for matching their UIs with the look and feel of a company’s internal UIs can make great use of a style guide. Externally hosted experiences like payment portals or localized sites can better match the look and feel of the primary experience by applying the styles defined in the guide.
      - paragraph [ref=f79e254]: Making style guides central to your process results in user interfaces that feel more united and trustworthy, which helps users accomplish their tasks faster and empowers them to master the interface.
      - heading [level=3] [ref=f79e255]:
        - link "#" [ref=f79e256] [cursor=pointer]:
          - /url: "#a-shared-vocabulary"
        - text: A shared vocabulary
      - paragraph [ref=f79e257]: What does “utility toolbar” mean? Does everyone understand what a “touch slider hero” is?
      - paragraph [ref=f79e258]: As the number of people working on a project increases, it becomes all too easy for communication breakdowns to occur. It’s not uncommon for different disciplines to have different names for the same module, and for individuals to go rogue and invent their own naming conventions. For true collaboration to occur, it’s essential for teams to speak a common language. Style guides are there to help establish that shared vocabulary.
      - figure "Giving names to patterns like 'Blocks Three-Up' in Starbucks' style guide helps team members speak the same language." [ref=f79e259]:
        - img "Giving names to patterns like 'Blocks Three-Up' in Starbucks' style guide helps team members speak the same language." [ref=f79e260]
      - paragraph [ref=f79e262]:
        - strong [ref=f79e263]: Style guides establish a consistent, shared vocabulary between everyone involved in a project
        - text: ", encouraging collaboration between disciplines and reducing communication breakdowns."
      - heading [level=3] [ref=f79e264]:
        - link "#" [ref=f79e265] [cursor=pointer]:
          - /url: "#education"
        - text: Education
      - paragraph [ref=f79e266]:
        - text: In her book
        - link "Front-End Style Guides" [ref=f79e268] [cursor=pointer]:
          - /url: http://maban.co.uk/projects/front-end-style-guides/
        - text: ", Anna Debenham deftly explains the many advantages of creating style guides, including one of the most crucial benefits: education."
      - blockquote [ref=f79e269]:
        - paragraph [ref=f79e270]:
          - text: Education is as important as documentation. A style guide can show clients that websites are systems rather than collections of pages.
          - generic [ref=f79e271]:
            - text: –
            - link "Anna Debenham" [ref=f79e272] [cursor=pointer]:
              - /url: http://maban.co.uk/projects/front-end-style-guides/
      - paragraph [ref=f79e273]:
        - text: Style guides demonstrate to clients, stakeholders, and other disciplines that there’s a lot of really thoughtful work going into a website’s design and development beyond just “Hey, let’s make a new website.”
        - strong [ref=f79e274]: A pattern library communicates the design language in a very tangible way
        - text: ", which helps stakeholders understand that an underlying system is determining the final interface."
      - paragraph [ref=f79e275]:
        - text: Style guides can help alleviate what I call
        - emphasis [ref=f79e276]: special snowflake syndrome
        - text: ", where certain departments in an organization think that they have unique problems and therefore demand unique solutions. By exposing the design system in the form of a style guide, these special snowflakes can better appreciate consistency and understand why their requests for custom designs receive pushback."
      - heading [level=3] [ref=f79e277]:
        - link "#" [ref=f79e278] [cursor=pointer]:
          - /url: "#an-empathetic-workflow"
        - text: An empathetic workflow
      - paragraph [ref=f79e279]: Education isn’t just important for clients and stakeholders. A good style guide helps inform designers and developers of the tools they have in their toolbox, and provides rules and best practices for how to use them properly.
      - paragraph [ref=f79e280]:
        - text: By making a style guide a cornerstone of your workflow (which we’ll detail in chapter 4),
        - strong [ref=f79e281]: designers and developers are forced to think about how their decisions affect the broader design system
        - text: . It becomes harder to go rogue and easier to think of the greater good. And this is exactly where you want team members to be.
      - paragraph [ref=f79e282]: A style guide provides a home for each discipline to contribute their respective considerations and concerns for patterns. By collecting all these considerations under one roof, the style guide becomes a hub for everyone involved in the project, which helps each discipline better understand the design system from many perspectives.
      - heading [level=3] [ref=f79e283]:
        - link "#" [ref=f79e284] [cursor=pointer]:
          - /url: "#testing-testing-1-2-3"
        - text: Testing, testing, 1-2-3
      - paragraph [ref=f79e285]: The homepage is broken, you say? Well, what exactly is breaking it?
      - paragraph [ref=f79e286]: The ability to pull an interface apart into its component pieces makes testing a lot easier. A style guide allows you to view interface patterns in isolation, allowing developers to zero in on what’s causing errors, browser inconsistencies, or performance issues.
      - heading [level=3] [ref=f79e287]:
        - link "#" [ref=f79e288] [cursor=pointer]:
          - /url: "#speed"
        - text: Speed
      - paragraph [ref=f79e289]:
        - text: Earlier in the chapter we discussed how
        - emphasis [ref=f79e290]: faster design and development
        - text: is one of the main reasons why UI frameworks like Bootstrap are so popular. We’re under pressure to get projects out the door as soon as humanly possible. By developing your own design system, you can reap those same speed rewards as the out-of-the-box UI tool kits.
      - paragraph [ref=f79e291]: It’s true that devising an interface design system and creating a custom pattern library initially takes a lot of time, thought, and effort. But once the pattern library is established, subsequent design and development becomes much faster, which tends to make everybody happy.
      - paragraph [ref=f79e292]:
        - text: Federico Holgado, lead UX developer at MailChimp,
        - link "explained" [ref=f79e293] [cursor=pointer]:
          - /url: http://styleguides.io/podcast/federico-holgado/
        - text: how MailChimp’s pattern library initially consisted of patterns created from the four primary screens of their app. But once they moved on to other areas of the site, they realized they were able to use existing patterns rather than having to generate brand new patterns from scratch every time.
      - blockquote [ref=f79e294]:
        - paragraph [ref=f79e295]:
          - text: "…Once we did that, as we were implementing things in other pages we started to realize: man, this system will actually work here and this system will actually work here and here."
          - generic [ref=f79e296]:
            - text: –
            - link "Federico Holgado" [ref=f79e297] [cursor=pointer]:
              - /url: http://styleguides.io/podcast/federico-holgado/
      - heading [level=3] [ref=f79e298]:
        - link "#" [ref=f79e299] [cursor=pointer]:
          - /url: "#in-it-for-the-long-haul"
        - text: In it for the long haul
      - paragraph [ref=f79e300]: There’s no doubt style guides help teams effectively get things done in the here and now. But much like a fine wine, style guides increase in value over time. The beautiful thing about interface design systems is that they can and should be modified, extended, and refined for years to come.
      - paragraph [ref=f79e301]: As previously mentioned, creating a custom pattern library requires a lot of hard work up front, but that hard work should provide a structural foundation for future iteration and refinement. Lessons learned from analytics, user testing, A/B testing, and experience should be incorporated into the style guide, making it a powerful hub for truth, knowledge, and best practices.
      - paragraph [ref=f79e302]: Better yet, even if you were to undertake a major redesign you’ll find that many of the structural interface building blocks will remain the same. You’ll still have forms, buttons, headings, other common interface patterns, so there’s no need to throw the baby out with the bath water. A style guide provides a rock-solid foundation for all future work, even if that future work may look totally different.
      - heading [level=2] [ref=f79e303]:
        - link "#" [ref=f79e304] [cursor=pointer]:
          - /url: "#style-guide-challenges"
        - text: Style guide challenges
      - paragraph [ref=f79e305]: By now the benefits of creating design systems should be abundantly clear, and hopefully visions of sugar plums and beautiful style guides are dancing through your head. But to reach style guide nirvana, you must first overcome the many treacherous challenges that come with the territory.
      - heading [level=3] [ref=f79e306]:
        - link "#" [ref=f79e307] [cursor=pointer]:
          - /url: "#the-hard-sell"
        - text: The hard sell
      - paragraph [ref=f79e308]:
        - text: To benefit from style guides, organizations must first appropriate the necessary time and budget to make them happen.
        - strong [ref=f79e309]: That requires organizations to overcome the short-term mentality that all too often creeps its way into company culture.
      - paragraph [ref=f79e310]: The long-term benefits that style guides provide are obvious to those who are already thinking about the long game. The challenge, therefore, becomes convincing those stuck in a short-term, quarter-by-quarter mindset that establishing a thoughtful design system is a smart investment in the future.
      - heading [level=3] [ref=f79e311]:
        - link "#" [ref=f79e312] [cursor=pointer]:
          - /url: "#a-matter-of-time"
        - text: A matter of time
      - blockquote [ref=f79e313]:
        - paragraph [ref=f79e314]:
          - text: The hard part is building the machine that builds the product.”
          - generic [ref=f79e315]:
            - text: –
            - link "Dennis Crowley" [ref=f79e316] [cursor=pointer]:
              - /url: http://techcrunch.com/2011/03/03/founder-stories-foursquare-crowley-machine/
      - paragraph [ref=f79e317]:
        - text: Perhaps the biggest, most unavoidable challenge is that
        - strong [ref=f79e318]: style guides are time-consuming to create
        - text: . I don’t know about you, but I don’t go into work every day twiddling my thumbs wondering what to do with my time. I’ve never met a person who isn’t feeling pressure to get work out the door, and this pressure naturally leads to focusing on the primary web project. Unfortunately, aggressive timelines and finite budgets detract from the effort required to make style guides happen, even when teams are committed to the cause.
      - heading [level=3] [ref=f79e319]:
        - link "#" [ref=f79e320] [cursor=pointer]:
          - /url: "#auxiliary-projects"
        - text: Auxiliary Projects
      - paragraph [ref=f79e321]:
        - strong [ref=f79e322]: Pattern libraries are often treated as auxiliary projects
        - text: ", rather than as the component parts of the final product. By treating pattern libraries as something separate from the core project, they tend to fall into the"
        - emphasis [ref=f79e323]: nice to have
        - text: category and become first on the chopping block when the going gets tough.
      - paragraph [ref=f79e324]: This auxiliary project conundrum reminds me of sentiments I often hear around factoring accessibility into projects. They say, “Oh, we wish we had the time and budget for accessibility, but…” The notion that accessibility (and other principles like performance and responsiveness) is a costly extra line item is a fallacy. Pattern libraries, like accessibility, are good ideas to bake into your workflow whether or not the project plan explicitly calls for them.
      - heading [level=3] [ref=f79e325]:
        - link "#" [ref=f79e326] [cursor=pointer]:
          - /url: "#maintenance-and-governance"
        - text: Maintenance and governance
      - paragraph [ref=f79e327]: Even if time and money are allocated to establish style guides, these valuable tools often die on the vine if they’re not given the focus they need to reach their true potential.
      - paragraph [ref=f79e328]:
        - strong [ref=f79e329]: A maintenance and governance strategy is critical to style guides’ success.
        - text: Style guides will be thrown in the trash (right beside all those PSDs and wireframes) and abandoned without a proper strategy in place for who will manage, maintain, and enforce them.
      - paragraph [ref=f79e330]: Style guide maintenance is a hugely important topic and deserves to be covered in detail, so we’ll dive into how to create maintainable style guides in chapter 5.
      - heading [level=3] [ref=f79e331]:
        - link "#" [ref=f79e332] [cursor=pointer]:
          - /url: "#audience-confusion"
        - text: Audience confusion
      - paragraph [ref=f79e333]:
        - strong [ref=f79e334]: Style guides can be misunderstood as tools useful only to designers or developers
        - text: ", which leads to a lack of visibility that immediately limits their effectiveness. Instead of serving as a watering hole for everyone in the organization, a style guide can become a best-kept secret guarded by one discipline. Color me naive, but I don’t think this helps foster a culture of collaboration."
      - paragraph [ref=f79e335]: Without thinking of broader audiences, style guides may come across as too vague or too technical, which can intimidate other disciplines and lead them to believe these resources aren’t for them.
      - heading [level=3] [ref=f79e336]:
        - link "#" [ref=f79e337] [cursor=pointer]:
          - /url: "#style-guide-structure"
        - text: Style guide structure
      - paragraph [ref=f79e338]: For style guides to be useful resources for everyone in an organization, they should clearly convey what they are and why they matter. Style guides should be attractive, inviting, visible, clear, and easy to use. As mentioned above, they should be aware that a whole host of audiences will be viewing them, so should therefore aim to be welcoming and useful for as many people as possible.
      - figure "Yelp's style guide homepage sports a handsome design and important intro text explaining the purpose and audience for the guide." [ref=f79e339]:
        - img "Yelp's style guide homepage sports a handsome design and important intro text explaining the purpose and audience for the guide." [ref=f79e340]
      - heading [level=3] [ref=f79e342]:
        - link "#" [ref=f79e343] [cursor=pointer]:
          - /url: "#lack-of-context"
        - text: Lack of context
      - paragraph [ref=f79e344]: Context is key to understanding a design system. Unfortunately, most pattern libraries out in the wild don’t provide any hints as to when, how, and where their components get used. Without providing context, designers and developers don’t know how global a particular pattern is, and as a result wouldn’t know which pages of their app would need to be revisited, QA’d, and tested if changes were made.
      - figure "'Highlight Block' looks useful, but where is this pattern being used?" [ref=f79e345]:
        - img "'Highlight Block' looks useful, but where is this pattern being used?" [ref=f79e346]
      - heading [level=3] [ref=f79e348]:
        - link "#" [ref=f79e349] [cursor=pointer]:
          - /url: "#lacking-a-clear-methodology"
        - text: Lacking a clear methodology
      - paragraph [ref=f79e350]:
        - text: As much as I adore the pattern libraries
        - link "out there" [ref=f79e351] [cursor=pointer]:
          - /url: http://styleguides.io/examples.html
        - text: ", I can’t help but notice a lack of structure in many of them. Don’t get me wrong, I think it’s absolutely fantastic that teams are thinking systematically and are documenting their UI patterns. But I often feel like many pattern libraries are little more than loosely arranged sprays of modules. I think there’s room for improvement."
      - heading [level=2] [ref=f79e352]:
        - link "#" [ref=f79e353] [cursor=pointer]:
          - /url: "#in-search-of-an-interface-design-methodology"
        - text: In search of an interface design methodology
      - paragraph [ref=f79e354]: For us to create experiences for this eclectic web landscape, we must evolve beyond the page metaphor that’s been with us since the birth of the web. Thankfully, organizations are embracing modularity across every aspect of the web creation process, which is leading to smarter work and more sustainable systems.
      - paragraph [ref=f79e355]: As the number of devices, browsers, and environments continues to increase at a staggering rate, the need to create thoughtful, deliberate interface design systems is becoming more apparent than ever.
      - paragraph [ref=f79e356]: Enter atomic design.
