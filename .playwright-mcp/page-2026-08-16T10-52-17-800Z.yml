              - strong [ref=e308]: DocAssistant.Researchy
              - text: ": DocAssistant.Researchy: is an AI-powered research assistant that automates deep, agent-driven research workflows in internet and best selected web sites/domains based on intent. It rapidly generates structured reports for academic assignments, compliance assessments, financial market forecasting, and news fact-checking."
              - emphasis [ref=e309]: "(Tech: C#, Azure AI Agent Service)"
