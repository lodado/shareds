              - strong [ref=e333]: LiveKit Agent Framework
              - text: . Seveum can ask typical HR questions and possibly even do a preliminary assessment (sentiment, keyword matching against job requirements, etc.). This could help HR teams handle large volumes of applications by automating the first-round interviews and spotting the promising candidates.
              - emphasis [ref=e334]: "(Tech: Python, LiveKit for live interactions)"
              - text: .
          - paragraph [ref=e335]: "Each of these honourable mention projects showcases the wide range of possibilities with AI agents from education and healthcare to retail, finance, and developer tools. They also highlight how participants used different technologies: some leaned into cloud services and enterprise data, while others experimented with frameworks and multi-agent systems."
          - heading "Conclusion" [level=2] [ref=e336]
          - paragraph [ref=e337]:
            - text: The AI Agents Hackathon 2025 demonstrated the incredible passion of developers to
            - strong [ref=e338]: build the future of AI agents
            - text: ". The winners and honourable mentions solved real problems making research easier, supply chains safer, onboarding smoother, health more personalized, AI more trustworthy, and much more. Equally impressive is the tech diversity: participants used everything from pre-built SDKs and cloud AI services to custom-crafted multi-agent frameworks."
          - paragraph [ref=e339]:
            - text: What's the significance of all this? It signals that AI agents are
            - emphasis [ref=e340]: truly here
            - text: to transform how we interact with software and data. As the Best Overall project
            - strong [ref=e341]: RiskWise
            - text: showed, even traditionally complex domains like supply chain risk can be tackled by an intelligent agent providing timely insights. The success of projects like
            - strong [ref=e342]: Apollo
            - text: and
            - strong [ref=e343]: HealthIA
            - text: hints that in the near future, we might all have specialized AI "co-workers" whether it's an AI research analyst or an AI fitness coach working alongside us.
          - paragraph [ref=e344]:
            - text: For developers, these projects are an inspiration to start developing their own agents. The hackathon provided a playground for innovation, and the results will likely spark further ideas. If you're a developer reading this, think about tasks in your domain that an autonomous or semiautonomous agent could help with. With the abundance of tools (Azure AI Agent Service, Semantic Kernel, LangChain/LangGraph, etc.) and powerful models, there's never been a better time to get started. So check out the resources at the
            - link "Agent Hack site" [ref=e345] [cursor=pointer]:
              - /url: https://aka.ms/agentshack
            - text: and get started with our
            - link "AI Agents for Beginners" [ref=e346] [cursor=pointer]:
              - /url: https://aka.ms/ai-agents-beginners
            - text: .
          - paragraph [ref=e347]:
            - strong [ref=e348]: Congratulations to all the winning teams and participants
            - text: for pushing the boundaries of what AI agents can do. We can't wait to see these projects evolve and inspire even more developers to build the next generation of AI agents.
