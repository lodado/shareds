              - text: .
            - listitem [ref=e326]:
              - strong [ref=e327]: Personal Finance Manager
              - text: ": An AI agent to help individuals manage their finances. Connect to your financial data (bank statements, budgets) and act like a financial advisor chatbot – answering questions like \"How much did I spend on groceries last month?\" or giving budgeting tips. By using Python and Azure AI Agent Service, integrate financial APIs with natural language understanding to make personal finance advice easily accessible."
              - emphasis [ref=e328]: "(Tech: Python, Azure AI Agent Service)"
